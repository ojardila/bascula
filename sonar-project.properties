# SonarQube analysis of the monorepo (https://sonarqube.int.engp.io, tailnet
# only). Run by .github/workflows/sonarqube.yml. Community Build: master is the
# project's only branch; PRs are scanned into a throwaway bascula-pr-<run id> project
# (the workflow overrides sonar.projectKey) and compared against master there.
sonar.projectKey=bascula
sonar.projectName=bascula

sonar.sources=services/api,apps/web/src,packages/shared/src
sonar.tests=services/api,apps/web/src,apps/web/e2e,packages/shared/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx,apps/web/e2e/**,apps/web/src/test/**
sonar.sourceEncoding=UTF-8

# Generated code and things that are not ours to fix:
#   schema.ts        openapi-typescript output (npm run types:api)
#   migrations       SQL, not analysed by Community Build anyway
#   testdata, html   fixtures and an embedded docs page
#   media            the landing's videos and posters (binary)
sonar.exclusions=\
  **/*.mp4,**/*.webm,**/*.webp,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.woff2,\
  **/node_modules/**,\
  **/dist/**,\
  apps/web/src/api/schema.ts,\
  services/api/migrations/**,\
  services/api/**/testdata/**,\
  services/api/internal/httpapi/mcp_docs.html,\
  services/api/bin/**,\
  **/*_test.go,\
  **/*.test.ts,\
  **/*.test.tsx,\
  apps/web/src/test/**
sonar.test.exclusions=**/node_modules/**,**/testdata/**

# Test helpers and mocks count as code for issues, not for coverage.
sonar.coverage.exclusions=\
  services/api/internal/apitest/**,\
  apps/web/src/mocks/**,\
  apps/web/src/main.tsx

sonar.go.coverage.reportPaths=services/api/coverage.out
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,packages/shared/lcov.info
