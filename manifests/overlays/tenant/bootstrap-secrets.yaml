# Mint DB password and JWT in this namespace if they are missing.
# harbor-pull must already exist here (copy from ns bascula).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bascula-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bascula-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bascula-bootstrap
subjects:
  - kind: ServiceAccount
    name: bascula-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bascula-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bascula-bootstrap-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: bascula-bootstrap
      restartPolicy: Never
      containers:
        - name: mint
          image: bitnami/kubectl:1.31
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              if ! kubectl get secret bascula-db-app -n "$NS" >/dev/null 2>&1; then
                kubectl create secret generic bascula-db-app -n "$NS" \
                  --type=kubernetes.io/basic-auth \
                  --from-literal=username=bascula_api \
                  --from-literal=password="$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 40)"
              fi
              if ! kubectl get secret bascula-api -n "$NS" >/dev/null 2>&1; then
                kubectl create secret generic bascula-api -n "$NS" \
                  --from-literal=jwt-secret="$(head -c 48 /dev/urandom | base64 | tr -d '\n')"
              fi
