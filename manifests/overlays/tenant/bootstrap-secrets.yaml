# Mint DB password and JWT in this namespace if they are missing.
# harbor-pull must already exist here (copy from ns bascula).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bascula-bootstrap
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bascula-bootstrap
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bascula-bootstrap
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: bascula-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bascula-bootstrap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bascula-bootstrap-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: bascula-bootstrap
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mint
          image: bitnamilegacy/kubectl:1.31
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              # bascula-db-api is the managed bascula_api role password.
              # Do not name this bascula-db-app: CNPG reserves <cluster>-app
              # for the bootstrap owner.
              if ! kubectl get secret bascula-db-api -n "$NS" >/dev/null 2>&1; then
                kubectl create secret generic bascula-db-api -n "$NS" \
                  --type=kubernetes.io/basic-auth \
                  --from-literal=username=bascula_api \
                  --from-literal=password="$(LC_ALL=C tr -dc 'A-Za-z0-9' </dev/urandom | head -c 40)"
              fi
              if ! kubectl get secret bascula-api -n "$NS" >/dev/null 2>&1; then
                kubectl create secret generic bascula-api -n "$NS" \
                  --from-literal=jwt-secret="$(head -c 48 /dev/urandom | base64 | tr -d '\n')"
              fi
