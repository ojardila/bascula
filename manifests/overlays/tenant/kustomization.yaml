# One farm, one namespace, one URL: {slug}.bascula.engp.io
#
# ApplicationSet (gitops) patches hostnames and PUBLIC_BASE_URL per slug.
# Secrets are minted in-cluster by bootstrap-secrets (PreSync). harbor-pull
# is cloned in by Kyverno (manifests/cluster/harbor-pull-clone.yaml). The farm
# itself arrives from the platform API on the internal port (tenant-mode.yaml).
# Backups: bascula-backup-s3 is cloned in by Kyverno from the k8 repo
# (policy sync-backup-s3, rule clone-backup-s3-bascula-farms, source
# longhorn-system/longhorn-backup-secret), so its fields are AWS_* named;
# backup-s3-keys.yaml reads those. The replacement
# at the bottom points the ObjectStore at this farm's own prefix.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Fail safe. Base hardcodes `namespace: bascula` (production). Without this
# line a tenant rendered by Argo CD lands ON TOP of production, because the
# Application's destination namespace only fills in resources that have none.
# The ApplicationSet overrides it per farm (source.kustomize.namespace =
# bascula-{slug}); if that override is ever missing, this points at a
# namespace that does not exist and the sync fails instead of clobbering prod.
namespace: bascula-tenant-namespace-not-set
resources:
  - ../../base
  - bootstrap-secrets.yaml
  - public-url-configmap.yaml
  - provision-reader-binding.yaml
patches:
  - path: postgres-small.yaml
    target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: bascula-db
  - path: web-replicas.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: bascula-web
  - path: public-base-url.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: bascula-api
  - path: tenant-mode.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: bascula-api
  - path: backup-s3-keys.yaml
    target:
      group: barmancloud.cnpg.io
      version: v1
      kind: ObjectStore
      name: bascula-backups

# Each farm backs up to its own prefix in the production bucket,
# s3://k8-longhorn-backups/bascula-{slug}, the same <bucket>/<namespace>
# convention production (.../bascula) already uses. The prefix is read from the
# ObjectStore's namespace AFTER the namespace transformer has run (kustomize
# applies replacements last), so the ApplicationSet's per-farm namespace
# override is what lands here and nothing per farm is committed.
# CronJob derives the same prefix from the downward API.
#
# Field 3 of destinationPath split on "/": s3: / "" / bucket / prefix.
replacements:
  - source:
      group: barmancloud.cnpg.io
      version: v1
      kind: ObjectStore
      name: bascula-backups
      fieldPath: metadata.namespace
    targets:
      - select:
          group: barmancloud.cnpg.io
          version: v1
          kind: ObjectStore
          name: bascula-backups
        fieldPaths:
          - spec.configuration.destinationPath
        options:
          delimiter: /
          index: 3
