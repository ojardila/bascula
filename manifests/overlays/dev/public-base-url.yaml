apiVersion: apps/v1
kind: Deployment
metadata:
  name: bascula-api
  namespace: bascula
spec:
  template:
    # Strategic-merge patch that only sets an env var; the securityContext (runAsNonRoot) is in manifests/base/api.yaml.
    # nosemgrep: yaml.kubernetes.security.run-as-non-root.run-as-non-root
    spec:
      containers:
        - name: api
          env:
            - name: PUBLIC_BASE_URL
              value: https://bascula.int.dev.engp.io
