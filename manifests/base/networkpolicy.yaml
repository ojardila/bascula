# Cilium Gateway (Envoy) assigns reserved:ingress on the hop to backends.
# Standard NetworkPolicy cannot select that identity, so this is a
# CiliumNetworkPolicy. Pattern: default-deny + Gateway ingress + DNS egress.
# API also needs Postgres (CNPG) and HTTPS to the world (GitHub repository
# dispatch for farm provisioning); tighten toFQDNs later once Hubble shows
# the stable set.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bascula-api
spec:
  description: Default-deny with Gateway ingress, DNS, Postgres, and HTTPS egress for bascula-api
  endpointSelector:
    matchLabels:
      app: bascula-api
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # A dedicated farm stack receives its farm from the platform API (prod or
    # dev) on 8081. Nothing else may reach that port.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: bascula
            app: bascula-api
        - matchLabels:
            io.kubernetes.pod.namespace: bascula-dev
            app: bascula-api
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The platform API watches and seeds each dedicated farm stack
    # (bascula-{slug}) on its internal port.
    - toEndpoints:
        - matchLabels:
            app: bascula-api
          matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: bascula-db
            cnpg.io/podRole: instance
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # The planned in-cluster mail relay (smtp.mail.svc.cluster.local:25),
    # for the "avísenme por correo" notice. Nothing listens there until the
    # relay exists, and the API sends nothing until bascula-mail is set.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: mail
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Read-only cluster reads for the provisioning progress
    # (docs/provision-progress.md). RBAC decides what it may read.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
            - port: "443"
              protocol: TCP
---
# Static SPA behind nginx. No outbound app traffic; DNS kept for symmetry
# with the cluster CNP pattern and any resolver the image may touch.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: bascula-web
spec:
  description: Default-deny with Gateway ingress + DNS egress for bascula-web
  endpointSelector:
    matchLabels:
      app: bascula-web
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
