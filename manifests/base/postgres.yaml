# The database.
#
# PostGIS is not optional here: 00001_extensions_and_roles.sql does
# `CREATE EXTENSION postgis` and the plots table stores boundaries as
# `geography`, so a plain postgres image fails on the first migration.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bascula-db
  namespace: bascula
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.5

  # The migration Job connects as this role. It has to: the first migration
  # creates extensions and a role, neither of which the database owner is
  # allowed to do.
  enableSuperuserAccess: true

  bootstrap:
    initdb:
      database: bascula
      owner: bascula
      # Business dates come from farms.timezone, never from the server, and
      # the test suite asserts that. A server on America/Bogota would hide a
      # bug that only shows up in production.
      localeCType: C
      localeCollate: C
      postInitApplicationSQL:
        # Superuser-only, and done once here so the migrations — which run as
        # a role that is not superuser in every environment — find them
        # already present and their IF NOT EXISTS turns into a no-op.
        - CREATE EXTENSION IF NOT EXISTS pgcrypto;
        - CREATE EXTENSION IF NOT EXISTS postgis;
        # bascula_app must exist before CNPG reconciles the managed role
        # below, whose inRoles names it. Left to migration 00001, a brand-new
        # cluster (every dedicated farm stack) raced it: CNPG failed with
        # `role "bascula_app" does not exist`, backed off for many minutes,
        # and the API crash-looped on password auth meanwhile. 00001 keeps
        # its IF NOT EXISTS, so it simply finds the role here.
        #
        # No dollar signs in this list. CNPG passes inline postInit*SQL to
        # the initdb job as container arguments, and Kubernetes expands
        # $(VAR) there and collapses `$$` to `$`: a `DO $$ ... $$` block
        # reached Postgres as `DO $ ... $` and failed with `syntax error at
        # or near "$"`, stopping every new dedicated farm at initdb. The DO
        # body is a plain single-quoted string instead.
        - DO 'BEGIN CREATE ROLE bascula_app NOLOGIN NOBYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END';

  managed:
    roles:
      # Declared here rather than left to 00001. The migration only creates
      # bascula_api (with the development password committed to the
      # repository) when it runs in local development; on a cluster it never
      # does, so this managed role is the only way bascula_api comes to exist
      # and its password is always the one in bascula-db-api.
      #
      # NOBYPASSRLS is the point: row level security is the tenant boundary,
      # so the role the API connects with must not be able to step over it.
      - name: bascula_api
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        bypassrls: false
        # Named bascula-db-api on purpose. CNPG reserves <cluster>-app
        # (bascula-db-app) for the bootstrap owner (`bascula`) and will spam
        # "wrong username 'bascula_api' in secret, expected 'bascula'" if the
        # managed API role reuses that secret name.
        passwordSecret:
          name: bascula-db-api
        # bascula_app carries the table grants; bascula_api gets them by
        # membership. Migration 00001 does this GRANT itself, but a managed
        # role is reconciled declaratively — CNPG revokes any membership not
        # listed here, so leaving it out silently undid the migration and the
        # API got "permission denied for table login_failures" on its first
        # request. bascula_app is created at initdb (postInitApplicationSQL
        # above), so this is satisfiable from the cluster's first second.
        inRoles:
          - bascula_app

  # Backups go through the barman-cloud plugin, not spec.backup. The in-tree
  # barmanObjectStore still works in 1.30 but CloudNativePG removes it
  # entirely in 1.31, so writing it that way would have bought backups that
  # break at the next minor upgrade.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: bascula-backups

  postgresql:
    parameters:
      max_connections: "100"
      # PostGIS ships as a shared library; nothing to preload, but the planner
      # does better with a realistic estimate of what the page cache holds.
      effective_cache_size: 768MB
      shared_buffers: 256MB

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  storage:
    size: 10Gi
    storageClass: longhorn

  # Keep the two instances off the same machine. Longhorn already replicates
  # the volume three ways, but both Postgres processes on one node means a
  # node reboot takes the primary and its standby together.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

---
# Where the backups live: the same DigitalOcean Spaces bucket Longhorn and the
# etcd snapshots already use.
#
# Longhorn's own snapshots protect the disk, not the database — restoring one
# gives you the data files mid-write and Postgres recovers from its WAL on
# start. This is the copy that survives losing the room.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: bascula-backups
  namespace: bascula
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://k8-longhorn-backups/bascula
    endpointURL: https://nyc3.digitaloceanspaces.com
    s3Credentials:
      accessKeyId:
        name: bascula-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: bascula-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      # WAL is what makes point-in-time recovery possible: the base backup
      # gets you to Sunday, the WAL replays from there to the minute before
      # whatever went wrong.
      compression: gzip
      maxParallel: 2
    data:
      compression: gzip

---
# A base backup every Sunday at 03:00. WAL ships continuously between them,
# so the recovery window is the last backup plus every transaction since.
#
# The schedule is six fields, not five: CNPG puts seconds first.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bascula-db-weekly
  namespace: bascula
spec:
  schedule: "0 0 3 * * 0"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: bascula-db
