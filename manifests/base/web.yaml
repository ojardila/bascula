# The built SPA behind nginx. Stateless, so it scales freely and rolls
# normally — unlike the API, which is pinned to one replica by its volume.
---
apiVersion: v1
kind: Service
metadata:
  name: bascula-web
  namespace: bascula
spec:
  selector:
    app: bascula-web
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bascula-web
  namespace: bascula
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bascula-web
  template:
    metadata:
      labels:
        app: bascula-web
    spec:
      # nginx never talks to the Kubernetes API.
      automountServiceAccountToken: false
      # Two replicas on one node is not redundancy.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bascula-web
      # Harbor's bascula project is private. The secret is created
      # against the cluster, never committed — see README.md.
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: harbor.int.engp.io/bascula/web:v0.2.104
          env:
            # The release /version.json reports (nginx.conf). CD stamps it
            # together with the image tags: the image itself is promoted
            # unchanged across releases that did not touch the web.
            - name: BASCULA_VERSION
              value: v0.2.104
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            # nginx writes its pid and temp bodies, and the entrypoint renders
            # the nginx.conf template into conf.d at start; everything else
            # is read-only.
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /tmp}
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - {name: conf, emptyDir: {}}
---
# A node drain takes at most one web pod at a time. maxUnavailable rather
# than minAvailable, so the single-replica overlays (dev, tenant) can still
# be drained.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bascula-web
  namespace: bascula
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: bascula-web
