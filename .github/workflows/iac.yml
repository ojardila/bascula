# Misconfiguration scan of the infrastructure code with Trivy: the Kubernetes
# manifests (manifests/) and both Dockerfiles. Harbor's Trivy already scans the
# built images for vulnerable packages; this looks at how they are deployed.
# The workflows themselves are covered by Semgrep's p/github-actions.
#
# MEDIUM and above go to GitHub code scanning (category trivy-config) and fail
# the job; LOW (resource limits, UID ranges, HEALTHCHECK) is printed in the
# log only. Reviewed exceptions live in .trivyignore.yaml with a reason.
#
# The scanner runs from the pinned image (tag + digest), not trivy-action.

name: IaC

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  # Forks and Dependabot get a read-only token: no SARIF upload.
  CAN_WRITE: >-
    ${{ github.event_name != 'pull_request' || (
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]') }}

jobs:
  trivy-config:
    name: trivy config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan (all severities, for the log)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --quiet --disable-telemetry --skip-version-check \
            --skip-dirs '**/node_modules' --ignorefile .trivyignore.yaml .

      - name: SARIF (MEDIUM and above)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --quiet --disable-telemetry --skip-version-check \
            --skip-dirs '**/node_modules' --ignorefile .trivyignore.yaml \
            --severity MEDIUM,HIGH,CRITICAL --format sarif --output trivy-config.sarif .

      - name: Upload SARIF to code scanning
        if: env.CAN_WRITE == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Gate (MEDIUM and above)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" config \
            --quiet --disable-telemetry --skip-version-check \
            --skip-dirs '**/node_modules' --ignorefile .trivyignore.yaml \
            --severity MEDIUM,HIGH,CRITICAL --exit-code 1 --format table .
