# Record a farm in gitops and, if mode=dedicated, let ApplicationSet
# launch its own namespace, Postgres, API, web and URL.
#
# Shared mode (default): the farm already lives in the platform DB (signup).
# This job only writes tenants/shared/{slug}.yaml as the catalog.
#
# Dedicated mode: writes tenants/dedicated/{slug}.yaml; Argo ApplicationSet
# creates Application bascula-{slug} from manifests/overlays/tenant.
#
# CI never has kubeconfig. Argo applies. harbor-pull is cloned into the new
# namespace by the Kyverno policy in manifests/cluster/harbor-pull-clone.yaml,
# and the platform API copies the farm into the new stack once it answers
# (services/api/internal/httpapi/provision.go).
name: Provision tenant
# The platform API finds this run by its name to show progress on the
# waiting screen (services/api/internal/httpapi/provision_progress.go). The
# name carries an opaque ref (a keyed hash of the slug), NEVER the slug: this
# repository is public, and so are its run titles and logs. A manual run is
# titled "manual".
run-name: Provision tenant ${{ github.event.client_payload.ref || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: DNS label (lapalma)
        required: true
      farmName:
        description: Display name
        required: true
      email:
        description: Owner email
        required: true
      mode:
        description: shared (catalog only) or dedicated (own stack)
        type: choice
        options: [shared, dedicated]
        default: shared
  repository_dispatch:
    types: [provision-tenant]

# Signup data (farm name, owner, email, phone) is chosen by an anonymous
# stranger, and this repository's logs are public. So no value ever goes
# through ${{ }} or a step's `env:` (both are printed in the log), and nothing
# derived from it is echoed: the script reads the event file itself, masks
# every value first thing, writes the tenant file and commits it quietly. The
# YAML is written with every value JSON-quoted (JSON is YAML), so neither a
# quote nor a newline can add a key.
permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout gitops
        uses: actions/checkout@v7
        with:
          repository: ojardila/gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - name: Write and commit the tenant file
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, re, subprocess
          from pathlib import Path

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          src = event.get("client_payload") or event.get("inputs") or {}

          def field(name, limit):
              v = str(src.get(name) or "").strip()
              if v:
                  # Masked before anything else can print it.
                  for line in v.splitlines():
                      if line.strip():
                          print(f"::add-mask::{line.strip()}", flush=True)
              if len(v) > limit or re.search(r"[\x00-\x1f\x7f]", v):
                  raise SystemExit(f"bad {name}: too long or has control characters")
              return v

          slug = field("slug", 63).lower()
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
              raise SystemExit("bad slug")
          mode = field("mode", 16)
          if not mode:
              mode = "dedicated" if os.environ["GITHUB_EVENT_NAME"] == "repository_dispatch" else "shared"
          if mode not in ("shared", "dedicated"):
              raise SystemExit("bad mode")
          doc = {
              "slug": slug,
              "farmName": field("farmName", 200),
              "email": field("email", 320),
              "ownerName": field("ownerName", 200),
              "phone": field("phone", 40),
              "mode": mode,
              "url": f"https://{slug}.bascula.engp.io",
              "createdAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          folder = Path("gitops/tenants") / mode
          folder.mkdir(parents=True, exist_ok=True)
          rel = f"tenants/{mode}/{slug}.yaml"
          (Path("gitops") / rel).write_text("".join(f"{k}: {json.dumps(v, ensure_ascii=False)}\n" for k, v in doc.items()))

          def git(*args, check=True):
              # Output swallowed: git echoes paths and commit subjects.
              return subprocess.run(["git", "-C", "gitops", *args], check=check,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode

          git("config", "user.email", "bascula-cd@users.noreply.github.com")
          git("config", "user.name", "bascula-cd")
          git("add", rel)
          if git("diff", "--cached", "--quiet", check=False) == 0:
              print("tenant file unchanged")
              raise SystemExit(0)
          git("commit", "-q", "-m", f"tenant {slug} ({mode})")
          # Two signups in the same minute race for main; the loser rebases.
          import time
          for attempt in (1, 2, 3):
              if git("push", "-q", "origin", "HEAD:main", check=False) == 0:
                  print("tenant file committed")
                  raise SystemExit(0)
              time.sleep(attempt * 2)
              git("pull", "-q", "--rebase", "origin", "main", check=False)
          raise SystemExit("could not push the tenant file")
          PY
