# Record a farm in gitops and, if mode=dedicated, let ApplicationSet
# launch its own namespace, Postgres, API, web and URL.
#
# Shared mode (default): the farm already lives in the platform DB (signup).
# This job only writes tenants/shared/{slug}.yaml as the catalog.
#
# Dedicated mode: writes tenants/dedicated/{slug}.yaml; Argo ApplicationSet
# creates Application bascula-{slug} from manifests/overlays/tenant.
#
# CI never has kubeconfig. Argo applies. harbor-pull is cloned into the new
# namespace by the Kyverno policy in manifests/cluster/harbor-pull-clone.yaml,
# and the platform API copies the farm into the new stack once it answers
# (services/api/internal/httpapi/provision.go).
name: Provision tenant
# The platform API finds this run by its name to show progress on the
# waiting screen (services/api/internal/httpapi/provision_progress.go).
run-name: Provision tenant ${{ github.event.client_payload.slug || inputs.slug }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: DNS label (fincasanjose)
        required: true
      farmName:
        description: Display name
        required: true
      email:
        description: Owner email
        required: true
      mode:
        description: shared (catalog only) or dedicated (own stack)
        type: choice
        options: [shared, dedicated]
        default: shared
  repository_dispatch:
    types: [provision-tenant]

# Signup data (farm name, owner, email, phone) is chosen by an anonymous
# stranger. It never reaches a shell through ${{ }}: every value arrives as an
# environment variable, and the YAML is written with every value JSON-quoted
# (JSON is YAML), so neither a quote nor a newline can add a command or a key.
permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout gitops
        uses: actions/checkout@v7
        with:
          repository: ojardila/gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - name: Write tenant file
        env:
          SLUG: ${{ github.event.client_payload.slug || inputs.slug }}
          NAME: ${{ github.event.client_payload.farmName || inputs.farmName }}
          EMAIL: ${{ github.event.client_payload.email || inputs.email }}
          OWNER: ${{ github.event.client_payload.ownerName }}
          PHONE: ${{ github.event.client_payload.phone }}
          MODE: ${{ github.event.client_payload.mode || inputs.mode || (github.event_name == 'repository_dispatch' && 'dedicated') || 'shared' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, re
          from pathlib import Path

          def field(name, limit):
              v = os.environ.get(name, "").strip()
              if len(v) > limit or re.search(r"[\x00-\x1f\x7f]", v):
                  raise SystemExit(f"bad {name}: too long or has control characters")
              return v

          slug = field("SLUG", 63).lower()
          if not re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", slug):
              raise SystemExit(f"bad slug {slug!r}")
          mode = field("MODE", 16) or "shared"
          if mode not in ("shared", "dedicated"):
              raise SystemExit(f"bad mode {mode!r}")
          doc = {
              "slug": slug,
              "farmName": field("NAME", 200),
              "email": field("EMAIL", 320),
              "ownerName": field("OWNER", 200),
              "phone": field("PHONE", 40),
              "mode": mode,
              "url": f"https://{slug}.bascula.engp.io",
              "createdAt": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          folder = Path("gitops/tenants") / mode
          folder.mkdir(parents=True, exist_ok=True)
          body = "".join(f"{k}: {json.dumps(v, ensure_ascii=False)}\n" for k, v in doc.items())
          (folder / f"{slug}.yaml").write_text(body)
          print(body)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"TENANT_FILE=tenants/{mode}/{slug}.yaml\nTENANT_SLUG={slug}\nTENANT_MODE={mode}\n")
          PY

      - name: Commit and push
        working-directory: gitops
        run: |
          set -euo pipefail
          git config user.email "bascula-cd@users.noreply.github.com"
          git config user.name "bascula-cd"
          git add "$TENANT_FILE"
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "tenant ${TENANT_SLUG} (${TENANT_MODE})"
          # Two signups in the same minute race for main; the loser rebases.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
            git pull --rebase origin main
          done
          exit 1
