# Secret scanning with gitleaks, on top of GitHub's own secret scanning and
# push protection (which cover provider tokens only). Runs from the pinned
# gitleaks image; no license or token needed.
#
#   pull request -> the PR's commits only (base..head), so an old commit
#                   cannot turn an unrelated PR red;
#   push master  -> the pushed commits (before..after);
#   manual run   -> the full history of every branch.
#
# Findings are redacted in the log. False positives go in .gitleaks.toml with
# a reason; a real secret is rotated first, then removed.

name: gitleaks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="--no-merges ${PR_BASE}..${PR_HEAD}" ;;
            push)
              if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                range="-1 ${PUSH_AFTER}"
              else
                range="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi ;;
            *) range="--all" ;;
          esac
          echo "gitleaks git --log-opts=\"${range}\""
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git --redact --no-banner --config .gitleaks.toml \
            --log-opts="${range}" .
