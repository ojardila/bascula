# SonarQube analysis (https://sonarqube.int.engp.io, tailnet only; the server
# is apps/sonarqube in the gitops repo). The job fails when the analysis does
# (master: the quality gate; PR: a regression against master or a new issue
# in the changed files that master does not have), after the summary and PR
# comment are written. It IS a required check: ruleset "master: require
# semgrep" requires semgrep, gitleaks, api and sonarqube.
#
# Besides Sonar's own rules it imports external issues: golangci-lint (gosec,
# staticcheck, errorlint; services/api/.golangci.yml) and the console's
# eslint-plugin-security warnings (apps/web/eslint.config.js).
#
# Community Build analyses one branch per project, so:
#   push to master -> project `bascula`, the dashboard everyone looks at.
#   pull request   -> scratch project `bascula-pr`, compared with `bascula`
#                     by scripts/sonar-report.py, posted as one PR comment
#                     (updated in place) and as the job summary.
#
# The tests run here again, with coverage, instead of handing coverage over
# from ci.yml: CI on master is called by CD and skips suites a PR already
# ran, so there is no complete coverage to hand over. A failing test does not
# stop the scan (ci.yml reports it); the coverage of that run is still sent.
#
# SPEED. This was the slowest check on every PR (~13 min, 2026-10-03): the web
# coverage (~340 s) and the API coverage (~255 s) ran one after the other on
# one runner before the scan. They now run on their own runners at the same
# time, the web split in three (vitest --shard) and the API's apitest suite in
# four processes (scripts/ci/go-test.sh), and hand their reports to the scan
# job as artifacts. Shards' reports are merged by summing hits, which gives the
# figures one run would (checked: 9031 vs 9032 of 9701 web lines, and the same
# 91.5% for Go). A change that touches none of the analysed sources (docs,
# other workflows) does not run this at all.
#
# Order matters: the PR's code (tests, linters) runs in jobs that have no
# secrets and never join the tailnet. The scan job joins the tailnet only
# after its own last PR-code step, and the token is only in the scan and
# report steps.

name: SonarQube

on:
  # No `paths:` here on purpose: `sonarqube` is a REQUIRED check on master,
  # and a workflow that never starts never reports it, which would block a
  # docs-only PR forever. The `changes` job below skips the heavy jobs
  # instead; a job skipped by `if` counts as passed for a required check.
  pull_request:
  push:
    branches: [master]
    paths:
      - 'services/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'manifests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'sonar-project.properties'
      - 'scripts/sonar-report.py'
      - 'scripts/ci/go-test.sh'
      - 'scripts/ci/apitest-weights.txt'
      - 'scripts/ci/merge-lcov.py'
      - '.github/workflows/sonarqube.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Did this PR touch anything Sonar analyses? Pushes to master are already
  # filtered by `paths:` above, so this only decides for pull requests.
  changes:
    name: sonar inputs changed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
            - 'services/api/**'
            - 'apps/web/**'
            - 'packages/**'
            - 'manifests/**'
            - 'package.json'
            - 'package-lock.json'
            - 'sonar-project.properties'
            - 'scripts/sonar-report.py'
            - 'scripts/ci/go-test.sh'
            - 'scripts/ci/apitest-weights.txt'
            - 'scripts/ci/merge-lcov.py'
            - '.github/workflows/sonarqube.yml'

  coverage-api:
    name: coverage (api)
    # Same rule as the image builds in ci.yml: forks and Dependabot get no
    # Actions secrets, so the scan could not run; do not test for it either.
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' || (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:17-3.6-alpine
        env:
          POSTGRES_USER: postgres
          # A throwaway service container: trust auth, so there is no
          # password in this file for secret scanners to flag.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bascula
          TZ: UTC
          PGTZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bascula"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum

      - name: api tests with coverage
        continue-on-error: true
        working-directory: services/api
        env:
          APP_ENV: development
          ADMIN_DATABASE_URL: postgres://postgres@localhost:5432/bascula?sslmode=disable
          TEST_ADMIN_DATABASE_URL: postgres://postgres@localhost:5432/bascula?sslmode=disable
          REPORT_BUDGET: 6s
          # -coverpkg=./...: most of store/, auth/ and tenant/ is exercised
          # through the httpapi and apitest suites, not by tests in those
          # packages. The script merges the shards' profiles.
          COVERPROFILE: coverage.raw
        run: |
          set -euo pipefail
          go run ./cmd/api -migrate
          rc=0
          ../../scripts/ci/go-test.sh || rc=$?
          # The profile names files by import path; SonarQube wants paths
          # relative to the repo root.
          sed 's#^github.com/ojardila/bascula/##' coverage.raw > coverage.out
          exit "$rc"

      # External issues for SonarQube. Does not fail the job: the findings
      # are reported through the quality gate.
      - name: golangci-lint report
        continue-on-error: true
        working-directory: services/api
        env:
          GOLANGCI_IMAGE: golangci/golangci-lint:v2.13.2@sha256:ba07dffad130794ae79ebaa0056809d18c0168f3f846480ffd3eb6c04578b83d
        run: |
          docker run --rm -v "$PWD:/app" -w /app -v "$(go env GOMODCACHE):/go/pkg/mod" "$GOLANGCI_IMAGE" \
            golangci-lint run --issues-exit-code=0 --path-prefix=services/api \
              --max-issues-per-linter=0 --max-same-issues=0 \
              --output.checkstyle.path=golangci-lint.xml --output.text.path=stdout ./...

      - name: Stage the reports
        if: always()
        run: |
          mkdir -p sonar-out
          cp services/api/coverage.out services/api/golangci-lint.xml sonar-out/ 2>/dev/null || true
          ls -l sonar-out

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-api
          path: sonar-out/
          if-no-files-found: ignore
          retention-days: 1

  coverage-web:
    name: coverage (web ${{ matrix.shard }}/3)
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' || (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: web tests with coverage
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          npm ci
          # Same version as vitest, not saved: no lockfile churn for a report.
          V=$(node -p "require('vitest/package.json').version")
          # reportOnFailure: one failing test must not drop the whole web
          # coverage (master once reported 0% new coverage that way).
          npm install --no-save --workspace apps/web "@vitest/coverage-v8@${V}"
          npx --workspace apps/web vitest run --shard="${SHARD}/3" --coverage.enabled \
            --coverage.provider=v8 --coverage.reportOnFailure --coverage.reporter=lcovonly \
            --coverage.reportsDirectory="coverage-${SHARD}"

      # Once, on the first shard: the linter reads every file anyway.
      - name: eslint report (security rules)
        if: matrix.shard == 1
        continue-on-error: true
        run: |
          npx --workspace apps/web eslint . -f json -o eslint-raw.json || true
          # Only eslint-plugin-security's findings: the react-hooks warnings
          # are already tracked by the lint itself.
          python3 - <<'PY'
          import json
          d = json.load(open("apps/web/eslint-raw.json"))
          for f in d:
              f["messages"] = [m for m in f["messages"] if (m.get("ruleId") or "").startswith("security/")]
              f["errorCount"] = sum(1 for m in f["messages"] if m["severity"] == 2)
              f["warningCount"] = sum(1 for m in f["messages"] if m["severity"] == 1)
          json.dump(d, open("apps/web/eslint-report.json", "w"))
          print(sum(len(f["messages"]) for f in d), "eslint-plugin-security findings")
          PY

      - name: Stage the reports
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p sonar-out
          cp "apps/web/coverage-${SHARD}/lcov.info" "sonar-out/lcov-${SHARD}.info" 2>/dev/null || true
          cp apps/web/eslint-report.json sonar-out/ 2>/dev/null || true
          ls -l sonar-out

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-web-${{ matrix.shard }}
          path: sonar-out/
          if-no-files-found: ignore
          retention-days: 1

  sonarqube:
    name: sonarqube
    needs: [changes, coverage-api, coverage-web]
    # !cancelled(): a coverage job that failed still hands over what it has;
    # the scan runs with whatever coverage arrived. A PR that touches nothing
    # Sonar reads skips it, and a skipped required check counts as passed.
    if: >-
      !cancelled() && needs.changes.outputs.code == 'true' && (
        github.event_name != 'pull_request' || (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_SCAN: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: secrets present
        id: secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ] || [ -z "$TS_ID" ]; then
            echo "SonarQube or Tailscale secrets are not available to this run; skipping." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Full history: SonarQube uses blame for new-code detection and authors.
      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - if: steps.secrets.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # A coverage job that died before uploading leaves a gap, not a failure.
      - if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sonar-*
          path: sonar-in
          merge-multiple: true

      # Back where sonar-project.properties looks for them. The web shards'
      # LCOV files become one (hits summed per line, function and branch).
      - name: Place the reports
        if: steps.secrets.outputs.ok == 'true'
        run: |
          set -euo pipefail
          mkdir -p sonar-in apps/web/coverage
          ls -l sonar-in
          for f in coverage.out golangci-lint.xml; do
            if [ -f "sonar-in/$f" ]; then cp "sonar-in/$f" services/api/; fi
          done
          if [ -f sonar-in/eslint-report.json ]; then cp sonar-in/eslint-report.json apps/web/; fi
          shopt -s nullglob
          shards=(sonar-in/lcov-*.info)
          if [ "${#shards[@]}" -gt 0 ]; then
            python3 scripts/ci/merge-lcov.py apps/web/coverage/lcov.info "${shards[@]}"
          else
            echo "::warning::no web coverage arrived from the coverage jobs"
          fi

      - name: shared tests with coverage
        if: steps.secrets.outputs.ok == 'true'
        continue-on-error: true
        working-directory: packages/shared
        env:
          TZ: America/Bogota
        run: |
          node --test --experimental-test-coverage --test-reporter=lcov \
            --test-reporter-destination=lcov.info src/*.test.ts

      # Only now, with the PR's code done running, join the tailnet.
      - name: Join the tailnet
        if: steps.secrets.outputs.ok == 'true'
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: bascula-sonar-${{ github.run_id }}-${{ github.run_attempt }}
          # No `args`: the action passes --accept-routes itself and Tailscale
          # 1.94 rejects the flag given twice. No --accept-dns (see
          # .github/actions/harbor): public Cloudflare resolves *.int.engp.io.
          timeout: 5m

      - name: Wait for SonarQube
        if: steps.secrets.outputs.ok == 'true'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -sf --max-time 5 "${SONAR_HOST_URL}/api/system/status" | grep -q '"status":"UP"'; then
              echo "SonarQube up after ${i} tries"; exit 0
            fi
            echo "waiting for SonarQube (${i})"; sleep 2
          done
          echo "SonarQube did not become reachable"; tailscale status || true; exit 1

      - name: Analysis version
        id: version
        if: steps.secrets.outputs.ok == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          # master: the release line (VERSION), so "new code" is since the last
          # release. PR: the scratch project's history reads by PR number.
          if [ "$PR_SCAN" = "true" ]; then v="pr-${PR}"; else v="$(cat VERSION)"; fi
          echo "value=${v}" >> "$GITHUB_OUTPUT"

      - name: Scan
        if: steps.secrets.outputs.ok == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ env.PR_SCAN == 'true' && 'bascula-pr' || 'bascula' }}
            -Dsonar.projectName=${{ env.PR_SCAN == 'true' && 'bascula-pr' || 'bascula' }}
            -Dsonar.projectVersion=${{ steps.version.outputs.value }}

      - name: Changed files
        if: steps.secrets.outputs.ok == 'true' && env.PR_SCAN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --jq '.[] | select(.status != "removed") | .filename' > changed-files.txt
          wc -l < changed-files.txt

      - name: Report
        id: report
        if: steps.secrets.outputs.ok == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT: ${{ env.PR_SCAN == 'true' && 'bascula-pr' || 'bascula' }}
          SONAR_BASE_PROJECT: ${{ env.PR_SCAN == 'true' && 'bascula' || '' }}
          CHANGED_FILES: ${{ env.PR_SCAN == 'true' && 'changed-files.txt' || '' }}
          OUT: sonar-report.md
        run: |
          python3 scripts/sonar-report.py
          cat sonar-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the PR
        if: steps.secrets.outputs.ok == 'true' && env.PR_SCAN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- sonarqube-report -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@sonar-report.md >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@sonar-report.md >/dev/null
          fi

      - name: Gate
        if: steps.secrets.outputs.ok == 'true'
        env:
          VERDICT: ${{ steps.report.outputs.verdict }}
        run: |
          if [ "$VERDICT" = "fail" ]; then
            echo "::error::SonarQube: see the summary above (quality gate, or new issues against master)."
            exit 1
          fi
