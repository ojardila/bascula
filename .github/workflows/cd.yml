name: CD

# Releases what CI tested, as fast as it safely can:
#
#   plan ─┬─ ci (only if the PR did not already test these exact sources)
#         ├─ images (api, web: built on the PR; here only if missing)
#         └─ release ── production (approval) ── live on every farm
#
# BUILD ONCE, PROMOTE. Images are keyed by their sources
# (scripts/ci/source-keys.sh) and pushed as src-<key> by the PR's CI. A merge
# does not build them again: `release` copies src-<key> to the release tag
# vX.Y.Z in Harbor (same digest, no pull, no rebuild). The release number is
# not baked into either image; the web reads it from its pod's environment,
# which this workflow stamps into manifests/base/web.yaml.
#
# Both images are still released under ONE tag, from one commit. The web is
# built against services/api/openapi.yaml, so a release where the two halves
# came from different sources is a client talking to a schema it was not
# generated from, the exact drift `npm run types:check` exists to catch. The
# web key includes openapi.yaml for that reason.
#
# The release tag is pinned on the ArgoCD Applications in ojardila/gitops:
# automatically to bascula-dev (internal), and to production and every
# dedicated farm (one commit) only after the GitHub Environment `production`
# is approved. Argo is told right away (scripts/ci/argocd-refresh.sh) instead
# of finding out on its 3-minute poll.
#
# A push to master that touches either half auto-bumps the patch version when
# the current VERSION is already tagged, then publishes vX.Y.Z.

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'services/api/**'
      - 'manifests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'VERSION'
      - '.github/workflows/cd.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/images.yml'
      - '.github/actions/**'
      - 'scripts/ci/**'
  workflow_dispatch:

# No workflow-wide lock: tests and image builds may run in parallel. The
# release job is serialized without cancellation so every completed release
# gets a chance to publish, while production has its own gitops lock below.

env:
  REGISTRY: harbor.int.engp.io
  PROJECT: bascula

# Jobs get a read-only token unless they say otherwise (release creates the
# tag and the GitHub release; plan reads PRs and runs).
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      api_key: ${{ steps.keys.outputs.api }}
      web_key: ${{ steps.keys.outputs.web }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: keys
        name: Source keys
        run: |
          set -euo pipefail
          scripts/ci/source-keys.sh | tee -a "$GITHUB_OUTPUT"

      # Did CI already pass on exactly these sources? A PR's CI tests its
      # head; if the commit on master differs from that head only in the
      # files the release commit stamps (VERSION, manifests/, which no test
      # reads), running the suites again proves nothing new. Anything else
      # (a direct push, master moved under the PR, a red or missing run)
      # runs the full CI here.
      - id: tested
        name: Tested on its PR?
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          verdict() { echo "tested=$1" >> "$GITHUB_OUTPUT"; echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          pr=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
                 --jq '[.[] | select(.merged_at != null)][0] | "\(.number) \(.head.sha)"' 2>/dev/null || true)
          [ -n "$pr" ] && [ "$pr" != "null null" ] || verdict false "No merged PR for ${SHA}: running CI."
          read -r number head <<<"$pr"
          git fetch --quiet origin "refs/pull/${number}/head" || verdict false "Could not fetch PR #${number}: running CI."
          if ! git diff --quiet "$head" "$SHA" -- . ':(exclude)VERSION' ':(exclude)manifests'; then
            git diff --stat "$head" "$SHA" -- . ':(exclude)VERSION' ':(exclude)manifests' | tail -n 5
            verdict false "PR #${number} head ${head:0:7} differs from ${SHA:0:7} (master moved under it): running CI."
          fi
          c=$(gh run list -R "$REPO" --workflow ci.yml --commit "$head" --event pull_request \
                --json status,conclusion --jq '[.[] | select(.status == "completed")][0].conclusion' 2>/dev/null || true)
          [ "$c" = "success" ] || verdict false "CI on PR #${number} head ${head:0:7} is '${c:-missing}': running CI."
          verdict true "CI passed on PR #${number} for these exact sources: not running it again."

  ci:
    needs: plan
    if: needs.plan.outputs.tested != 'true'
    # What ci.yml asks for; a called workflow cannot exceed its caller.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  # Normally a no-op: the PR's CI already pushed src-<key>. Each builds only
  # when its key is missing, in parallel with CI.
  images:
    strategy:
      matrix:
        component: [api, web]
    uses: ./.github/workflows/images.yml
    with:
      component: ${{ matrix.component }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      HARBOR_ROBOT_NAME: ${{ secrets.HARBOR_ROBOT_NAME }}
      HARBOR_ROBOT_SECRET: ${{ secrets.HARBOR_ROBOT_SECRET }}

  release:
    needs: [plan, ci, images]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.images.result == 'success'
      && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: bascula-release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      go: ${{ steps.guard.outputs.go }}
      needs_review: ${{ steps.review.outputs.needs_review }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The release lock is acquired before this step. Fetch the tag and
      # master refs while holding it: if a newer release already contains this
      # push's commit, this run is a clean no-op instead of publishing an old
      # source or moving dev and production backwards.
      - id: guard
        name: Superseded?
        run: |
          set -uo pipefail
          git fetch --quiet origin master --tags
          last=$(git tag -l 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$last" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$last" 2>/dev/null; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Superseded: ${last} already contains ${GITHUB_SHA:0:7}." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - id: version
        if: steps.guard.outputs.go == 'true'
        name: Resolve version
        run: |
          set -euo pipefail
          # A prior release may have advanced master while this run was
          # waiting for the lock. Start from that exact latest HEAD, not the
          # commit checked out when this workflow was queued.
          git fetch --quiet origin master --tags
          git reset --hard origin/master
          current="$(tr -d ' \n' < VERSION)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be semver X.Y.Z, got '$current'" >&2
            exit 1
          fi
          # Loop rather than bump once: a tag can already exist for the next
          # patch if a previous push reached GitHub before its job failed.
          while git rev-parse "refs/tags/v${current}" >/dev/null 2>&1; do
            IFS=. read -r major minor patch <<<"$current"
            current="${major}.${minor}.$((patch + 1))"
          done
          echo "${current}" > VERSION
          echo "version=v${current}" >> "$GITHUB_OUTPUT"
          keys=$(scripts/ci/source-keys.sh HEAD)
          echo "api_key=$(printf '%s\n' "$keys" | awk -F= '$1 == "api" { print $2 }')" >> "$GITHUB_OUTPUT"
          echo "web_key=$(printf '%s\n' "$keys" | awk -F= '$1 == "web" { print $2 }')" >> "$GITHUB_OUTPUT"
          echo "### Releasing \`v${current}\` from \`$(git rev-parse --short HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.guard.outputs.go == 'true'
        uses: ./.github/actions/harbor
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          robot-name: ${{ secrets.HARBOR_ROBOT_NAME }}
          robot-secret: ${{ secrets.HARBOR_ROBOT_SECRET }}
          hostname: bascula-rel-${{ github.run_id }}-${{ github.run_attempt }}

      # A current buildx: imagetools create --prefer-index=false.
      - if: steps.guard.outputs.go == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build once, promote: the release tag is a registry-side copy of the
      # image CI built from these sources. Nothing is rebuilt or pulled.
      - name: Promote the images to the release tag
        if: steps.guard.outputs.go == 'true'
        env:
          V: ${{ steps.version.outputs.version }}
          API: ${{ steps.version.outputs.api_key }}
          WEB: ${{ steps.version.outputs.web_key }}
        run: |
          set -euo pipefail
          base="${REGISTRY}/${PROJECT}"
          scripts/ci/promote.sh "${base}/api:src-${API}" "${base}/api:${V}" &
          scripts/ci/promote.sh "${base}/web:src-${WEB}" "${base}/web:${V}" &
          wait -n && wait -n
          {
            echo "| image | from | to |"
            echo "|---|---|---|"
            echo "| api | src-${API} | ${V} |"
            echo "| web | src-${WEB} | ${V} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stamp the version into the manifests
        if: steps.guard.outputs.go == 'true'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          v = os.environ["V"]
          p = Path("manifests/base/kustomization.yaml")
          s = p.read_text()
          # Both entries, one tag: the two images ship together by design.
          s = re.sub(r"(newTag:\s*)v[0-9]+\.[0-9]+\.[0-9]+", r"\g<1>" + v, s)
          p.write_text(s)

          # The migration Job is an ArgoCD sync hook with
          # hook-delete-policy: BeforeHookCreation, so it is deleted and
          # recreated on every sync — a completed Job's pod spec is immutable
          # and could not otherwise pick up the new image.
          p = Path("manifests/base/api.yaml")
          s = p.read_text()
          s = re.sub(r"(image:\s*harbor\.int\.engp\.io/bascula/api:)v[0-9]+\.[0-9]+\.[0-9]+",
                     r"\g<1>" + v, s)
          p.write_text(s)

          # The web image carries no release number; /version.json reports
          # the one in its pod's environment.
          p = Path("manifests/base/web.yaml")
          s = p.read_text()
          s = re.sub(r"(image:\s*harbor\.int\.engp\.io/bascula/web:)v[0-9]+\.[0-9]+\.[0-9]+",
                     r"\g<1>" + v, s)
          s, n = re.subn(r"(name:\s*BASCULA_VERSION\s*\n\s*value:\s*)v[0-9]+\.[0-9]+\.[0-9]+",
                         r"\g<1>" + v, s)
          assert n == 1, f"expected one BASCULA_VERSION in web.yaml, got {n}"
          p.write_text(s)
          PY
          git diff --stat

      - name: Commit, tag, and release
        if: steps.guard.outputs.go == 'true'
        env:
          V: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # master is protected by the ruleset "master: require semgrep": a
          # commit must have a passing `semgrep` check before it lands. The
          # release commit is pushed straight to master, so it goes through
          # the repo's write deploy key, the ruleset's only bypass actor
          # (GITHUB_TOKEN cannot bypass on a personal-account repo). Reads
          # (fetch, pull) still use the checkout's token on origin.
          if [ -z "${RELEASE_DEPLOY_KEY}" ]; then
            echo "RELEASE_DEPLOY_KEY is empty" >&2
            exit 1
          fi
          install -m 600 /dev/null /tmp/release_key
          printenv RELEASE_DEPLOY_KEY > /tmp/release_key
          export GIT_SSH_COMMAND='ssh -i /tmp/release_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
          push_url="git@github.com:${GITHUB_REPOSITORY}.git"

          # Re-apply the release stamp after a rebase conflict. This is
          # needed when master moved by a release commit while this run was
          # preparing its tag: the old stamp must never be rebased over it.
          restamp() {
            python3 - <<'PY'
          import os, re
          from pathlib import Path

          v = os.environ["V"]
          p = Path("VERSION")
          p.write_text(v.removeprefix("v") + "\n")
          p = Path("manifests/base/kustomization.yaml")
          s = p.read_text()
          s = re.sub(r"(newTag:\s*)v[0-9]+\.[0-9]+\.[0-9]+", r"\g<1>" + v, s)
          p.write_text(s)
          p = Path("manifests/base/api.yaml")
          s = p.read_text()
          s = re.sub(r"(image:\s*harbor\.int\.engp\.io/bascula/api:)v[0-9]+\.[0-9]+\.[0-9]+", r"\g<1>" + v, s)
          p.write_text(s)
          p = Path("manifests/base/web.yaml")
          s = p.read_text()
          s = re.sub(r"(image:\s*harbor\.int\.engp\.io/bascula/web:)v[0-9]+\.[0-9]+\.[0-9]+", r"\g<1>" + v, s)
          s, n = re.subn(r"(name:\s*BASCULA_VERSION\s*\n\s*value:\s*)v[0-9]+\.[0-9]+\.[0-9]+", r"\g<1>" + v, s)
          assert n == 1, f"expected one BASCULA_VERSION in web.yaml, got {n}"
          p.write_text(s)
          PY
          }

          commit_release() {
            git add VERSION manifests/base/
            # Unlike GITHUB_TOKEN pushes, a deploy-key push starts workflows.
            # [skip ci] keeps the release commit (VERSION and manifests only)
            # from re-running CD, Semgrep and SonarQube on itself.
            git commit -m "Release ${V}" -m "[skip ci]"
          }
          tag_release() {
            # The parent is the exact master HEAD being released, even after
            # a successful rebase.
            git tag -a "${V}" -m "${V}" -m "source: $(git rev-parse HEAD^)"
          }

          commit_release
          tag_release
          pushed=false
          for attempt in 1 2 3; do
            if git push "${push_url}" HEAD:master && git push "${push_url}" "${V}"; then
              pushed=true
              break
            fi
            echo "Release push conflicted; rebasing (attempt ${attempt}/3)." >&2
            git tag -d "${V}" >/dev/null 2>&1 || true
            git fetch --quiet origin master --tags
            if ! git pull --rebase --autostash origin master; then
              git rebase --abort || true
              git reset --hard origin/master
              restamp
              commit_release
            fi
            tag_release
          done
          if [ "${pushed}" != true ]; then
            echo "Could not push ${V} after three attempts" >&2
            exit 1
          fi
          gh release create "${V}" --title "${V}" --generate-notes || true

      # Dev rolls on every release. Production waits for approval below.
      - name: Pin dev in gitops
        if: steps.guard.outputs.go == 'true'
        env:
          V: ${{ steps.version.outputs.version }}
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GITOPS_DEPLOY_KEY}" ]; then
            echo "GITOPS_DEPLOY_KEY is empty" >&2
            exit 1
          fi
          install -m 600 /dev/null /tmp/gitops_key
          printenv GITOPS_DEPLOY_KEY > /tmp/gitops_key
          export GIT_SSH_COMMAND='ssh -i /tmp/gitops_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
          git clone --depth 1 git@github.com:ojardila/gitops.git /tmp/gitops
          python3 scripts/pin-gitops.py /tmp/gitops/applications/bascula-dev.yaml "$V"
          git -C /tmp/gitops config user.name  "github-actions[bot]"
          git -C /tmp/gitops config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gitops add applications/bascula-dev.yaml
          if git -C /tmp/gitops diff --cached --quiet; then
            echo "gitops already pinned bascula-dev at ${V}"
          else
            git -C /tmp/gitops commit -m "bascula-dev: pin ${V}"
            pushed=false
            for attempt in 1 2 3; do
              if git -C /tmp/gitops push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "gitops push conflicted; rebasing (attempt ${attempt}/3)." >&2
              git -C /tmp/gitops pull --rebase origin main
            done
            if [ "${pushed}" != true ]; then
              echo "Could not pin bascula-dev at ${V} after three attempts" >&2
              exit 1
            fi
          fi
          scripts/ci/argocd-refresh.sh "$(git -C /tmp/gitops rev-parse HEAD)" applications/bascula-dev.yaml

      # Does this release need a human before production? Anything that
      # changes the database (a migration, the Postgres manifest) or the
      # cluster-level manifests does. Compared with the release production
      # runs NOW, so a release that was never approved cannot slip its
      # migration through with the next one. Only consulted when auto-approval
      # is switched on (see the production job).
      - id: review
        if: steps.guard.outputs.go == 'true'
        name: Needs review before production?
        run: |
          set -uo pipefail
          prod=$(sed -n 's/^ *targetRevision: *//p' /tmp/gitops/applications/bascula.yaml | head -n 1)
          if ! git rev-parse -q --verify "refs/tags/${prod}" >/dev/null; then
            echo "needs_review=true" >> "$GITHUB_OUTPUT"
            echo "Production runs '${prod}', not a known tag: approval required." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          risky=$(git diff --name-only "${prod}" HEAD -- \
                    services/api/migrations manifests/base/postgres.yaml manifests/cluster \
                    manifests/overlays/prod manifests/overlays/tenant)
          if [ -n "$risky" ]; then
            echo "needs_review=true" >> "$GITHUB_OUTPUT"
            { echo "Changes since production (${prod}) that need a human:"; echo '```'; echo "$risky"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "needs_review=false" >> "$GITHUB_OUTPUT"
            echo "No migrations or database/cluster manifests changed since production (${prod})." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  production:
    needs: release
    # !cancelled(): without it the implicit success() also looks at `ci`,
    # which is SKIPPED whenever the PR already tested the sources, and a
    # skipped ancestor skips this job too (what happened to v0.2.40).
    if: >-
      !cancelled() && needs.release.result == 'success'
      && needs.release.outputs.go == 'true'
    # AUTO-APPROVAL IS OFF. `production` requires Oscar's approval, always.
    # Setting the repository variable PROD_AUTO_APPROVE=true would send
    # releases WITHOUT migrations or database/cluster changes (see the review
    # step above) through the `production-auto` environment instead, which
    # has no reviewers. Anything risky still goes through `production`.
    # Not enabled without Oscar's OK; see docs/deploy-speed.md.
    environment: ${{ (vars.PROD_AUTO_APPROVE == 'true' && needs.release.outputs.needs_review == 'false') && 'production-auto' || 'production' }}
    concurrency:
      group: bascula-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only for the Argo CD webhook (tailnet-only). Not for Harbor.
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: bascula-prod-${{ github.run_id }}-${{ github.run_attempt }}
          # No `args`: the action passes --accept-routes itself and Tailscale
          # 1.94 rejects the flag given twice.
          timeout: 5m

      # Production and every dedicated farm move in ONE gitops commit, and
      # Argo is told about it at once, so the farms roll together with the
      # apex instead of one poll interval (or two) behind it.
      - id: pin
        name: Pin production and the farms in gitops
        env:
          V: ${{ needs.release.outputs.version }}
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GITOPS_DEPLOY_KEY}" ]; then
            echo "GITOPS_DEPLOY_KEY is empty" >&2
            exit 1
          fi
          install -m 600 /dev/null /tmp/gitops_key
          printenv GITOPS_DEPLOY_KEY > /tmp/gitops_key
          export GIT_SSH_COMMAND='ssh -i /tmp/gitops_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
          git clone --depth 1 git@github.com:ojardila/gitops.git /tmp/gitops
          # Never move production back: a newer release may already be live.
          live=$(sed -n 's/^ *targetRevision: *//p' /tmp/gitops/applications/bascula.yaml | head -n 1)
          newest=$(printf '%s\n%s\n' "$live" "$V" | sort -V | tail -n 1)
          if [ "$live" != "$V" ] && [ "$newest" = "$live" ]; then
            echo "Production already runs ${live}, newer than ${V}: nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/pin-gitops.py /tmp/gitops/applications/bascula.yaml "$V"
          # Dedicated farm stacks run the production release too.
          if [ -f /tmp/gitops/applications/bascula-tenants.yaml ]; then
            python3 scripts/pin-gitops.py /tmp/gitops/applications/bascula-tenants.yaml "$V"
          fi
          git -C /tmp/gitops config user.name  "github-actions[bot]"
          git -C /tmp/gitops config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/gitops add applications/bascula.yaml applications/bascula-tenants.yaml
          if git -C /tmp/gitops diff --cached --quiet; then
            echo "gitops already pinned production at ${V}"
          else
            git -C /tmp/gitops commit -m "bascula: pin ${V}"
            for _ in 1 2 3; do
              git -C /tmp/gitops push origin HEAD:main && break
              git -C /tmp/gitops pull --rebase origin main
            done
          fi
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "pinned_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          scripts/ci/argocd-refresh.sh "$(git -C /tmp/gitops rev-parse HEAD)" \
            applications/bascula.yaml applications/bascula-tenants.yaml

      # /version.json is answered from the pod's environment and never cached,
      # so "live" means exactly: a pod of release V answered. The apex and
      # every dedicated farm are watched at the same time, then Cloudflare's
      # copy of their HTML is dropped in one purge.
      #
      # This repository is public, and so are this job's log, its summary and
      # its annotations. Farm hosts are never printed, and neither is how many
      # there are: every slug is masked the moment it is read, farms are
      # reported only in aggregate ("all live" / "some not live"), and the
      # purge prints nothing but its status. The apex is the only named row.
      - name: Wait until live, then purge Cloudflare
        if: steps.pin.outputs.moved == 'true'
        env:
          V: ${{ needs.release.outputs.version }}
          PINNED_AT: ${{ steps.pin.outputs.pinned_at }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        # curl's output goes to `python3 -c '<fixed script>'` as JSON data on stdin, never run as code.
        # nosemgrep: yaml.github-actions.security.gha-curl-pipe-shell.gha-curl-pipe-shell
        run: |
          set -euo pipefail
          if [ -z "${CF_API_TOKEN}" ]; then
            echo "CF_API_TOKEN is empty" >&2
            exit 1
          fi
          farm_hosts=""
          for f in /tmp/gitops/tenants/dedicated/*.yaml; do
            [ -f "$f" ] || continue
            slug=$(sed -n 's/^slug:[[:space:]]*//p' "$f" | tr -d "\"' " | head -1)
            [ -n "$slug" ] || continue
            # Farm slugs are not secrets; masking only keeps them out of a public log, defense in depth.
            echo "::add-mask::${slug}" # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
            farm_hosts="${farm_hosts} ${slug}.bascula.engp.io"
          done
          hosts="bascula.engp.io${farm_hosts}"
          mkdir -p /tmp/farm-live

          # The apex is reported by name; a farm host only leaves a marker
          # file behind when it did NOT go live, and nothing else.
          wait_live() {
            local host="$1" v=""
            for i in $(seq 1 180); do
              v=$(curl -sk --max-time 8 "https://${host}/version.json?snap=${GITHUB_RUN_ID}-${i}" \
                    | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)
              if [ "$v" = "$V" ]; then
                if [ "$host" = "bascula.engp.io" ]; then
                  echo "| bascula.engp.io | $(( $(date +%s) - PINNED_AT ))s |" >> /tmp/live.md
                  echo "bascula.engp.io live on ${V}"
                fi
                return 0
              fi
              sleep 5
            done
            if [ "$host" = "bascula.engp.io" ]; then
              echo "::warning::bascula.engp.io still reports '${v:-nothing}' after 15 minutes"
              echo "| bascula.engp.io | not yet (${v:-?}) |" >> /tmp/live.md
            else
              mktemp /tmp/farm-live/late.XXXXXX > /dev/null
            fi
          }
          : > /tmp/live.md
          for h in $hosts; do wait_live "$h" & done
          wait
          if [ -n "$farm_hosts" ]; then
            if [ -n "$(ls -A /tmp/farm-live)" ]; then
              echo "::warning::at least one farm host did not report ${V} within 15 minutes"
              echo "| farm hosts | not all live yet |" >> /tmp/live.md
            else
              echo "farm hosts live on ${V}"
              echo "| farm hosts | all live |" >> /tmp/live.md
            fi
          fi
          { echo "### Live on ${V} (seconds after the gitops pin)"; echo "| host | live after |"; echo "|---|---|"; cat /tmp/live.md; } >> "$GITHUB_STEP_SUMMARY"

          export HOSTS="$hosts"
          zone=$(curl -sS --fail --max-time 15 \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones?name=engp.io" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin)["result"]; assert r, "no engp.io zone"; print(r[0]["id"])')
          # Cloudflare hosts purge does not take a wildcard: the apex plus
          # every dedicated farm host collected above.
          code=$(curl -sS --fail --max-time 20 -o /tmp/cf-purge.json -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/zones/${zone}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$(python3 -c 'import json,os; print(json.dumps({"hosts": os.environ["HOSTS"].split()}))')")
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/cf-purge.json"))
          if not d.get("success"):
              # Codes only: a Cloudflare message can quote a farm host.
              print("purge failed:", [e.get("code") for e in d.get("errors") or []], file=sys.stderr)
              sys.exit(1)
          print("purged the apex and the farm hosts")
          PY
          echo "purge http ${code}"
