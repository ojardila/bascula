# The jobs run all at once, so the wall clock is the slowest one and not the
# sum. On a PR, a path filter first decides which suites the change can
# affect: a web-only PR does not wait for the Go suite, an API-only PR does
# not lint the console. The cheap guards (migration order, money rules) run
# always. Called from CD (a release whose sources were not already tested on
# their PR), everything runs.
#
# On a PR the images are built too, in parallel with the tests, and pushed to
# Harbor as src-<source key> (images.yml). CD then promotes those exact
# images to the release tag instead of building them again after the merge.
#
# The job that guards the money needs no dependencies at all. Every test in
# packages/shared imports only node: builtins and Node runs the TypeScript
# directly, so they answer without npm ever running. (The golden cases in
# packages/shared/golden/cases are walked by the Go suite, `api` below.)
#
# That is worth protecting rather than treating as a happy accident: the rules
# that decide what a picker is paid should be checkable without a network, and
# the first dependency added to those files takes that away.

name: CI

on:
  # No push trigger: on master, CD calls this workflow (below) when the
  # release's sources were not already tested on their PR. Running it again
  # on every push only doubled the runner time.
  pull_request:
  workflow_dispatch:
  # CD calls this and waits. A release that has not passed these jobs
  # does not get a Harbor tag or a gitops pin.
  workflow_call:

# Read-only token. paths-filter lists the PR's files through the API, hence
# pull-requests: read. A workflow_call caller must grant at least this.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # A new push cancels the run still going for the same branch. Nobody reads
  # the result of a commit that has already been replaced. CD's call is a
  # different event, so it never cancels anything.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      # Outside a PR (CD's call, a manual run) everything counts as changed.
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'services/api/**'
              - 'packages/shared/golden/**'
              - 'docs/database.md'
              - 'scripts/**'
              - '.github/**'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'services/api/openapi.yaml'
              - 'package.json'
              - 'package-lock.json'
              - 'scripts/**'
              - '.github/**'

  # Built on same-repo PRs only: a fork has no Harbor secrets. Skipped work
  # is cheap here: a key already in Harbor is not built twice.
  #
  # Not on Dependabot's PRs either: GitHub runs them without Actions secrets,
  # so joining the tailnet failed and every Dependabot PR showed two red
  # checks that said nothing about the change. CD builds any key that is
  # missing after the merge (images.yml), so nothing is skipped for good.
  images:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    strategy:
      matrix:
        component: [api, web]
    uses: ./.github/workflows/images.yml
    with:
      component: ${{ matrix.component }}
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      HARBOR_ROBOT_NAME: ${{ secrets.HARBOR_ROBOT_NAME }}
      HARBOR_ROBOT_SECRET: ${{ secrets.HARBOR_ROBOT_SECRET }}

  # Every source file carries "// SPDX-License-Identifier: MIT" on line 1
  # (#386). Seconds, no install; a new file without it fails here.
  spdx:
    name: spdx headers (no install)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-spdx.sh

  migrations:
    name: migration order (no install)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Needs history, not a shallow clone: the check compares what this
      # branch adds against the versions already on master.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: nothing added may sit at or below master's high-water mark
        run: |
          git fetch --quiet origin master
          ./scripts/check-migrations.sh origin/master

  money:
    name: money rules (no install)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Farm dates are America/Bogota. A UTC runner at 00:00–05:00 treats
      # "today" as tomorrow and flags this afternoon's kilos as future work.
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: shared — formatters, week keys, enums against the schema
        run: node --test src/*.test.ts
        working-directory: packages/shared

  # Production dependencies with a known high or critical advisory. A separate
  # job, so a fresh advisory upstream shows up red on the PR without blocking
  # unrelated work unless branch protection is told to require it.
  npm-audit:
    name: npm audit
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: npm audit --omit=dev --audit-level=high --package-lock-only

  web:
    name: console
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace apps/web
      # `build` runs types:check first, which fails when the generated client
      # has fallen behind services/api/openapi.yaml. That gate is the point.
      - run: npm run build --workspace apps/web

  # vitest was the long pole of every web PR and of CD: 160 files, ~265 s on
  # one runner (2026-10-03). Split by file across three runners (vitest's own
  # --shard), every file still runs exactly once and in the same isolation.
  # Measured on 4 CPUs: 112 s whole, 33 / 31 / 46 s per shard.
  web-tests:
    name: console tests (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx --workspace apps/web vitest run --shard=${{ matrix.shard }}/3

  types:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The static checks need no database, so they run beside the tests instead
  # of in front of them (~25 s off the api job, the long pole).
  api-lint:
    name: api lint
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - run: go vet ./...
        working-directory: services/api
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal ./migrations)"
        working-directory: services/api
      # govulncheck reports only advisories whose vulnerable symbols are
      # reachable from this module, so the step is quiet by default and
      # fails only on something CI would otherwise ship. Covers the Go
      # stdlib too, which Dependabot does not see (toolchain, not go.mod).
      - name: govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
        working-directory: services/api

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A service container, not docker compose: GitHub pulls and starts it
      # while the checkout runs, so it costs almost nothing on the clock.
      # postgis/postgis is the official image; the compose file uses imresamu
      # only because that one publishes no arm64 manifest and half the team is
      # on Apple silicon. Runners are x86.
      postgres:
        image: postgis/postgis:17-3.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bascula
          TZ: UTC
          PGTZ: UTC
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bascula"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: migrate
        run: go run ./cmd/api -migrate
        working-directory: services/api
        env:
          # Creates bascula_api with the development password (store.MigrateDev).
          APP_ENV: development
          ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bascula?sslmode=disable
      # docs/database.md is generated from the migrations. This database has
      # just had every migration applied and nothing else, which is exactly
      # what `make db-diagram` builds locally, so regenerate and compare.
      - name: database diagram is up to date
        run: |
          go run ./cmd/dbdiagram -out ../../docs/database.md
          if [ -n "$(git status --porcelain -- ../../docs/database.md)" ]; then
            git --no-pager diff -- ../../docs/database.md | head -n 80
            echo "::error file=docs/database.md::docs/database.md does not match the migrations. Run 'make db-diagram' and commit docs/database.md."
            exit 1
          fi
        working-directory: services/api
        env:
          ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bascula?sslmode=disable
      # `go test ./...` with internal/apitest split over four processes, each
      # with its own scratch database (see the script). 186 s of apitest ran
      # in one process; measured on 4 CPUs: 163 s -> 39 s for the whole suite.
      - name: test
        run: ../../scripts/ci/go-test.sh
        working-directory: services/api
        env:
          TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bascula?sslmode=disable
          # The season perf test's ceiling on a shared runner; see reportBudget.
          REPORT_BUDGET: 6s
