# Báscula API — the contract.
#
# This file is not documentation. It is checked against the running router by
# internal/apitest/openapi_test.go on every `make test`, and the build goes red
# when the two disagree about:
#
#   * which routes exist        — every mounted route is here, and every
#                                 operation here is mounted, with the same
#                                 method and the same path parameters;
#   * who may call them         — `x-roles` on every operation is compared
#                                 against auth.Matrix, the one permission
#                                 table this service has;
#   * which action backs them   — `x-action` is the auth.Action the route
#                                 declares, so a route cannot be documented
#                                 under somebody else's permissions;
#   * which errors exist        — the ErrorCode enum below is compared against
#                                 domain.AllCodes().
#
# A hand-written contract that nobody verifies rots in a fortnight, and a rotten
# contract is worse than none: the client generates types from it and trusts
# them. So this one cannot rot silently.
#
# CONVENTIONS THAT APPLY EVERYWHERE, stated once instead of on sixty operations:
#
#   * The tenant travels in the access token and never in a path. There is no
#     {farmId} anywhere below, deliberately (§6 of docs/arquitectura-api.md):
#     a farm id in a path invites somebody to trust it.
#   * A resource of another farm answers 404, never an empty list and never a
#     zero total. An endpoint that adds something up confirms the resource
#     belongs to this farm before it adds, because a zero is a credible answer
#     and a credible wrong answer is the dangerous kind.
#   * Money is integer minor units (`...Cents`), int64, always. There is no
#     float anywhere near a peso.
#   * Every write accepts a client-generated `id` (UUIDv7) and is idempotent by
#     (farm_id, id): retrying after a timeout returns 200 with the existing
#     resource, not 409.
#   * "Delete" is logical everywhere. DELETE marks the row inactive and PATCH
#     {"status":"active"} brings it back.
#   * Business dates are calendar days in the farm's own timezone. Several
#     responses carry them as `date-time` at midnight UTC rather than as
#     `date`, because they are Go time.Time values on the wire. That is
#     recorded here rather than tidied away: the spec describes what the server
#     sends.
#   * Errors are always {"error":{"code","message","details"}}. The client
#     branches on `code`; `message` is English and is not shown to a picker.
#
# `x-roles` values: "public" (no token at all), "superadmin" (the platform
# flag on the user, which no farm role can substitute for), or the farm roles
# that may call it, in seniority order: owner, admin, weigher.

openapi: 3.0.3

info:
  title: Báscula API
  version: "1.0.0"
  description: |
    Multi-tenant farm labour and payroll API. One binary, one Postgres, four
    roles. Isolation is row level security keyed on `app.farm_id`, set from the
    access token inside the transaction that serves the request.
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: health
  - name: auth
  - name: farm
  - name: admin
  - name: workers
  - name: plots
  - name: activities
  - name: catalogs
  - name: work-records
  - name: pickups
  - name: money
  - name: products
  - name: stock
  - name: sales
  - name: expenses
  - name: uploads
  - name: reports
  - name: users
  - name: sync
  - name: import

paths:

  # ---------------------------------------------------------------------------
  # Health
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness
      description: |
        Touches no database and opens no transaction, so it answers even when
        the tenant machinery cannot.
      x-action: health
      x-roles: [public]
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /v1/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Register a farm and its first owner
      description: |
        Public by decision 2: a farm goes live without anybody at the platform
        intervening. It is therefore the most exposed surface in the system and
        carries three limits — a per-IP rate limit that survives a restart
        because it lives in Postgres, a cap on farms per email address, and
        mandatory email verification before the first session.

        An address that already has an account may open a second farm, but only
        by presenting that account's password.
      x-action: signup
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: The farm exists and is active; the owner cannot log in yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: |
            EMAIL_TAKEN when the address exists and the password did not match,
            FARM_LIMIT_REACHED when it already owns as many farms as it may.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: RATE_LIMITED — too many signups from this address this hour.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Open a session
      description: |
        Answers 200 with a session when the account belongs to exactly one farm
        or `farmId` was given. When it belongs to several and none was chosen,
        it answers 400 with `details.farms`, which is a list to choose from and
        not a failure.

        An unknown address and a wrong password produce the same
        INVALID_CREDENTIALS.
      x-action: auth.login
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: A token pair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400":
          description: |
            Malformed, or the account belongs to more than one farm and none
            was chosen — then `details.farms` lists them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: INVALID_CREDENTIALS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: EMAIL_NOT_VERIFIED, FARM_SUSPENDED, or no membership at all.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate the token pair
      description: |
        Every refresh token is single use. Presenting one that was already
        rotated means a replay or a stolen copy, so the whole family is revoked
        rather than the request merely failing — that is how a lent phone gets
        killed from the web.
      x-action: auth.refresh
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: A new token pair; the presented refresh token is now dead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: TOKEN_EXPIRED, or TOKEN_REUSED — which also closed the session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: FARM_SUSPENDED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Verify the owner's address
      description: |
        Consumes the token echoed by signup (in development) or mailed to the
        address. Until this succeeds, login answers EMAIL_NOT_VERIFIED.
      x-action: auth.verify_email
      x-roles: [public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema:
                type: object
                required: [userId, verified]
                properties:
                  userId: { type: string, format: uuid }
                  verified: { type: boolean }
        "400":
          description: The link is not valid any more.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Close the session
      description: |
        Revokes the whole refresh family. Logging out an unknown token is still
        a successful logout: the caller asked to have no session and now has
        none.
      x-action: auth.logout
      x-roles: [owner, admin, weigher]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Closed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/me:
    get:
      tags: [auth]
      operationId: me
      summary: The caller and their farm
      x-action: me.read
      x-roles: [owner, admin, weigher]
      responses:
        "200":
          description: Who this token belongs to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------------
  # The farm's own record
  # ---------------------------------------------------------------------------
  /v1/farm:
    get:
      tags: [farm]
      operationId: getFarm
      summary: The farm this token points at
      description: |
        There is no `/v1/farms/{id}`: the tenant travels in the token.

        The weigher gets the same route and a shorter answer — `priceCents` is
        absent for him, because that is the price of a kilo. Timezone and
        currency stay, because his client needs them to render a date and an
        amount.
      x-action: farm.read
      x-roles: [owner, admin, weigher]
      responses:
        "200":
          description: The farm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [farm]
      operationId: updateFarm
      summary: Edit the farm's configuration
      description: |
        A partial body: a field that is absent keeps its value. The timezone is
        editable and validated — a bad IANA name would silently shift every
        business day the farm has ever recorded, so it is a 400 and not a
        stored value.
      x-action: farm.write
      x-roles: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FarmPatch" }
      responses:
        "200":
          description: The farm as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Farm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------------
  # Super-admin console
  # ---------------------------------------------------------------------------
  /v1/admin/farms:
    get:
      tags: [admin]
      operationId: adminListFarms
      summary: List the farms on the platform
      description: |
        Decision 2 made the public signup the front door and left this console
        with two jobs: see the farms and suspend one. It cannot read an
        employee, a work record or a peso of anybody's money, and the
        projection is the enforcement of that — every field returned is a
        column of `farms`.

        The platform flag on the user is required. No farm role, not even
        owner, substitutes for it.
      x-action: admin.farms.read
      x-roles: [superadmin]
      parameters:
        - name: q
          in: query
          description: Substring of the farm's name, case-insensitive.
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, suspended] }
      responses:
        "200":
          description: Every farm, or those matching the filter.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminFarm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/farms/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [admin]
      operationId: adminSetFarmStatus
      summary: Suspend a farm, or bring it back
      description: |
        Suspension is not a delete and it is not instant. Login and refresh
        both refuse a suspended farm, so a phone already holding an access
        token keeps working until that token expires — at most fifteen minutes.
        That is the intended trade: a shorter token to make suspension
        immediate would mean refreshing every few minutes on a handset that
        spends the day without signal.
      x-action: admin.farms.write
      x-roles: [superadmin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        "200":
          description: The farm as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminFarm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Workers
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Users — who can log in to this farm
  #
  # A `user` is global: one address, one password, possibly several farms. A
  # `membership` is what gives that account a role INSIDE this farm, and it is
  # the row every one of these routes operates on. The distinction is not
  # pedantry: `users` has no farm_id and therefore no RLS policy, so a route
  # that addressed the account directly would be reaching across the platform
  # and relying on a WHERE clause to be right.
  #
  # Two rules no permission table can express, because both depend on the
  # caller's own row:
  #
  #   1. A farm always keeps at least one owner. A farm with none cannot be
  #      repaired from inside the product — nobody left may write the farm
  #      record, set a price or promote anybody — so the change is refused with
  #      409 LAST_OWNER.
  #   2. Nobody raises their own role, AND nobody grants a role above their
  #      own. The second half is what makes the first worth having: an
  #      administrator who could make a second account an owner could log into
  #      it and promote the first. Both are 403.
  # ---------------------------------------------------------------------------
  /v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: Who can log in to this farm
      description: |
        The farm's members with the role each holds HERE, most senior first.
        An account that belongs to several farms appears once, with this
        farm's role.
      x-action: users.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: The members of this farm.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/FarmUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: inviteUser
      summary: Add somebody to this farm, with a role
      description: |
        ## Why this is not an emailed invitation

        There is no mail sender in this service. Signup works around that by
        echoing the verification token in development; an "invitation" that
        minted a token nothing could deliver would be a screen that appears to
        work and never does. So the administrator creates the account and hands
        the password over — which is how the farm already works, since the
        person who buys the weighing app is the person setting up the weigher's
        phone, standing next to them.

        Omit `password` and the server mints one and returns it as
        `temporaryPassword`, ONCE, in this response and nowhere else: the row
        keeps an argon2id hash like every other password and there is no way to
        read it again. Send `password` (10 characters or more) to choose it
        yourself, and nothing is echoed.

        The address is marked verified, because somebody holding a session on
        this farm vouched for it. That is a different act from the open signup,
        where the token in the mailbox is the only thing stopping a stranger
        from registering farms against an address they do not own.

        ## An address that already has an account

        It joins this farm with the role given, and its password is NOT
        touched: an administrator of one farm resetting the password of an
        account belonging to another would be a takeover with an invite button
        on it.

        ## Idempotency

        The key is the address, because a user is global and a farm cannot mint
        ids in somebody else's namespace. Inviting an address that is already a
        member answers 200 with the membership it already has and does NOT
        change its role — a repeated invite is a retry, and a retry that
        silently re-roled somebody would be a demotion nobody asked for.
        Changing a role is PATCH, which is a different sentence.
      x-action: users.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInvite" }
      responses:
        "200":
          description: That address is already a member here; nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmUser" }
        "201":
          description: |
            Added. `temporaryPassword` is present only when the server minted
            one, and only in this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitedUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            FORBIDDEN — the permission table refused this role, or rule 2 did:
            you cannot grant a role above your own.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: EMAIL_TAKEN — two invites for the same new address raced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    patch:
      tags: [users]
      operationId: setUserRole
      summary: Change what somebody may do on this farm
      description: |
        The only field is `role`. Setting the role somebody already has is a
        200 and writes nothing.

        Refused by rule 2 when you would be raising your OWN role, or granting
        one above your own. Refused by rule 1 with 409 LAST_OWNER when the
        change would take the owner role off the last owner: the count is taken
        with the rows locked, inside the same transaction, so two
        administrators demoting the last two owners at the same moment cannot
        both read "there are two" and both succeed.

        A user of another farm is 404. That is the boundary, not a courtesy:
        `users` has no RLS, and this route reaches the account through the
        membership precisely so that it cannot address one.
      x-action: users.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [owner, admin, weigher] }
      responses:
        "200":
          description: The membership as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FarmUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            FORBIDDEN — the permission table refused this role, or rule 2 did:
            you cannot raise your own role, and you cannot grant one above your
            own.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: LAST_OWNER — this farm would be left with no owner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [users]
      operationId: removeUser
      summary: Take an account's access to this farm away
      description: |
        Removes the membership and revokes every refresh token that account
        holds on this farm, in one transaction. Without the second half,
        "access removed" and "still logged in for the next sixty days" would be
        true at once — and the person being removed is often exactly the person
        whose handset is the reason for removing them.

        It is a real DELETE and the only one in this service, which does not
        contradict "eliminar nunca borra": what is removed is a permission, not
        a person. The account, its other farms and everything it ever wrote
        here stay where they were.

        Removing your OWN access is refused: it logs you out of the farm you
        are administering with no way back in from inside the product, and the
        request can arrive without the dialog that would have warned you.
      x-action: users.write
      x-roles: [owner, admin]
      responses:
        "204":
          description: Access removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            LAST_OWNER — this farm would be left with no owner. Or CONFLICT —
            you cannot remove your own access.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------------------
  # The audit of decision 8
  # ---------------------------------------------------------------------------
  /v1/reactivations:
    get:
      tags: [workers]
      operationId: listReactivations
      summary: Every worker the server put back on the payroll by itself
      description: |
        Decision 8 of docs/decisiones.md: a worker who was taken off the
        payroll and turns up with NEW work comes back on by himself, because if
        he is working he is still on the farm. The owner took that decision
        against the team's advice and attached one condition to it — that it is
        RECORDED, with the labour that provoked it and the handset it came
        from, so the person who took the decision to deactivate can see that it
        was undone and why. Undoing a human decision in silence is the one
        thing that must not happen here, and this route is that condition.

        It is a route of its own and not only a field on the worker's profile
        because of who has to read it: the person who deactivated somebody is
        not browsing worker files one by one looking for a change.

        ## What does NOT reactivate

        Work that is older than the deactivation. "Gana la baja": a decision a
        person took, after the work happened, is not undone by an automatism.
        The ordinary case is the whole reason the rule exists — a handset
        spends the afternoon without signal, the web deactivates Juan at
        midday, and at six the handset pushes a weighing it took at eight in
        the morning. That weighing enters, Juan stays inactive, and the phone
        shows it as a conflict for somebody to look at.

        `deviceId` is null when the work came through the web console, and
        `source` is what says so: a null there is never "we do not know", it is
        "there was no device".
      x-action: workers.reactivations.read
      x-roles: [owner, admin]
      parameters:
        - $ref: "#/components/parameters/QueryWorkerID"
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: The reactivations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Reactivation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: |
            NOT_FOUND — `workerId` names somebody who is not on this farm.
            Narrowing by a foreign worker must not read as "nothing was
            reactivated for this person".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/workers:
    get:
      tags: [workers]
      operationId: listWorkers
      summary: List workers
      description: |
        Same route, two projections. An owner or administrator gets the whole
        row; the weigher gets `id`, `name`, `lastName` and `tag` and nothing
        else — no document, no phone, no address, no photo.

        `q` searches the name, the document and the basket tag for everybody,
        the weigher included: he can find a person by the number on their card
        without the number coming back on the wire.
      x-action: workers.read
      x-roles: [owner, admin, weigher]
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - $ref: "#/components/parameters/QueryStatus"
        - $ref: "#/components/parameters/QueryIncludeDeleted"
      responses:
        "200":
          description: The farm's people.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Worker" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [workers]
      operationId: createWorker
      summary: Register a worker
      description: |
        Idempotent by (farm_id, id): posting the same client-generated id twice
        answers 200 with the existing row rather than 409, so a retry after a
        timeout is safe.
      x-action: workers.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerInput" }
      responses:
        "200":
          description: That id already existed here; this is the row it means.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            DUPLICATE_DOCUMENT — another worker who is ON the payroll has that
            document.

            EMPLOYEE_EXISTS_DELETED with `details.employeeId` — a worker with
            that document is here and DEACTIVATED. `ux_employees_doc` is
            partial on `deleted_at IS NULL`, so this insert would otherwise
            succeed and create a second file for one person: from then on the
            handset writes to one and the web to the other, the balance is
            split in two, and nothing says so. Restore the existing one with
            PATCH /v1/workers/{id} {"status":"active"} instead. It is the one
            conflict in docs/sincronizacion.md with no automatic repair.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/workers/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [workers]
      operationId: getWorker
      summary: One worker
      description: The weigher's projection applies here too.
      x-action: workers.read
      x-roles: [owner, admin, weigher]
      responses:
        "200":
          description: The worker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [workers]
      operationId: updateWorker
      summary: Edit a worker, or take them off the payroll
      description: |
        A field that is absent keeps its value. `status` is how somebody comes
        off the payroll and back on for the next harvest: the row and its
        financial history stay put, which is the whole reason a delete here is
        logical.
      x-action: workers.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerPatch" }
      responses:
        "200":
          description: The worker as they now stand.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Worker" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [workers]
      operationId: deleteWorker
      summary: Take a worker off the payroll
      description: |
        Logical. Nothing in this service issues a DELETE against a row: the
        financial history has to survive the person leaving. Equivalent to
        PATCH {"status":"inactive"}.
      x-action: workers.write
      x-roles: [owner, admin]
      responses:
        "204": { description: Marked inactive. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workers/{id}/profile:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [workers]
      operationId: workerProfile
      summary: The RSP-007 screen in one call
      description: |
        The person, their balance derived from the ledger, their recent
        movements, their work and their notes. One call because it is one
        screen, and five calls would render it in five states.
      x-action: workers.read_private
      x-roles: [owner, admin]
      parameters:
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workers/{id}/payables:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [workers, money]
      operationId: workerPayables
      summary: The RSP-008 payment screen
      description: |
        One list of unsettled work, one list of debts, and one total.

        `debts` are already inside `balanceCents`. They are listed so the
        screen can show them, and they must NOT be subtracted again — doing so
        charges the worker for the same debt twice. `totalCents` is
        `balanceCents + grossCents`: what the farm would owe if everything
        listed were settled right now.

        A debt is a `deduccion` or an `anticipo` in the worker's ledger. It is
        not an expense: an expense is the farm's own accounting and never
        touches anybody's ledger, because otherwise the cost of a spraying
        comes out of somebody's wage.

        Without `from`/`to` this is everything outstanding, which is what the
        screen asks for: the owner pays what is owed, not what is owed this
        fortnight.
      x-action: workers.payables.read
      x-roles: [owner, admin]
      parameters:
        - $ref: "#/components/parameters/QueryFrom"
        - $ref: "#/components/parameters/QueryTo"
      responses:
        "200":
          description: What this person is owed and what they owe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payables" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workers/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [workers]
      operationId: listWorkerNotes
      summary: A worker's notes
      description: |
        Notes are born private and have no route out of the farm. Decision 1
        is explicit: the registry service cannot read this table, and the
        column that would let it was never created. The schema is the defence,
        not a policy somebody could relax.
      x-action: workers.notes.read
      x-roles: [owner, admin]
      parameters:
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [workers]
      operationId: addWorkerNote
      summary: Append a note
      description: |
        Append-only. There is no PATCH and no DELETE on a note, and there will
        not be: a note that can be rewritten afterwards is not a record of
        anything.
      x-action: workers.notes.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "201":
          description: Written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workers/{id}/balance:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [money]
      operationId: workerBalance
      summary: One worker's position
      description: |
        Derived from the ledger, never stored. Positive means the farm owes
        them.

        The worker is confirmed to belong to this farm before anything is
        summed: a SUM over an id that matches nothing returns zero, and zero
        reads exactly like "settled up". A worker of another farm and a worker
        who never existed both answer 404 here.
      x-action: balances.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: The balance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/workers/{id}/ledger:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [money]
      operationId: workerLedger
      summary: One worker's movements
      description: |
        Newest first. The same guard as the balance, one step quieter: an empty
        list would read as "no movements yet" rather than "no such person", so
        an unknown worker is a 404.
      x-action: ledger.read
      x-roles: [owner, admin]
      parameters:
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: The movements.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LedgerEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Plots and crops
  # ---------------------------------------------------------------------------
  /v1/plots:
    get:
      tags: [plots]
      operationId: listPlots
      summary: List plots with their crops
      x-action: plots.read
      x-roles: [owner, admin, weigher]
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - $ref: "#/components/parameters/QueryStatus"
        - $ref: "#/components/parameters/QueryIncludeDeleted"
      responses:
        "200":
          description: The farm's plots.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Plot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [plots]
      operationId: createPlot
      summary: Register a plot and what is planted in it
      description: |
        The plot and its crops arrive in one body because the form the owner
        fills in is one form: identity, location, what is planted, and the
        shape drawn on the map.

        A crop may name its type and variety by id or by name; a name the
        catalogue has not seen is added to it rather than rejected, which is
        the "add it if it is not there" button RSP-001 asks for.
      x-action: plots.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlotInput" }
      responses:
        "200":
          description: That id already existed here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plot" }
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plot" }
        "400":
          description: |
            Malformed, or INVALID_GEOMETRY when the boundary is not a valid
            Polygon or MultiPolygon.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: DUPLICATE_NAME — this farm already has a plot with that name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/plots/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [plots]
      operationId: getPlot
      summary: One plot with its crops
      x-action: plots.read
      x-roles: [owner, admin, weigher]
      responses:
        "200":
          description: The plot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [plots]
      operationId: updatePlot
      summary: Edit a plot, or take it out of service
      description: |
        A field that is absent keeps its value. Crops are not replaced from
        here — they have their own routes, so an edit to the plot's name
        cannot silently drop what is planted in it.
      x-action: plots.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlotPatch" }
      responses:
        "200":
          description: The plot as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plot" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            PLOT_HAS_ACTIVE_CROPS — a plot is not taken out of service while
            something is planted in it, because that would orphan the work
            records pointing at that crop. `details.activeCrops` says how many.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [plots]
      operationId: deletePlot
      summary: Take a plot out of service
      description: Logical. Equivalent to PATCH {"status":"inactive"}.
      x-action: plots.write
      x-roles: [owner, admin]
      responses:
        "204": { description: Marked inactive. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: PLOT_HAS_ACTIVE_CROPS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/plots/{id}/boundary:
    parameters:
      - $ref: "#/components/parameters/PathID"
    put:
      tags: [plots]
      operationId: setPlotBoundary
      summary: Store the polygon drawn on the map
      description: |
        GeoJSON in, GeoJSON out. PostGIS stops at this boundary on purpose: the
        web and the phone never see a geography type, which is what keeps
        changing engines possible.

        Three PostGIS functions are used in this whole service. `ST_IsValid`
        rejects a ring that crosses itself before it can be stored, because a
        self-intersecting polygon has no area anybody would agree on and
        `computedAreaHa` would then be a confident lie. `ST_Area/10000`
        produces `computedAreaHa`, which comes back alongside the declared
        `areaHa` and never instead of it — the two always disagree, and
        choosing which to show is the owner's decision. `ST_Intersects` fills
        `overlaps`, which is a warning and never a refusal: two plots that
        touch are usually a drawing worth a second look, and sometimes they are
        a terrace above a coffee lot.

        A plain Polygon is promoted to a MultiPolygon: a plot in two separate
        pieces is ordinary.
      x-action: plots.boundary.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BoundaryInput" }
      responses:
        "200":
          description: Stored, with the recomputed hectares and any overlaps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoundaryResult" }
        "400":
          description: |
            INVALID_GEOMETRY — not GeoJSON, not a polygon, or a ring that
            crosses itself. The message carries `ST_IsValidReason`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/plots/{id}/crops:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      tags: [plots]
      operationId: addPlotCrop
      summary: Plant something in a plot
      description: |
        Work records point at a `plot_crop` and not at the plot: if a plot has
        coffee and plantain, "how did the coffee do" is only answerable at this
        grain.
      x-action: plots.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlotCropInput" }
      responses:
        "201":
          description: Planted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlotCrop" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/plots/{id}/crops/{cropId}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - name: cropId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [plots]
      operationId: removePlotCrop
      summary: Remove a crop from a plot
      description: Logical, like everything else.
      x-action: plots.write
      x-roles: [owner, admin]
      responses:
        "204": { description: Marked removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Activities
  # ---------------------------------------------------------------------------
  /v1/activities:
    get:
      tags: [activities]
      operationId: listActivities
      summary: The farm's activity catalogue
      description: |
        Same route, different projection: the weigher's list arrives without a
        single rate in it — `rate` is absent, not null. The RLS policies on the
        `activity_pay_*` tables say the same thing a second time, so a
        forgotten projection here still cannot leak a price.

        `on` asks which rate was in force on a given day, which is how a past
        payment stays explainable.
      x-action: activities.read
      x-roles: [owner, admin, weigher]
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - $ref: "#/components/parameters/QueryStatus"
        - name: category
          in: query
          description: Category id, or its exact name.
          schema: { type: string }
        - name: on
          in: query
          description: Which day's rate to report. Defaults to today.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Grouped by category, then by name.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Activity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [activities]
      operationId: createActivity
      summary: Register an activity
      description: |
        The pay scheme decides the shape. `unidad_trabajo` needs a `unitId` and
        nothing else may have one. `weekly_price` is only available to
        `unidad_trabajo`, and `explicit` is not an activity's rate source at
        all — it belongs to a single work record.

        The first rate period is created in the same transaction; a deferred
        constraint refuses an activity that ends the transaction without one.
      x-action: activities.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityInput" }
      responses:
        "200":
          description: That id already existed here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "201":
          description: Registered, with its first rate period.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: DUPLICATE_NAME.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/activities/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    patch:
      tags: [activities]
      operationId: updateActivity
      summary: Rename, recategorise, archive or unarchive an activity
      description: |
        `payScheme` and `rateSource` cannot be changed and sending either is a
        400. Work records already written are pinned to (activity_id,
        pay_scheme) by a composite foreign key, and their price shape was
        decided by that scheme on the day they were written; turning "tala por
        jornal" into a per-kilo activity would rewrite the meaning of money
        already earned. An activity that pays differently is a different
        activity.

        The price is not editable here either: it has its own route, because a
        new price opens a validity period rather than overwriting the old one.
      x-action: activities.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivityPatch" }
      responses:
        "200":
          description: The activity as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: DUPLICATE_NAME.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [activities]
      operationId: archiveActivity
      summary: Archive an activity
      description: |
        Logical. Its rate history is not deleted either: a payment made under
        an old price stays explainable.
      x-action: activities.write
      x-roles: [owner, admin]
      responses:
        "204": { description: Archived. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/activities/{id}/rates:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [activities]
      operationId: listActivityRates
      summary: The whole price history of one activity
      description: |
        Newest first. This is what makes a past payment explainable: the answer
        to "why was I paid this" is a row with a date on it.
      x-action: activities.rate.write
      x-roles: [owner]
      responses:
        "200":
          description: Every validity period.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityRate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/activities/{id}/rate:
    parameters:
      - $ref: "#/components/parameters/PathID"
    put:
      tags: [activities]
      operationId: setActivityRate
      summary: Open a new price period
      description: |
        Decision 4: activity prices have a history with validity dates, exactly
        like the weekly collection price already did. This never edits an
        earlier period — a rate already frozen onto a work record has to stay
        explainable — except when `validFrom` names a period that already
        starts on that day, which is a correction rather than a new price.

        The consequence a client must know: a work record whose price is
        derived from a date has to be a single day. A wage from Tuesday to
        Tuesday has no single validity period.
      x-action: activities.rate.write
      x-roles: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RateInput" }
      responses:
        "200":
          description: The activity's price history, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [activityId, rates]
                properties:
                  activityId: { type: string, format: uuid }
                  rates:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityRate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Catalogues
  # ---------------------------------------------------------------------------
  /v1/catalogs/activity-categories:
    get:
      tags: [catalogs]
      operationId: listActivityCategories
      summary: Activity categories
      description: |
        None of the catalogues is a Postgres enum. Every use case that mentions
        them says a farm may invent a value ("con opción de crear una nueva"),
        and a closed type would make each invented value an ALTER TYPE in
        production. A new farm is seeded with siembra, mantenimiento and
        cosecha; anything it adds afterwards is exactly as valid.
      x-action: catalogs.read
      x-roles: [owner, admin, weigher]
      responses:
        "200": { $ref: "#/components/responses/CatalogList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [catalogs]
      operationId: createActivityCategory
      summary: Add an activity category
      description: |
        Idempotent by (farm_id, lower(name)) and answers 200, never 201: the
        caller does not need to know whether it existed, only which row that
        name means on this farm. The autocomplete can therefore never produce
        two of anything.
      x-action: catalogs.write
      x-roles: [owner, admin]
      requestBody: { $ref: "#/components/requestBodies/CatalogItem" }
      responses:
        "200": { $ref: "#/components/responses/CatalogItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/catalogs/crop-types:
    get:
      tags: [catalogs]
