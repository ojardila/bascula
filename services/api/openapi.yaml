        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------------------
  # Work records — "labores"
  # ---------------------------------------------------------------------------
  /v1/work-records:
    get:
      tags: [work-records]
      operationId: listWorkRecords
      summary: List work records
      description: |
        The weigher gets only the rows he recorded, and that narrowing is the
        RLS policy on `work_records`, not a WHERE clause in a handler.

        `q` matches the activity's name, the worker's name or the note.
      x-action: work_records.read
      x-roles: [owner, admin, weigher]
      parameters:
        - $ref: "#/components/parameters/QueryWorkerID"
        - name: activityId
          in: query
          schema: { type: string, format: uuid }
        - name: plotId
          in: query
          schema: { type: string, format: uuid }
        - name: plotCropId
          in: query
          schema: { type: string, format: uuid }
        - name: payScheme
          in: query
          schema: { $ref: "#/components/schemas/PayScheme" }
        - $ref: "#/components/parameters/QueryFrom"
        - $ref: "#/components/parameters/QueryTo"
        - $ref: "#/components/parameters/QueryQ"
        - $ref: "#/components/parameters/QueryStatus"
        - $ref: "#/components/parameters/QueryIncludeDeleted"
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [work-records]
      operationId: createWorkRecord
      summary: Record that somebody performed an activity
      description: |
        The one write in the system that decides money at write time, so most
        of it is about which price applies and when it froze:

          * `rateCents` given — the caller named the price, it freezes here,
            and a date range is legal;
          * the activity is priced by the week — the price is looked up when
            the settlement runs, which is exactly what the phone does today;
          * otherwise — the activity's rate in force on the day of the work,
            frozen now. NO_RATE_IN_FORCE when there is none.

        A record whose price is derived from a date must be a single day
        (decision 4); a range needs `rateCents`, and asking for both is 400
        with `details.code = RANGE_NEEDS_FROZEN_RATE`.

        A weigher may only record work priced by the week, and may not send a
        rate. He never sees a price and never needs to.
      x-action: work_records.write
      x-roles: [owner, admin, weigher]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkRecordInput" }
      responses:
        "200":
          description: That id already existed here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkRecord" }
        "201":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: NO_RATE_IN_FORCE — that activity has no price on that date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/work-records/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [work-records]
      operationId: getWorkRecord
      summary: One work record
      x-action: work_records.read
      x-roles: [owner, admin, weigher]
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [work-records]
      operationId: updateWorkRecord
      summary: Correct a work record that has not been paid
      description: |
        Exactly two things can change: the quantity and the note. The amount is
        recomputed here by the one money rule, `round(quantity × rate)` — a
        caller that could send its own total could send one that does not match
        its own line.

        What it refuses is the interesting half. The worker is somebody else's
        money. The date decides which rate period and which week apply, so
        moving it silently reprices the line. The activity decides the pay
        scheme, which a composite foreign key pins to the row. And the frozen
        price stays frozen: that is the answer to "why was I paid this". Any of
        those is a different work record — delete this one and write that one,
        in that order, so the anti double-pay lock sees both.
      x-action: work_records.admin
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkRecordPatch" }
      responses:
        "200":
          description: The record as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            WORK_RECORD_SETTLED — a live settlement has claimed it. Work that
            has been paid is cancelled by voiding its settlement, never by
            editing it away underneath the payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [work-records]
      operationId: deleteWorkRecord
      summary: Remove a work record
      description: Logical, and refused on a settled record.
      x-action: work_records.admin
      x-roles: [owner, admin]
      responses:
        "204": { description: Marked deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: WORK_RECORD_SETTLED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------------------
  # The legacy pickup facade
  # ---------------------------------------------------------------------------
  /v1/pickups:
    get:
      tags: [pickups]
      operationId: listPickups
      summary: List weighings (legacy)
      description: |
        DEPRECATED. The same list as `/v1/work-records`, filtered to
        `payScheme=unidad_trabajo`. A day's wage is not a weighing and never
        appears here, which is what keeps the phone's screens looking exactly
        as they did.

        There is no pickups table and there never will be: two payable tables
        mean two anti double-pay locks and no way for one settlement to take
        both, and a picker who also cleared brush the same week needs one
        settlement, not two.
      deprecated: true
      x-action: work_records.read
      x-roles: [owner, admin, weigher]
      parameters:
        - $ref: "#/components/parameters/QueryWorkerID"
        - $ref: "#/components/parameters/QueryFrom"
        - $ref: "#/components/parameters/QueryTo"
        - $ref: "#/components/parameters/QueryQ"
        - $ref: "#/components/parameters/QueryStatus"
      responses:
        "200":
          description: Weighings, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WorkRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [pickups]
      operationId: createPickup
      summary: Record a weighing (legacy)
      description: |
        DEPRECATED. Translates the phone's vocabulary and hands the result to
        the ordinary work-record handler, so there is one implementation of this
        write and both doors go through it: the price rules, the timezone
        handling, the idempotency and the weigher's restrictions cannot drift
        between them.

        Without `activityId` it resolves the farm's own activity priced by the
        week — seeded as "Recoleccion" — by lookup and never by a hardcoded id,
        which would belong to somebody else's farm.

        `cropId` is a `plot_crop` here. That mapping is 1:1 and deterministic
        only until a farm registers a second crop in one lot; after that the
        facade cannot invent which one was meant. That, and not a preference, is
        the real deadline on the phone's migration.
      deprecated: true
      x-action: work_records.write
      x-roles: [owner, admin, weigher]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PickupInput" }
      responses:
        "200":
          description: That id already existed here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkRecord" }
        "201":
          description: Recorded, as a work record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            NO_RATE_IN_FORCE, which here also covers "this farm has no activity
            priced by the week; send activityId explicitly".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/pickups/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [pickups]
      operationId: getPickup
      summary: One weighing (legacy)
      description: |
        DEPRECATED. A work record that is not paid by the unit of work answers
        404 through this door: the row exists and belongs to this farm, but a
        day's wage on a screen that only knows how to show kilos is worse than
        nothing.
      deprecated: true
      x-action: work_records.read
      x-roles: [owner, admin, weigher]
      responses:
        "200":
          description: The weighing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [pickups]
      operationId: deletePickup
      summary: Remove a weighing (legacy)
      description: DEPRECATED. Logical, and refused on a settled record.
      deprecated: true
      x-action: work_records.admin
      x-roles: [owner, admin]
      responses:
        "204": { description: Marked deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: WORK_RECORD_SETTLED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------------------
  # Weekly price
  # ---------------------------------------------------------------------------
  /v1/prices/weeks/{monday}:
    parameters:
      - name: monday
        in: path
        required: true
        description: |
          The week is named by its Monday's ISO date. Any other day is a 400 —
          the phone's old "2026-W33" form is obsolete.
        schema: { type: string, format: date, example: "2026-08-24" }
    get:
      tags: [money]
      operationId: getWeekPrice
      summary: What a kilo is worth this week
      description: |
        The week's override if the owner set one, otherwise the farm's standing
        price. A work record priced by the week reads this at settlement time,
        not at write time.
      x-action: prices.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: The price in force for that week.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeekPrice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [money]
      operationId: setWeekPrice
      summary: Set this week's price
      description: |
        Owner only. Setting a past week's price reprices every weighing of that
        week that has not been settled yet, and none that has: a settled line
        keeps the price it was settled at.
      x-action: prices.write
      x-roles: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priceCents]
              properties:
                priceCents: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeekPrice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Money
  # ---------------------------------------------------------------------------
  /v1/pending:
    get:
      tags: [money]
      operationId: pending
      summary: What a worker is owed for but has not been paid
      description: |
        Payables in the range that no live settlement has claimed, each already
        priced. Two freezing moments meet here: a line priced by the week is
        priced now, at read time; every other line was frozen when it was
        written and is only read back.

        Deliberately not filtered by pay scheme. Filtering it would bring back
        the two-path problem that the single payable table removed — a picker
        who also cleared brush must receive one settlement.

        The worker is confirmed to be ours before anything is summed.
      x-action: pending.read
      x-roles: [owner, admin]
      parameters:
        - name: workerId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: The unsettled lines and their total.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/balances:
    get:
      tags: [money]
      operationId: listBalances
      summary: Every worker's position
      description: Derived from the ledger, largest credit first.
      x-action: balances.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: One row per worker.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Balance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/settlements/preview:
    post:
      tags: [money]
      operationId: previewSettlement
      summary: Price a period without writing anything
      description: |
        The same code path the real settlement uses, so what the screen shows
        and what gets written cannot drift apart.
      x-action: settlements.preview
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementInput" }
      responses:
        "200":
          description: What settling this period would produce.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettlementPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/settlements:
    get:
      tags: [money]
      operationId: listSettlements
      summary: The farm's settlements, filtered and paged
      description: |
        Until this route existed the console composed the list itself, by
        walking every employee's ledger for `devengo` entries carrying a
        `settlementId` and grouping them. That is correct, and it is one
        request per worker for one screen.

        A row here is a settlement WITHOUT its lines: `items` is always an
        empty array, and `itemCount` is how many LIVE lines it has — a voided
        settlement's lines keep their rows, and counting them would say a
        cancelled document still claims twelve weighings. Fetch
        `/v1/settlements/{id}` for the lines.

        `from` and `to` bound the PERIOD the settlement covers, by overlap: a
        settlement is in range if any part of its period is. The period and not
        `createdAt`, because "las liquidaciones de la quincena pasada" is about
        the fortnight worked, not the hour the button was pressed — and because
        `createdAt` is a timestamp in a timezone, which a date filter would
        misread at the edges. Send both or neither: half a range is an
        unbounded window somebody thought they had bounded, and it is a 400.

        `total` is a real COUNT over the filtered set, not the length of the
        page and not an estimate.

        Filtering by a `workerId` of another farm answers 404, not an empty
        list: "this person has never been settled" is a clean, believable,
        wrong screen.
      x-action: settlements.read
      x-roles: [owner, admin]
      parameters:
        - $ref: "#/components/parameters/QueryWorkerID"
        - name: status
          in: query
          description: |
            `open`, `void`, or `all` (the default). Anything else is a 400
            rather than an empty list.
          schema: { type: string, enum: [open, void, all] }
        - $ref: "#/components/parameters/QueryFrom"
        - $ref: "#/components/parameters/QueryTo"
        - name: limit
          in: query
          description: Rows per page, 50 by default and 200 at most.
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          description: Rows to skip. A negative or unparsable value is 0.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: One page of settlements, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SettlementSummary" }
                  total:
                    type: integer
                    format: int64
                    description: Settlements matching the filter, all pages.
                  limit: { type: integer }
                  offset: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [money]
      operationId: createSettlement
      summary: Turn a set of payables into one settlement and one earning
      description: |
        The anti double-pay lock is a partial unique index in Postgres, not a
        check in application code: a payable belongs to exactly one live
        settlement and the database is what says so. Two concurrent settlements
        racing for the same payable end with one unique violation, surfaced as
        409 PAYABLE_ALREADY_CLAIMED with the winning settlement in `details` so
        a client can re-derive its state.

        Omitting `payableIds` settles everything pending in the range. The
        period recorded is the period actually covered — the Monday of the
        earliest payable taken in — and not whatever window the caller asked
        over: a caller asking from 1970 means "everything outstanding", and
        writing 1970 on the receipt would be nonsense.

        Idempotent by `id`, and the check runs before anything is derived: a
        retry finds its own payables already locked by the settlement it is
        retrying, so a check running after that would answer 409
        NOTHING_TO_SETTLE — a business error covering for a network one, in
        front of somebody waiting to be paid.
      x-action: settlements.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettlementInput" }
      responses:
        "200":
          description: That id already existed here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "201":
          description: Settled, with one `devengo` written to the ledger.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            NOTHING_TO_SETTLE, PAYABLE_ALREADY_CLAIMED with
            `details.payableId` and `details.winningSettlement`,
            IDEMPOTENCY_KEY_REUSED when `id` already names a settlement for
            another worker, or GROSS_CHANGED.

            GROSS_CHANGED carries `details.expectedCents`,
            `details.actualCents`, `details.addedPayableIds`,
            `details.removedPayableIds`, `details.weeksInSettlement` — the weeks
            this settlement spans with the price NOW in force, NOT a list of
            weeks that changed — and `details.payableIdsProvided`.

            Added and removed are exact whenever the caller named the set it
            saw in `payableIds`. When it did not, both lists are empty and
            `payableIdsProvided` is false: that means "we were not told what
            you saw", never "nothing moved". A screen that cannot tell those
            apart will blame a reprice for a late weighing.

            Send `payableIds`. Naming the set removes the race entirely rather
            than reporting it: the settlement takes exactly what was approved,
            and anything that arrived since is simply not in it. Nothing here is
            guessed: a cause the server cannot establish is not reported as
            one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/settlements/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [money]
      operationId: getSettlement
      summary: One settlement with its lines
      x-action: settlements.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: The settlement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/settlements/{id}/void:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      tags: [money]
      operationId: voidSettlement
      summary: Cancel a settlement
      description: |
        Without editing a thing. The lines keep their rows for the record but
        gain a `voidedAt`, which is what releases their payables from the lock;
        the earning is cancelled by a reversal, never deleted.

        A void writes no row the caller names, so the reversal's `id` is its
        idempotency key: resent with the same `id`, it answers 200 with the
        settlement it already voided. Resent without one, it is 409
        SETTLEMENT_ALREADY_VOID.
      x-action: settlements.void
      x-roles: [owner, admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: The id of the reversal this void writes.
      responses:
        "200":
          description: The settlement, now void.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settlement" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            SETTLEMENT_ALREADY_VOID — the settlement is void and this request
            named no reversal `id`, so there is no way to tell a retry from a
            second attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/payments:
    post:
      tags: [money]
      operationId: createPayment
      summary: Record money handed over
      description: |
        Send a positive `amountCents`; the sign is applied by the server, and
        the database refuses the wrong one outright.

        Partial and full payment need no flag of their own — a payment is
        partial when it is less than the balance, checked against the derived
        balance and never against a stored total. A payment larger than the
        balance is 409 AMOUNT_EXCEEDS_BALANCE with `details.balanceCents`,
        which is the guard against a typo on the payment screen.

        `allowOverpayment` is how a caller says "yes, I know, pay it anyway",
        at which point the excess behaves as an advance — exactly what the
        phone does today with real money. Both behaviours are needed: the guard
        because the web is a keyboard, and the override because the server must
        not be less capable than the phone while both are live.
      x-action: ledger.payment
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "200":
          description: |
            The movement that was already there. Resending a write with an id
            already used by an IDENTICAL write is safe by contract, and this is
            what safe looks like: 200, the existing row, nothing added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "201":
          description: Written to the ledger.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            AMOUNT_EXCEEDS_BALANCE, with `details.balanceCents`, or
            IDEMPOTENCY_KEY_REUSED when the id already names a different
            movement.

            The order matters and is part of the contract: the idempotency
            check runs BEFORE the balance is derived. Pay a balance off in
            full, time out, resend — by then the balance is zero, and a
            balance check running first would answer AMOUNT_EXCEEDS_BALANCE:
            a business rule standing in for a dropped connection, refusing a
            payment that has already been made.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/advances:
    post:
      tags: [money]
      operationId: createAdvance
      summary: Record money handed over ahead of the work
      description: |
        No balance check: exceeding the balance is what an advance is.
      x-action: ledger.advance
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentInput" }
      responses:
        "200":
          description: |
            The movement that was already there. Resending a write with an id
            already used by an IDENTICAL write is safe by contract, and this is
            what safe looks like: 200, the existing row, nothing added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "201":
          description: Written to the ledger.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyKeyReused" }

  /v1/deductions:
    post:
      tags: [money]
      operationId: createDeduction
      summary: Record what the worker owes the farm
      description: |
        A deduction is not an expense. An expense is the farm's own accounting
        and never touches anybody's ledger; mixing them would take the cost of
        a spraying out of somebody's pay. A deduction therefore has no payment
        method, and sending one is a 400.
      x-action: ledger.deduction
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeductionInput" }
      responses:
        "200":
          description: |
            The movement that was already there. Resending a write with an id
            already used by an IDENTICAL write is safe by contract, and this is
            what safe looks like: 200, the existing row, nothing added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "201":
          description: Written to the ledger.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyKeyReused" }

  /v1/adjustments:
    post:
      tags: [money]
      operationId: createAdjustment
      summary: Correct a balance
      description: |
        The one movement whose sign the caller chooses, because an adjustment
        can go either way. It is not a way around the ledger's rules: it is
        still an appended row with an author and a note.
      x-action: ledger.adjust
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustmentInput" }
      responses:
        "200":
          description: |
            The movement that was already there. Resending a write with an id
            already used by an IDENTICAL write is safe by contract, and this is
            what safe looks like: 200, the existing row, nothing added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "201":
          description: Written to the ledger.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyKeyReused" }

  /v1/ledger/{id}/reverse:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      tags: [money]
      operationId: reverseLedgerEntry
      summary: Undo a movement
      description: |
        The only way back. Nothing in the ledger is edited or deleted — the
        database has triggers that forbid both — so a mistake is cancelled by a
        movement that is its exact opposite, once. A partial unique index on
        `reversesId` is what makes it once; a second attempt is 409
        ALREADY_REVERSED. A reversal cannot itself be reversed.
      x-action: ledger.reverse
      x-roles: [owner, admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  description: |
                    The id OF THE REVERSAL, and the key that makes resending
                    this call safe. With it, a repeat answers 200 with the
                    reversal already written. Without it there is nothing to
                    tell a retry from a second, separate attempt to undo the
                    same movement, so a repeat is 409 ALREADY_REVERSED —
                    guessing in favour of "it was probably a retry" would be
                    guessing with somebody's wages.
                note: { type: string, nullable: true }
      responses:
        "201":
          description: The reversing movement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            ALREADY_REVERSED when the movement has been reversed by a
            different request, or IDEMPOTENCY_KEY_REUSED when `id` already
            names something else.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------------------
  # Productos e inventario — RSP-018 … RSP-025
  #
  # EXISTENCIAS ARE DERIVED. There is no stored total anywhere behind these
  # endpoints: every quantity below is a SUM over stock_moves computed on the
  # way out, the same discipline the balance gets from the ledger and for the
  # same reason. A stored total is a total that some day disagrees with the
  # facts underneath it, and when it does nothing can say which one is lying.
  #
  # The whole module is on the weigher's deny list, alongside payroll:
  # docs/modelo-datos.md §9 puts ventas, gastos and stock_moves outside his
  # reach "con la misma forma que ledger", and RSP-018 puts existencias on the
  # very first product screen, so there is no reduced projection worth having.
  # ---------------------------------------------------------------------------
  /v1/catalogs/product-categories:
    get:
      tags: [products]
      operationId: listProductCategories
      summary: Product categories
      description: |
        Materia prima, producto procesado, and whatever a farm invents. A
        table and not an enum, because RSP-019 puts an "add it if it is not
        there" button next to the picker.
      x-action: products.read
      x-roles: [owner, admin]
      responses:
        "200": { $ref: "#/components/responses/CatalogList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [products]
      operationId: createProductCategory
      summary: Add a product category
      description: Idempotent by (farm_id, lower(name)); answers 200, never 201.
      x-action: products.write
      x-roles: [owner, admin]
      requestBody: { $ref: "#/components/requestBodies/CatalogItem" }
      responses:
        "200": { $ref: "#/components/responses/CatalogItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/catalogs/storage-units:
    get:
      tags: [products]
      operationId: listStorageUnits
      summary: Units of storage
      description: |
        Bulto, kilo, litro, caja.

        Not to be confused with `/v1/catalogs/work-units`, which is what a
        picker is PAID by and carries a `kgFactor` so two farms counting in
        baskets can be compared. A storage unit converts to nothing and is only
        ever shown in a picker, which is why it has a name and no code.
      x-action: products.read
      x-roles: [owner, admin]
      responses:
        "200": { $ref: "#/components/responses/CatalogList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [products]
      operationId: createStorageUnit
      summary: Add a unit of storage
      x-action: products.write
      x-roles: [owner, admin]
      requestBody: { $ref: "#/components/requestBodies/CatalogItem" }
      responses:
        "200": { $ref: "#/components/responses/CatalogItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/warehouses:
    get:
      tags: [products]
      operationId: listWarehouses
      summary: Bodegas
      description: |
        A warehouse is a name and a row. What is in one is not on it: ask
        `/v1/stock?warehouseId=...`, which sums the movements.
      x-action: products.read
      x-roles: [owner, admin]
      responses:
        "200": { $ref: "#/components/responses/CatalogList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [products]
      operationId: createWarehouse
      summary: Add a bodega
      x-action: products.write
      x-roles: [owner, admin]
      requestBody: { $ref: "#/components/requestBodies/CatalogItem" }
      responses:
        "200": { $ref: "#/components/responses/CatalogItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: List products with their existencias
      description: |
        RSP-018: grouped by category, with the units on hand. `stock` on every
        row is a SUM over that product's movements across every warehouse,
        computed now — never a column.
      x-action: products.read
      x-roles: [owner, admin]
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - $ref: "#/components/parameters/QueryStatus"
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The farm's products.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [products]
      operationId: createProduct
      summary: Register a product
      description: |
        RSP-019. `category` and `storageUnit` may be sent as names instead of
        ids, and a name that is not in the catalogue yet is added to it rather
        than rejected — that is the "con opción de crear" button.

        Idempotent by (farm_id, id): a retry answers 200 with the product.
      x-action: products.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: That id already existed here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: DUPLICATE_NAME.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [products]
      operationId: getProduct
      summary: One product
      x-action: products.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: The product, with its derived stock.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [products]
      operationId: updateProduct
      summary: Modify a product
      description: RSP-020, plus `status` to take one out of service or bring it back.
      x-action: products.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductPatch" }
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Take a product out of the catalogue
      description: |
        RSP-021: eliminar deja el producto inactivo. Its movements stay exactly
        where they are — they are facts, and a product leaving the catalogue
        does not un-harvest last week's coffee.
      x-action: products.write
      x-roles: [owner, admin]
      responses:
        "204": { description: Marked inactive. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/stock:
    get:
      tags: [stock]
      operationId: listStock
      summary: Existencias, by product and warehouse
      description: |
        A SUM over stock_moves. Narrowing by `productId` or `warehouseId`
        confirms the id belongs to this farm BEFORE it sums: a sum over
        somebody else's product returns 0, and "there are none in that
        warehouse" is a completely credible answer and a false one.
      x-action: stock.read
      x-roles: [owner, admin]
      parameters:
        - name: productId
          in: query
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One line per product and warehouse holding a non-zero quantity.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StockLevel" }
                  total: { type: number, format: double }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/products/{id}/stock:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [stock]
      operationId: getProductStock
      summary: What there is of one product, per warehouse
      description: |
        The sharpest form of the credible zero in this module — one product,
        one number — so the product is confirmed to belong to this farm before
        anything is added up. A product of another farm is 404, never a zero.
      x-action: stock.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: The breakdown and its total.
          content:
            application/json:
              schema:
                type: object
                required: [productId, byWarehouse, total]
                properties:
                  productId: { type: string, format: uuid }
                  byWarehouse:
                    type: array
                    items: { $ref: "#/components/schemas/StockLevel" }
                  total: { type: number, format: double }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/stock/moves:
    get:
      tags: [stock]
      operationId: listStockMoves
      summary: The movements existencias are derived from
      x-action: stock.read
      x-roles: [owner, admin]
      parameters:
        - name: productId
          in: query
          schema: { type: string, format: uuid }
        - name: warehouseId
          in: query
          schema: { type: string, format: uuid }
        - name: reason
          in: query
          schema: { $ref: "#/components/schemas/StockReason" }
        - $ref: "#/components/parameters/QueryFrom"
        - $ref: "#/components/parameters/QueryTo"
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: Movements, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StockMove" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [stock]
      operationId: createStockMove
      summary: Record a movement, and its stickers
      description: |
        RSP-025. The table is append-only: a movement is never edited and never
        deleted, and a mistake is corrected with its opposite at
        `/v1/stock/moves/{id}/reverse`.

        The sign follows from the reason and the database checks the pair, so a
        `venta` that increased stock is a row Postgres refuses rather than a
        validation somebody forgot. A caller may send the quantity unsigned;
        the server applies the sign the reason implies.

        `reason: venta` is refused here on purpose — a sale's movement is
        written by `POST /v1/sales`, in the same transaction as the sale, and
        letting one in through this door is the one way to get the sales list
        and the warehouse to disagree.

        `labels` asks for the identification stickers RSP-025 wants printed.
        THE SERVER DOES NOT PRINT: it generates the batch and returns its id,
        and whatever holds the paper fetches it from `/v1/label-batches/{id}`.
        A request that blocked on a printer would fail a harvest because the
        printer was out of paper.
      x-action: stock.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockMoveInput" }
      responses:
        "200":
          description: That id already existed here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMove" }
        "201":
          description: The movement, and the sticker batch when one was asked for.
          content:
            application/json:
              schema:
                type: object
                required: [move]
                properties:
                  move: { $ref: "#/components/schemas/StockMove" }
                  labelBatch: { $ref: "#/components/schemas/LabelBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            INSUFFICIENT_STOCK — taking out more than there is, with
            `details.onHand` and `details.requested`. Send `allowNegative` to
            record it anyway: a warehouse whose opening balance was never
            entered is ordinary, and a server that made it impossible to record
            what actually left would be a server nobody could use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/stock/moves/{id}/reverse:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      tags: [stock]
      operationId: reverseStockMove
      summary: Undo a movement
      description: |
        The only way back through an append-only table: a second movement that
        is its exact opposite, once. A partial unique index makes it once; a
        second attempt is 409 ALREADY_REVERSED, and a reversal cannot itself be
        reversed.
      x-action: stock.write
      x-roles: [owner, admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, nullable: true }
      responses:
        "201":
          description: The reversing movement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMove" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: ALREADY_REVERSED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/label-batches/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [stock]
      operationId: getLabelBatch
      summary: The stickers for a movement
      description: |
        RSP-025 says the system prints the identification stickers. The server
        produces them; the paper is somebody else's job. The labels are derived
        from the movement each time they are read rather than frozen into rows,
        because a sticker is a rendering of a fact and not a fact of its own.

        The quantity is split evenly across the batch, with the remainder on
        the last label, so the numbers on the paper still add up to the
        movement.
      x-action: stock.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: The batch and its labels.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Ventas — RSP-026 … RSP-029
  # ---------------------------------------------------------------------------
  /v1/customers:
    get:
      tags: [sales]
      operationId: listCustomers
      summary: Clientes
      x-action: sales.read
      x-roles: [owner, admin]
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - $ref: "#/components/parameters/QueryStatus"
      responses:
        "200":
          description: The farm's customers.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [sales]
      operationId: createCustomer
      summary: Add a cliente
      description: |
        Idempotent by (farm_id, lower(name)) and answers 200, like every other
        picker here: the sales screen must not be able to produce two
        "Cooperativa" that are different rows.
      x-action: sales.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerInput" }
      responses:
        "200":
          description: The row that name means on this farm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/sales:
    get:
      tags: [sales]
      operationId: listSales
      summary: List sales
      description: |
        RSP-026. The totals count the live sales only; a voided one keeps its
        row and is excluded from the arithmetic.
      x-action: sales.read
      x-roles: [owner, admin]
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - $ref: "#/components/parameters/QueryStatus"
        - $ref: "#/components/parameters/QueryFrom"
        - $ref: "#/components/parameters/QueryTo"
        - name: productId
          in: query
          schema: { type: string, format: uuid }
        - name: customerId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sales, newest first, with the totals of the live ones.
          content:
            application/json:
              schema:
                type: object
                required: [items, totalCents, totalQty]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Sale" }
                  totalCents: { type: integer, format: int64 }
                  totalQty: { type: number, format: double }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [sales]
      operationId: createSale
      summary: Register a sale, and the stock that left with it
      description: |
        RSP-027. THE SALE AND ITS OUTGOING MOVEMENT ARE WRITTEN IN ONE
        TRANSACTION, and that is the whole reason this is one endpoint. Two
        would mean two chances to write half of it, and the first time anybody
        voided anything the sales list and the warehouse would disagree with no
        third record to say which was right. The database backs it up: a
        'venta' movement without a sale is a row it refuses.

        `warehouseId` is required because a sale takes the product out of
        somewhere, and `venta` movements are the shadow of that.

        `customer` may be a name instead of an id, and a name that is not there
        yet is created — the same picker behaviour as everywhere else.

        The value is `amountCents`, an integer in the currency's minor unit.
        RSP-027 says "double"; a float peso is a peso that rounds differently
        on two machines, and no amount in this schema is a float.
      x-action: sales.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleInput" }
      responses:
        "200":
          description: That id already existed here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "201":
          description: The sale, with the id of the movement it wrote.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            INSUFFICIENT_STOCK, overridable with `allowNegativeStock`, or
            UPLOAD_NOT_READY when the receipt has not finished uploading.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/sales/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [sales]
      operationId: getSale
      summary: One sale
      x-action: sales.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: The sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [sales]
      operationId: updateSale
      summary: Modify a sale
      description: |
        RSP-028, minus the quantity. `qty` is one half of a stock movement that
        is already written and append-only, so moving it here would leave the
        warehouse claiming one number and the sales list another. Sending it is
        a 400 that says to void the sale and record it again — rather than a
        silently ignored field, which is the worst of both answers.

        `status` is refused too: a sale is voided with DELETE, because voiding
        gives the stock back as well as flagging the row, and a voided sale is
        never restored.
      x-action: sales.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalePatch" }
      responses:
        "200":
          description: The sale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: UPLOAD_NOT_READY.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [sales]
      operationId: voidSale
      summary: Void a sale, and put the stock back
      description: |
        RSP-029's "eliminar deja la venta inactiva", done honestly: the row is
        flagged AND the product comes back into the warehouse as a reversing
        movement, in the same transaction. Flagging alone would leave the
        coffee sold in one list and gone from the other forever.

        A voided sale is not restored. There is no way back: the movement it
        reversed can be reversed only once, so undoing the undo is not a thing
        the database can express. Record a new sale instead.
      x-action: sales.void
      x-roles: [owner, admin]
      responses:
        "200":
          description: The sale, now void, with the reversing movement's id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: SALE_ALREADY_VOID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------------------
  # Gastos — RSP-030 … RSP-033
  #
  # A GASTO IS NOT A DEUDA, and this is the place the distinction is made
  # visible to every client at once.
  #
  # RSP-030 calls the cost of a spraying a gasto. RSP-007 calls what an
  # employee owes the farm a deuda. The document uses one word for both. They
  # are not the same thing: an expense is the farm's own accounting, a debt is
  # a line in one person's balance. Nothing under /v1/expenses touches anybody's
  # ledger, `expenses` has no employee_id column, and a debt goes through
  # POST /v1/deductions and nowhere else. Wire them together and recording the
  # cost of the spraying takes money out of somebody's wages.
  # ---------------------------------------------------------------------------
  /v1/expenses:
    get:
      tags: [expenses]
      operationId: listExpenses
      summary: List expenses
      x-action: expenses.read
      x-roles: [owner, admin]
      parameters:
        - $ref: "#/components/parameters/QueryQ"
        - $ref: "#/components/parameters/QueryStatus"
        - $ref: "#/components/parameters/QueryFrom"
        - $ref: "#/components/parameters/QueryTo"
        - name: activityId
          in: query
          schema: { type: string, format: uuid }
        - name: plotId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: |
            Expenses, newest first, with the total of the live ones. Filtering
            by an activity or plot of another farm is 404 and not an empty
            list with a zero total.
          content:
            application/json:
              schema:
                type: object
                required: [items, totalCents, count]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Expense" }
                  totalCents: { type: integer, format: int64 }
                  count: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [expenses]
      operationId: createExpense
      summary: Register an expense
      description: |
        RSP-031. Charged to an activity, OR to a plot/crop. Not both, and not
        neither — the database says so as well (`expense_target`), and the
        refusal has a code of its own so the form knows which half to
        highlight.

        "Neither" is the case worth refusing loudly: an expense charged to
        nothing appears in the total and in no breakdown, and the gap between
        the two is what nobody can account for at the end of the year.
      x-action: expenses.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "200":
          description: That id already existed here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400":
          description: |
            BAD_REQUEST, or EXPENSE_TARGET_INVALID when the expense is charged
            to both an activity and a plot, or to neither.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/expenses/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [expenses]
      operationId: getExpense
      summary: One expense
      x-action: expenses.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: The expense.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [expenses]
      operationId: updateExpense
      summary: Modify an expense
      description: |
        RSP-032. The imputation moves as a unit: sending any of `activityId`,
        `plotId` or `plotCropId` replaces all three. Field by field it would be
        impossible to say "charge this to the plot instead" — the old
        `activityId` would survive the patch and `expense_target` would refuse
        the result, correctly and unhelpfully.

        `status` takes an expense out of service or brings it back. Unlike a
        voided sale this is reversible, because an expense carries no stock
        movement: there is nothing to give back.
      x-action: expenses.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpensePatch" }
      responses:
        "200":
          description: The expense.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
        "400":
          description: BAD_REQUEST or EXPENSE_TARGET_INVALID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [expenses]
      operationId: deleteExpense
      summary: Take an expense out of service
      description: RSP-033; the row is marked inactive, never removed.
      x-action: expenses.write
      x-roles: [owner, admin]
      responses:
        "204": { description: Marked inactive. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------------------
  # Uploads
  #
  # Two steps, in the shape a presigned URL takes, because that is what this
  # becomes the day there is a bucket. There is no object storage in this
  # environment, so `uploadUrl` points back at this service and the bytes go to
  # a directory on disk. The seam is real: swapping in S3 is one file in
  # internal/blob and a different `uploadUrl`, and no endpoint below changes.
  #
  # THE 5 MB LIMIT IS ENFORCED ON THE BYTES THAT ARRIVE, not on the number the
  # client declared when it asked where to send them. A limit checked at step
  # one is a limit checked against a number the client typed.
  # ---------------------------------------------------------------------------
  /v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Reserve an attachment and get somewhere to put it
      description: |
        Answers with a pending attachment and the URL to PUT the bytes to.

        `contentType` and `bytes` in the request are accepted and deliberately
        NOT stored. They exist so a client can draw a progress bar. They decide
        nothing: the server measures the size and sniffs the media type from
        the bytes themselves when they land, because taking the client's word
        for the type is how a .exe becomes a "photo".

        A pending attachment cannot be hung on anything. A trigger refuses it
        on an employee's photo and on a sale or expense receipt, so nothing can
        point at a file whose bytes never arrived.
      x-action: uploads.write
      x-roles: [owner, admin]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "200":
          description: That id already existed here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "201":
          description: Reserved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413":
          description: UPLOAD_TOO_LARGE, from the declared size. A courtesy, not the check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/uploads/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [uploads]
      operationId: getUpload
      summary: An attachment's metadata
      x-action: uploads.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: The attachment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/uploads/{id}/content:
    parameters:
      - $ref: "#/components/parameters/PathID"
    put:
      tags: [uploads]
      operationId: putUploadContent
      summary: Send the bytes
      description: |
        The raw file, as the request body. The only endpoint in this service
        whose body is not JSON.

        What happens here, in order: the attachment is confirmed to belong to
        this farm BEFORE a byte reaches the disk; the body is read to the limit
        plus one, so a file exactly at the limit is told apart from one over
        it, and an oversized upload is refused rather than silently truncated;
        the media type is sniffed from the first bytes and checked against the
        accepted list; and the row is confirmed with the size THE SERVER
        COUNTED. Anything refused is deleted from storage on the way out.

        Resending the bytes after a timeout answers 200 with the attachment
        that is already there, like every other write in this API.
      x-action: uploads.write
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored, with the size and type the server measured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: |
            UPLOAD_TOO_LARGE, with `details.maxBytes`. This is the check that
            counts: it is applied to the bytes that actually arrived.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: |
            UNSUPPORTED_MEDIA_TYPE, with `details.detected` and
            `details.accepted`. The type is what the bytes say it is, not what
            the header claimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [uploads]
      operationId: getUploadContent
      summary: Fetch the bytes
      description: |
        Streams the file. It goes through the same tenant transaction as
        everything else, so an attachment of another farm is 404 before the
        filesystem is touched: the object key is never what grants access.
      x-action: uploads.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: UPLOAD_NOT_READY — the bytes have not arrived.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------------------
  # Reports
  #
  # The console could administer a farm and had no way to say how the harvest
  # was going: all of this analysis existed on the phone and none of it on the
  # server. Every operation below is a port of SQL that already runs on a
  # season of weighings — see internal/store/reports.go for what Postgres
  # needed that SQLite did not.
  #
  # TWO PROPERTIES HOLD ACROSS ALL SIX AND ARE PART OF THE CONTRACT:
  #
  #   * NO ZERO EVER MEANS "I DO NOT KNOW". `kg`, `valueCents`, `index`,
  #     `kgPerDay`, `kgPerHa`, `trend` and `peak` are all nullable, and every
  #     null arrives with a count or a reason beside it. A report is where a
  #     zero is most credible and therefore most dangerous: a farm read $0
  #     against every harvest record in the console because a null amount was
  #     rendered as a figure.
  #
  #   * `scope: "harvest"` on every response. These figures cover work paid by
  #     the unit of work — the same filter /v1/pickups applies. A day's wage
  #     has no kilos and is not counted, so a week's `valueCents` is what the
  #     PICKING was worth and never the week's whole payroll.
  # ---------------------------------------------------------------------------
  /v1/reports/weeks:
    get:
      tags: [reports]
      operationId: reportWeeks
      summary: The weeks, with their kilos and their value
      description: |
        Newest first. `finished` marks a week that is over: a running week's
        total is not comparable with a finished one, and a list that did not
        say so would invite the comparison by eye.
      x-action: reports.read
      x-roles: [owner, admin]
      parameters:
        - { $ref: "#/components/parameters/QueryFrom" }
        - { $ref: "#/components/parameters/QueryTo" }
        - { $ref: "#/components/parameters/QueryLimit" }
      responses:
        "200":
          description: One row per week.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportWeeksResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/reports/weeks/{monday}:
    parameters:
      - name: monday
        in: path
        required: true
        description: The week is named by its Monday's ISO date. Any other day is a 400.
        schema: { type: string, format: date, example: "2026-08-24" }
    get:
      tags: [reports]
      operationId: reportWeekDetail
      summary: One week, worker by day and worker by crop
      description: |
        The question a foreman actually asks — not "how much did the week
        give" but "who was where, and did it show".

        Two grids over the same weighings, so `byDay.total` and `byCrop.total`
        are equal, and inside each grid the row totals, the column totals and
        the grand total all agree. They are folded from the same cells rather
        than computed by a second query, because the one property this screen
        must have is that it adds up.

        `byCrop` can carry a column with a null key: work that could not be
        attributed to exactly one crop, either because the record names none or
        because it names several. Splitting it would be a guess and attributing
        it twice would make the columns exceed the grid, so it gets a column of
        its own and `unattributed` says which of the two it was.

        A week nobody worked is a 200 with two empty grids. A Monday is not a
        resource anybody owns, and "nobody picked that week" is a true answer.
      x-action: reports.read
      x-roles: [owner, admin]
      responses:
        "200":
          description: Both grids for that week.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportWeekDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/reports/crops/{plotCropId}:
    parameters:
      - name: plotCropId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [reports]
      operationId: reportCrop
      summary: One crop — kilos, value, people, days, and the weeks
      description: |
        The crop is confirmed to belong to this farm BEFORE anything is summed:
        every figure here is a SUM, and a sum over another farm's id comes back
        as a perfectly plausible "this crop produced nothing". A miss is a 404.

        `sharedRecords` counts weighings on this crop that also name another
        one. Their kilos are counted here in full, so the same kilos may appear
        again under the other crop — which is why the count is sent rather than
        silently halved between them.
      x-action: reports.read
      x-roles: [owner, admin]
      parameters:
        - name: weeks
          in: query
          description: How many weeks of history to return. Default 12.
          schema: { type: integer, minimum: 1, maximum: 520 }
      responses:
        "200":
          description: The crop's statistics and its weekly evolution.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportCrop" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/reports/performance:
    get:
      tags: [reports]
      operationId: reportPerformance
      summary: The comparative index — each picker against the mates beside them
      description: |
        Ranking pickers by total kilos is unfair and actively misleading:
        whoever worked the ripest plot wins. Every comparison here is against
        the people who worked the SAME crop on the SAME day, which is the only
        fair baseline. Three properties make it that, and the phone shipped
        without all three:

          * the window is the same one the kg/day figure uses, or the screen
            shows a lifetime index next to a 30-day rate;
          * the picker is EXCLUDED from their own benchmark, otherwise everyone
            is dragged toward 1.0 by an amount that depends on how big the crew
            was, which reorders people across groups;
          * it averages DAILY RATIOS rather than dividing sums, so one day on a
            heavy plot does not outweigh nine on a light one.

        `index` is null — never a low number — for anybody with fewer than
        `minComparableDays` days of comparison, and `reason` says why. Printing
        a zero there would be an accusation the data does not support.
      x-action: reports.read
      x-roles: [owner, admin]
      parameters:
        - name: days
          in: query
          description: Length of the window, in the farm's own calendar. Default 30.
          schema: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "200":
          description: One row per picker who worked in the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPerformanceResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/reports/anomalies:
    get:
      tags: [reports]
      operationId: reportAnomalies
      summary: Weighings worth a second look
      description: |
        Five deliberately simple, explainable rules. Accusing a worker with a
        number nobody can justify out loud destroys the trust the whole system
        runs on, so there is no model here — just thresholds anyone can check.

          * `impossible` — more kilos than one person can carry.
          * `duplicate`  — the same person, crop and quantity within three
                           minutes: a double tap.
          * `digit`      — far above what this person usually carries, judged
                           against their whole history with this weighing taken
                           out of it. Including it made the rule algebraically
                           unable to fire.
          * `outlier`    — far above what the rest of the crew did on that crop
                           that day. Derived from the group's total minus this
                           row, not from a self-join, which took 10.8 seconds on
                           a season of data.
          * `future`     — dated after today in the FARM's timezone.

        One weighing can break more than one rule; it is reported once, worst
        first. `reference` is what the quantity was judged against and is null
        for `future`, where there is nothing to compare against — the phone put
        a 0 there and a 0 in this field would read as "compared against
        nothing".
      x-action: reports.read
      x-roles: [owner, admin]
      parameters:
        - name: days
          in: query
          description: How far back to look for findings. Default 120 — one harvest season.
          schema: { type: integer, minimum: 1, maximum: 3650 }
        - name: maxKg
          in: query
          description: The ceiling the `impossible` rule uses, in kilos. Default 120.
          schema: { type: number, minimum: 0.001 }
        - { $ref: "#/components/parameters/QueryLimit" }
      responses:
        "200":
          description: The findings, worst first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportAnomaliesResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/reports/harvest-curve:
    get:
      tags: [reports]
      operationId: reportHarvestCurve
      summary: Where the peak was, and whether the season is ending
      description: |
        The weekly series and the reading of it. The reading is the Go twin of
        `packages/shared/src/harvest.ts` and is tested against the same cases.

        The running week is excluded: it is still going, so its total will
        always look like a fall next to a finished one. A week whose kilos
        could not be established is excluded too, and for the stronger reason —
        treating an unknown as a zero would manufacture a 100% drop and tell a
        farm its season was over. `weeksWithoutKilos` counts them.

        Two steep falls alone could be rain; `windingDown` also requires the
        peak to be behind us, which is when moving people to another plot pays.
      x-action: reports.read
      x-roles: [owner, admin]
      parameters:
        - name: plotCropId
          in: query
          description: |
            One crop's curve. Omitted, it is the whole farm's. A crop of
            another farm is a 404, not a flat season with no peak.
          schema: { type: string, format: uuid }
        - name: weeks
          in: query
          description: How many weeks of series to read. Default 26.
          schema: { type: integer, minimum: 1, maximum: 520 }
      responses:
        "200":
          description: The series and the reading.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarvestCurve" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }


  # ---------------------------------------------------------------------------
  # Sincronización móvil ↔ servidor (docs/sincronizacion.md §3)
  #
  # A change feed with a per-farm sequence. The handset carries ONE number,
  # `cursor`, and what it is missing is "everything with a seq greater than
  # that". Not a watermark per table: a watermark needs `updatedAt` everywhere,
  # cannot tell a deletion from a row that never existed, and breaks on clocks.
  #
  # Direction is decided per table and is NOT symmetric (§2). The handset
  # pushes people, weighings and outgoing money; it receives prices, lots,
  # crops, settlements and earnings; balances and reports never travel at all.
  # Anything read-only that arrives in a push is refused with its reason, never
  # dropped in silence.
  #
  # All three routes are open to every role. The person who works for days
  # without signal is the weigher, and a handset that cannot synchronise is a
  # scale that stops. What keeps payroll away from him is the pull itself, not
  # the door.
  # ---------------------------------------------------------------------------
  /v1/sync/handshake:
    post:
      tags: [sync]
      operationId: syncHandshake
      summary: What this handset may do, and how far behind it is
      description: |
        The first thing a handset does when it is paired, and again on every
        launch. It answers with the farm's timezone — which is what lets the
        handset compute the same `localDay` the server's trigger computes — the
        currency, where the server's cursor is now, and how many changes the
        handset has still to receive.

        `capabilities` is not courtesy: it is what turns buttons off in an app
        already in a farm's pocket, without shipping a new build the day the
        owner changes their mind. It does NOT grant anything — the server still
        answers 403 whether or not the button was visible, because hiding a
        button is not a permission.

        `settleOffline` is false by decision 5: cash handed over in the field is
        an `anticipo`, which claims no payable, takes no lock, and is amortised
        to the cent when the settlement runs. `writePlots` and `writeWeekPrices`
        are false by decision 6.
      x-action: sync.handshake
      x-roles: [owner, admin, weigher]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncHandshakeInput" }
      responses:
        "200":
          description: Where the server is, and what this handset may do.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncHandshake" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            SCHEMA_TOO_OLD — the handset's local schema predates the UUID
            columns, so it cannot name a row in a way this server understands.
            It updates before it pushes a byte. `details.minimumSchemaVersion`
            says what it needs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/sync/push:
    post:
      tags: [sync]
      operationId: syncPush
      summary: An ordered batch of envelopes, each with its own outcome
      description: |
        The order is the handset's own insertion order, which is the causal
        order: a parent was always inserted before its child.

        **It always answers 200.** The state of each envelope is in its own row,
        because a batch of two hundred weighings where one names a worker the
        web deleted has to get the other hundred and ninety-nine in. Every
        envelope runs in its own `SAVEPOINT` for exactly that reason.

        `opId` is THE IDEMPOTENCY KEY — of the act, not of the row; the row has
        its own uuid. Before applying anything the server looks the `opId` up in
        `sync_ops` and, if it is there, returns the recorded result LITERALLY
        without executing a thing. That is what covers the operations a
        client-generated uuid cannot: voiding and reversing, whose second
        attempt has a different answer from the first.

        At most 200 envelopes or 1 MB. The handset slices; on a farm's network a
        large batch is a batch that never finishes.

        `op` is `append` for the ledger and `upsert` for everything else. There
        is no `delete`: a deletion is an upsert carrying `deletedAt`, because a
        physical delete leaves no headstone and rises again on the next pull.

        Outgoing money is accepted WITHOUT a balance check. A `pago`, an
        `anticipo` or a `deduccion` is a fact — somebody handed over cash — and
        refusing its arrival does not undo the fact, it only makes the database
        lie. The balance goes negative and the excess behaves as an advance,
        which is what the handset already does and what golden case 07 fixes. A
        `devengo` is refused: it is written by POST /v1/settlements and only
        travels down.
      x-action: sync.push
      x-roles: [owner, admin, weigher]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushInput" }
      responses:
        "200":
          description: One result per envelope, and where the feed now is.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPushResult" }
        "400":
          description: |
            The BATCH is malformed — no `deviceId`, more than 200 envelopes. A
            single bad envelope is never a 400: it comes back as a `rejected`
            row with its own code.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/sync/pull:
    get:
      tags: [sync]
      operationId: syncPull
      summary: Everything that changed after a cursor
      description: |
        Changes in `seq` order, each with the body composed AT PULL TIME from
        the real table. The feed row itself carries only an identity, so a row
        corrected five times is sent once, in its current state, and the feed
        can never become a second copy of the money that drifts from the first.

        A settlement always travels WHOLE, with its lines. Never a header
        without its rows: a document for $1.187.500 with nothing underneath it
        is exactly what the handset's `user_version = 4` migration existed to
        repair.

        The reader never sees a change out of order and the cursor never jumps
        over one, because the query stops below a horizon: the lowest `seq`
        still owned by a transaction that may not have committed. A row held
        back is not lost — it appears in the next poll, in its place.

        A weigher's pull carries no `settlement` and no `ledgerEntry` body and
        no `balances`. His cursor still advances past them, because a cursor
        stranded behind the first payroll of the season would never move again.

        `balances` is a CHECKSUM, not a datum, and it arrives only in the last
        batch (`more: false`), when the handset is already up to date. The
        handset recomputes with its own BALANCE_SQL and compares; if they
        differ it flags the worker rather than copying the number. A total that
        arrives on the wire and is stored is the materialised total this design
        has refused three documents running.
      x-action: sync.pull
      x-roles: [owner, admin, weigher]
      parameters:
        - name: cursor
          in: query
          description: |
            The last `seq` this handset applied. 0 means "everything", which is
            a full bootstrap: the feed was backfilled when it was created, so a
            farm that predates synchronisation still answers from 0 with its
            whole state rather than with an empty list.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          description: At most 500, which is also the default.
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The changes after that cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPull" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            CURSOR_TOO_OLD — that cursor is older than the oldest change still
            retained (180 days), so the feed can no longer say what was missed.
            `details.oldestRetainedSeq` says where the feed starts. The handset
            pulls again from cursor 0. Skipping the gap in silence would lose
            changes for ever, which is why this is an error and not a shrug.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------------------------
  # La importación de la temporada (docs/sincronizacion.md §8, fases 3 y 4)
  # ---------------------------------------------------------------------------
  /v1/import/season:
    post:
      tags: [import]
      operationId: importSeason
      summary: Move a season that already exists on a handset onto the server
      description: |
        A farm has been running this season on a handset. Until that history is
        here, settlement cannot move here either: a settlement created on the
        server would claim payables the server has never seen, and the anti
        double-pay lock would have nothing to lock against. So the order is
        import first, and this is the import.

        **The handset's UUIDs are kept.** Every `id` below is the uuid the
        handset generated, and `payableId` on a settlement line points at the
        same uuid it pointed at there. The money is not remapped: a remap is a
        rewrite of the very column the anti double-pay index lives on, in the
        database that holds the only copy of a farm's season.

        The one identifier that is NOT the handset's is the plot's. The handset
        has `crops` and no plots, so a plot is invented around each crop and
        named after the lot the user had in their head; the `plot_crop`
        INHERITS the crop's uuid, because that is what the weighings point at.

        **It is idempotent** by (farm_id, id) like every other write here, and
        the report says what it wrote and what was already there. Phase 3 is
        meant to be run against a copy over and over until it comes out clean.

        **It reconciles to the cent, inside the transaction, and aborts if it
        does not.** `balances` is what the handset's own BALANCE_SQL says each
        worker's position is; it is not imported — nothing derived is ever
        stored — it is the check. One cent of disagreement is 409
        IMPORT_MISMATCH with every offending worker listed, and NOTHING is
        written: a 4xx never commits. Half an imported payroll is worse than
        none, because the figures look plausible and nobody goes looking.

        Nothing about this touches the handset, which is the whole safety
        argument of phase 4: if it fails, the farm is exactly as it was and
        there is nothing to undo.

        The owner's alone, and Money. It writes a year of settlements and a year
        of ledger in one act.
      x-action: import.season
      x-roles: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeasonImportInput" }
      responses:
        "200":
          description: |
            Everything was written and the reconciliation came out clean. The
            counts distinguish what this call wrote from what was already
            there, which is the whole answer to "did the retry do anything".
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeasonImportReport" }
        "400":
          description: |
            The file is malformed, or a row of it was refused by a constraint —
            a line that does not add up, a movement with the wrong sign, a week
            that is not a Monday. The message names the row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: |
            IMPORT_MISMATCH — a balance the handset sent does not match what the
            server derives from the ledger it just received, or fewer live
            settlement lines survived than were sent. `details.balances` lists
            every worker with both figures and the difference. Nothing was
            written.

            PAYABLE_ALREADY_CLAIMED — the file itself claims one payable in two
            live settlements. That is a handset whose own lock was bypassed, and
            it is not something to paper over.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A 15-minute access token with claims `sub`, `farm_id`, `role`,
        `device_id`. The farm comes from here and from nowhere else.

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    QueryQ:
      name: q
      in: query
      description: Free-text needle, case-insensitive substring.
      schema: { type: string }
    QueryStatus:
      name: status
      in: query
      description: |
        `active` (the default), `inactive` for what has been logically removed,
        `all` for both.
      schema: { type: string, enum: [active, inactive, all] }
    QueryIncludeDeleted:
      name: includeDeleted
      in: query
      description: Legacy synonym for `status=all`, kept because the phone sends it.
      deprecated: true
      schema: { type: boolean }
    QueryLimit:
      name: limit
      in: query
      description: Rows to return. Out-of-range values fall back to the default.
      schema: { type: integer, minimum: 1, maximum: 500 }
    QueryFrom:
      name: from
      in: query
      schema: { type: string, format: date }
    QueryTo:
      name: to
      in: query
      schema: { type: string, format: date }
    QueryWorkerID:
      name: workerId
      in: query
      schema: { type: string, format: uuid }

  requestBodies:
    CatalogItem:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string, minLength: 1 }

  responses:
    BadRequest:
      description: BAD_REQUEST — malformed body, unknown field, or a bad value.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: UNAUTHORIZED — no token, or a token this server did not issue.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: FORBIDDEN — the permission table refused this role.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: |
        NOT_FOUND. Also what a resource of another farm answers, and what an id
        that is not a UUID answers: nothing with that id exists here.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyKeyReused:
      description: |
        IDEMPOTENCY_KEY_REUSED — the id is already in use by a different write.

        Idempotent by (farm_id, id) means resending the SAME write is safe. It
        does not mean the id is a slot to overwrite: an id arriving with a
        different worker or a different amount is a client bug, and answering
        200 would tell the caller a payment went through that was never
        written. `details.existing` carries the row that is actually there.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CatalogList:
      description: The farm's entries, by name.
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: { $ref: "#/components/schemas/CatalogItem" }
    CatalogItem:
      description: The row that name means on this farm.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CatalogItem" }

  schemas:

    ErrorCode:
      type: string
      description: |
        The machine-readable half of every failure. The client branches on
        this; the translation lives in the client, which is why `message` is
        English.

        This enum is compared against domain.AllCodes() by the contract test,
        so a code cannot exist in the server without appearing here.
      enum:
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - INTERNAL
        - TENANT_NOT_SET
        - INVALID_CREDENTIALS
        - EMAIL_NOT_VERIFIED
        - EMAIL_TAKEN
        - TOKEN_EXPIRED
        - TOKEN_REUSED
        - RATE_LIMITED
        - FARM_LIMIT_REACHED
        - FARM_SUSPENDED
        - WORK_RECORD_SETTLED
        - PAYABLE_ALREADY_CLAIMED
        - SETTLEMENT_ALREADY_VOID
        - ALREADY_REVERSED
        - NOTHING_TO_SETTLE
        - AMOUNT_EXCEEDS_BALANCE
        - INVALID_GEOMETRY
        - PLOT_HAS_ACTIVE_CROPS
        - NO_RATE_IN_FORCE
        - RANGE_NEEDS_FROZEN_RATE
        - DUPLICATE_DOCUMENT
        - DUPLICATE_NAME
        - LAST_OWNER
        - GROSS_CHANGED
        - EMPLOYEE_EXISTS_DELETED
        - CURSOR_TOO_OLD
        - SCHEMA_TOO_OLD
        - IMPORT_MISMATCH
        - IDEMPOTENCY_KEY_REUSED
        - INSUFFICIENT_STOCK
        - SALE_ALREADY_VOID
        - EXPENSE_TARGET_INVALID
        - UPLOAD_TOO_LARGE
        - UPLOAD_NOT_READY
        - UNSUPPORTED_MEDIA_TYPE

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: English, for a developer and a log. Never shown to a picker.
            details:
              type: object
              additionalProperties: true
              description: |
                What a client needs to recover. The canonical case is
                PAYABLE_ALREADY_CLAIMED, where `winningSettlement` lets the
                phone re-derive its state.

    Role:
      type: string
      enum: [owner, admin, weigher]

    PayScheme:
      type: string
      description: |
        How an activity pays. Spanish values because they are the values stored
        in the Postgres enum, which the design documents fixed.
      enum: [contrato, tiempo, unidad_trabajo]

    RateSource:
      type: string
      description: |
        When the price froze. `explicit` — the caller named it, frozen at write
        time. `activity_dated` — the activity's rate in force on the record's
        day, frozen at write time. `weekly_price` — read from the week at
        settlement time, which is what the phone does today. The two derived
        forms require a single-day record.
      enum: [explicit, activity_dated, weekly_price]

    LedgerKind:
      type: string
      description: |
        These six describe a coffee pickup, a day's wage and a pruning contract
        equally well, which is why generalising the payable side required no
        change here at all.
      enum: [devengo, pago, anticipo, deduccion, ajuste, reverso]

    PayMethod:
      type: string
      enum: [efectivo, transferencia, otro]

    TimeUnit:
      type: string
      enum: [jornal, semanal, quincenal, mensual, personalizado]

    # -- auth ----------------------------------------------------------------

    SignupRequest:
      type: object
      required: [farm, owner]
      properties:
        farm:
          type: object
          required: [name, priceCents]
          properties:
            name: { type: string, minLength: 1 }
            timezone:
              type: string
              default: America/Bogota
              description: |
                An IANA name. Mandatory in the schema and validated: every
                business day in this system is a day in the farm's zone, so a
                bad name would misfile work by a day.
            currency: { type: string, default: COP, minLength: 3, maxLength: 3 }
            priceCents:
              type: integer
              format: int64
              minimum: 1
              description: The farm's standing price per unit of collection.
        owner:
          type: object
          required: [email, password]
          properties:
            email: { type: string, format: email }
            name: { type: string }
            password: { type: string, minLength: 10 }

    SignupResponse:
      type: object
      required: [farmId, userId, verificationRequired]
      properties:
        farmId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        verificationRequired: { type: boolean }
        verificationToken:
          type: string
          description: |
            Present only when the server runs with DevEcho on, because there is
            no mail sender yet. The server refuses to start with it on outside
            development.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        farmId:
          type: string
          format: uuid
          description: Required only when the account belongs to more than one farm.
        deviceId: { type: string }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
        deviceId: { type: string }

    Session:
      type: object
      required: [accessToken, refreshToken, expiresIn, farmId, farmName, role]
      properties:
        accessToken: { type: string }
        refreshToken:
          type: string
          description: |
            Opaque, 60 days, single use. Only its sha256 is stored, so a dump of
            the table hands out no sessions.
        expiresIn: { type: integer, description: Seconds until the access token expires. }
        farmId: { type: string, format: uuid }
        farmName: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Me:
      type: object
      required: [id, email, name, role, farm, superadmin]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        superadmin: { type: boolean }
        farm:
          type: object
          required: [id, name, timezone, currency]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            timezone: { type: string }
            currency: { type: string }

    # -- farm ----------------------------------------------------------------

    Farm:
      type: object
      required: [id, name, timezone, currency, minorUnit]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        currency: { type: string }
        minorUnit: { type: integer, description: Decimal places in the currency. }
        phone: { type: string, nullable: true }
        country: { type: string, nullable: true }
        city: { type: string, nullable: true }
        address: { type: string, nullable: true }
        areaHa: { type: number, format: double, nullable: true }
        suspendedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        moneyReadOnly:
          type: boolean
          description: |
            The phase 4 switch of docs/sincronizacion.md §8. While it is on the
            handsets may still record weighings — the cut cannot stop the scale
            — and may not settle, pay or void. It rides down in the handshake's
            `capabilities`.

            It is NOT a permission and nothing may read it as one. The server
            refuses a weigher's ledger push and a settlement whose gross has
            moved whether this is on or off; what it buys is that nobody is
            looking at a live pay button during the hour the two databases
            disagree.
        priceCents:
          type: integer
          format: int64
          description: |
            The standing price per unit of collection. Absent — not null — for
            the weigher.

    FarmPatch:
      type: object
      properties:
        name: { type: string }
        timezone: { type: string }
        currency: { type: string }
        phone: { type: string, nullable: true }
        country: { type: string, nullable: true }
        city: { type: string, nullable: true }
        address: { type: string, nullable: true }
        areaHa: { type: number, format: double, nullable: true }
        moneyReadOnly:
          type: boolean
          description: The phase 4 switch. Absent leaves it as it was.
        priceCents: { type: integer, format: int64, minimum: 1 }

    AdminFarm:
      type: object
      description: |
        Every field the platform administrator may see about a farm, and the
        list is short on purpose.
      required: [id, name, timezone, currency, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        currency: { type: string }
        country: { type: string, nullable: true }
        city: { type: string, nullable: true }
        status: { type: string, enum: [active, suspended] }
        suspendedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    # -- users ---------------------------------------------------------------

    FarmUser:
      type: object
      description: |
        One member of this farm. `role` is the role the account holds HERE; the
        same account may hold a different one on another farm.
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, weigher] }
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Null means the address has never been proven and the account cannot
            open a session. An account created by an invite is verified on the
            spot, because a member of the farm vouched for it.
        createdAt: { type: string, format: date-time }

    UserInvite:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, admin, weigher] }
        password:
          type: string
          minLength: 10
          description: |
            Optional. Omit it and the server mints one and returns it once.
            Ignored entirely when the address already has an account.

    InvitedUser:
      allOf:
        - $ref: "#/components/schemas/FarmUser"
        - type: object
          properties:
            temporaryPassword:
              type: string
              description: |
                Present only when the server minted the password. Shown once:
                the row keeps an argon2id hash and there is no way to read it
                again.
            temporaryPasswordNote: { type: string }

    Reactivation:
      type: object
      description: |
        One automatic reactivation (decision 8), with everything needed to
        answer "who undid my decision, and why".
      required: [id, workerId, workRecordId, source, deactivatedAt, at]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        workRecordId:
          type: string
          format: uuid
          description: |
            The labour that provoked it. Never null: an automatic reactivation
            with no cause attached is the silent undo this record exists to
            prevent.
        deviceId:
          type: string
          format: uuid
          nullable: true
          description: |
            The handset the work came from. Null means the web console, and
            `source` is what says so — never "unknown".
        source: { type: string, enum: [sync, web] }
        deactivatedAt:
          type: string
          format: date-time
          description: The deactivation that was undone.
        deactivatedBy:
          type: string
          format: uuid
          nullable: true
          description: |
            Who took the person off the payroll. Null when the deactivation
            predates this column or came from a path with no session to name.
        reactivatedBy:
          type: string
          format: uuid
          nullable: true
          description: |
            The session the work arrived through. NOT "who decided": nobody
            decided, that is the point of the record.
        at: { type: string, format: date-time }

    # -- workers -------------------------------------------------------------

    Worker:
      type: object
      description: |
        Two shapes behind one name. An owner or administrator receives every
        field; the weigher receives `id`, `name`, `lastName` and `tag` only,
        and the rest are absent rather than null.
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        lastName: { type: string, nullable: true }
        tag:
          type: string
          nullable: true
          description: The number on the basket, unique within the farm.
        documentType: { type: string, nullable: true }
        docId: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        municipality: { type: string, nullable: true }
        country: { type: string, nullable: true }
        photoId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Non-null means off the payroll. The row and its history stay.

    WorkerInput:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        lastName: { type: string, nullable: true }
        documentType: { type: string, nullable: true }
        docId: { type: string, nullable: true }
        tag: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        municipality: { type: string, nullable: true }
        country: { type: string, nullable: true, default: CO }
        photoId: { type: string, format: uuid, nullable: true }

    WorkerPatch:
      allOf:
        - $ref: "#/components/schemas/WorkerInput"
        - type: object
          properties:
            name: { type: string }
            status: { type: string, enum: [active, inactive] }

    Note:
      type: object
      required: [id, workerId, date, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        date:
          type: string
          format: date-time
          description: The business day it refers to, midnight UTC.
        text: { type: string }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    NoteInput:
      type: object
      required: [text]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, minLength: 1 }
        date:
          type: string
          format: date
          description: Defaults to today in the farm's timezone.

    WorkerProfile:
      type: object
      required: [worker, balance, ledger, tasks, notes, reactivations]
      properties:
        worker: { $ref: "#/components/schemas/Worker" }
        balance: { $ref: "#/components/schemas/Balance" }
        ledger:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/WorkRecord" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/Note" }
        reactivations:
          type: array
          description: |
            Every time this person was put back on the payroll automatically by
            arriving work (decision 8). Empty for almost everybody.
          items: { $ref: "#/components/schemas/Reactivation" }

    Payables:
      type: object
      required: [workerId, tasks, debts, balance, grossCents, balanceCents, totalCents]
      properties:
        workerId: { type: string, format: uuid }
        tasks:
          type: array
          description: Unsettled work, each line already priced.
          items: { $ref: "#/components/schemas/Payable" }
        debts:
          type: array
          description: |
            Live deductions and advances, with the ledger's own negative sign.
            Already inside `balanceCents`; do not subtract them again.
          items: { $ref: "#/components/schemas/LedgerEntry" }
        balance: { $ref: "#/components/schemas/Balance" }
        grossCents: { type: integer, format: int64, description: Sum of `tasks`. }
        balanceCents: { type: integer, format: int64, description: Same as balance.balanceCents. }
        totalCents:
          type: integer
          format: int64
          description: balanceCents + grossCents — what settling everything listed would owe.

    # -- plots ---------------------------------------------------------------

    GeoJsonGeometry:
      type: object
      description: |
        A GeoJSON Polygon or MultiPolygon in WGS 84. PostGIS never crosses this
        boundary: the wire format is GeoJSON so the clients never see a
        geography type and changing engines stays possible.
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon, MultiPolygon] }
        coordinates:
          type: array
          items: {}
      example:
        type: Polygon
        coordinates: [[[-75.88, 5.66], [-75.87, 5.66], [-75.87, 5.67], [-75.88, 5.67], [-75.88, 5.66]]]

    Plot:
      type: object
      required: [id, name, crops]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        areaHa:
          type: number
          format: double
          nullable: true
          description: What the owner declared.
        computedAreaHa:
          type: number
          format: double
          nullable: true
          description: |
            ST_Area of the polygon, in hectares. Returned alongside `areaHa`
            and never instead of it: they always disagree, and hiding one
            decides for the owner which one lies. Null until a boundary exists.
        department: { type: string, nullable: true }
        municipality: { type: string, nullable: true }
        boundary:
          allOf: [{ $ref: "#/components/schemas/GeoJsonGeometry" }]
          nullable: true
        createdAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        crops:
          type: array
          items: { $ref: "#/components/schemas/PlotCrop" }

    PlotCrop:
      type: object
      required: [id, plotId, cropTypeId, cropType]
      properties:
        id: { type: string, format: uuid }
        plotId: { type: string, format: uuid }
        cropTypeId: { type: string, format: uuid }
        cropType: { type: string }
        varietyId: { type: string, format: uuid, nullable: true }
        variety: { type: string, nullable: true }
        areaHa: { type: number, format: double, nullable: true }
        plantedOn: { type: string, format: date-time, nullable: true }
        removedOn: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true }

    PlotCropInput:
      type: object
      description: |
        Type and variety may be given by id or by name. A name the catalogue
        has not seen is added to it, which is the "add it if it is not there"
        button rather than a rejection.
      properties:
        id: { type: string, format: uuid }
        cropTypeId: { type: string, format: uuid }
        cropType: { type: string }
        varietyId: { type: string, format: uuid, nullable: true }
        variety: { type: string, nullable: true }
        areaHa: { type: number, format: double, nullable: true }
        plantedOn: { type: string, format: date-time, nullable: true }
        removedOn: { type: string, format: date-time, nullable: true }

    PlotInput:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        areaHa: { type: number, format: double, nullable: true }
        department: { type: string, nullable: true }
        municipality: { type: string, nullable: true }
        boundary:
          allOf: [{ $ref: "#/components/schemas/GeoJsonGeometry" }]
          nullable: true
        crops:
          type: array
          items: { $ref: "#/components/schemas/PlotCropInput" }

    PlotPatch:
      allOf:
        - $ref: "#/components/schemas/PlotInput"
        - type: object
          properties:
            name: { type: string }
            status: { type: string, enum: [active, inactive] }

    BoundaryInput:
      type: object
      description: |
        `boundary` is the field; `geojson` is accepted as a synonym because the
        design document used that word.
      properties:
        boundary:
          allOf: [{ $ref: "#/components/schemas/GeoJsonGeometry" }]
        geojson:
          allOf: [{ $ref: "#/components/schemas/GeoJsonGeometry" }]
          deprecated: true

    BoundaryResult:
      type: object
      required: [plot, overlaps]
      properties:
        plot: { $ref: "#/components/schemas/Plot" }
        overlaps:
          type: array
          description: |
            Other plots this one now intersects. A warning, never a refusal.
          items: { $ref: "#/components/schemas/CatalogItem" }

    # -- catalogues and activities -------------------------------------------

    CatalogItem:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    WorkUnit:
      type: object
      required: [id, code, label]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: kg }
        label: { type: string, example: Kilo }
        kgFactor:
          type: number
          format: double
          nullable: true
          description: What one of these weighs, for farms that count in baskets.

    WorkUnitInput:
      type: object
      required: [code]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, minLength: 1 }
        label: { type: string, description: Defaults to `code`. }
        kgFactor: { type: number, format: double, nullable: true }

    ActivityRate:
      type: object
      description: |
        One validity period of an activity's price. Decision 4: the rate is not
        a loose column, it is a row with a `validFrom`, and a work record
        freezes the one in force on its day.
      required: [validFrom, rateCents]
      properties:
        validFrom: { type: string, format: date-time }
        rateCents: { type: integer, format: int64 }
        timeUnit:
          allOf: [{ $ref: "#/components/schemas/TimeUnit" }]
          nullable: true
        customQty: { type: number, format: double, nullable: true }
        customUnit: { type: string, nullable: true }

    Activity:
      type: object
      required: [id, name, categoryId, category, payScheme, rateSource]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        categoryId: { type: string, format: uuid }
        category: { type: string }
        payScheme: { $ref: "#/components/schemas/PayScheme" }
        rateSource: { $ref: "#/components/schemas/RateSource" }
        unitId:
          type: string
          format: uuid
          nullable: true
          description: |
            On the activity and not on its rate: the unit is what is being
            counted, not what it costs. That is what lets a weigher see he is
            weighing kilos while being unable to read a single price.
        archivedAt: { type: string, format: date-time, nullable: true }
        rate:
          allOf: [{ $ref: "#/components/schemas/ActivityRate" }]
          nullable: true
          description: |
            The period in force on the requested day. ABSENT — not null — for
            the weigher.

    ActivityInput:
      type: object
      required: [name, payScheme, rate]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        categoryId: { type: string, format: uuid, description: One of this or `category`. }
        category: { type: string, description: A name; created in the catalogue if new. }
        payScheme: { $ref: "#/components/schemas/PayScheme" }
        rateSource:
          allOf: [{ $ref: "#/components/schemas/RateSource" }]
          description: |
            Defaults to `activity_dated`. `weekly_price` only for
            `unidad_trabajo`; `explicit` is rejected — it belongs to a single
            work record, not to an activity.
        unitId:
          type: string
          format: uuid
          nullable: true
          description: Required for `unidad_trabajo`, forbidden otherwise.
        rate: { $ref: "#/components/schemas/RateInput" }

    ActivityPatch:
      type: object
      description: |
        `payScheme` and `rateSource` are listed so the failure is explicit:
        sending either is a 400, never a silent no-op.
      properties:
        name: { type: string }
        categoryId: { type: string, format: uuid }
        category: { type: string }
        status: { type: string, enum: [active, inactive] }
        payScheme: { type: string, description: Rejected. }
        rateSource: { type: string, description: Rejected. }

    RateInput:
      type: object
      required: [rateCents]
      properties:
        rateCents: { type: integer, format: int64, minimum: 1 }
        validFrom:
          type: string
          format: date
          description: Defaults to today. A period that already starts on this day is corrected.
        timeUnit:
          allOf: [{ $ref: "#/components/schemas/TimeUnit" }]
          nullable: true
        customQty: { type: number, format: double, nullable: true }
        customUnit: { type: string, nullable: true }

    # -- work records --------------------------------------------------------

    WorkRecord:
      type: object
      required: [id, workerId, activityId, payScheme, rateSource, quantity, dateFrom, dateTo]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        activityId: { type: string, format: uuid }
        payScheme: { $ref: "#/components/schemas/PayScheme" }
        rateSource: { $ref: "#/components/schemas/RateSource" }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
        dateFrom:
          type: string
          format: date-time
          description: The business day, in the farm's timezone, at midnight UTC.
        dateTo: { type: string, format: date-time }
        weekStart: { type: string, format: date-time, description: The Monday of dateFrom's ISO week. }
        quantity:
          type: string
          description: |
            A decimal with at most three places, sent as a JSON number and
            returned as a string. It is a string because a float64 round trip
            is exactly where two languages start disagreeing in the third
            decimal and nobody notices until payday.

            AT MOST THREE PLACES IS ENFORCED, and a fourth is a 400 naming the
            field and the limit. The column is numeric(12, 3) and Postgres
            would ROUND a fourth place rather than refuse it: 1,0005 kg at $75
            is 7504 on the handset and would be stored here as 1,001 and
            charged at 7508, with a 200 and no mention of it anywhere. Round it
            on the client, in front of the person whose kilos they are. At most
            nine digits before the point, for the same reason: a larger number
            is a bad request, not a 500.

            The same rule holds for every fixed-scale field a client can
            write - `areaHa`, `qty`, `rate.customQty`, `kgFactor` - because a
            rule enforced on one field and not its neighbours is a rule nobody
            can rely on.
        unitId: { type: string, format: uuid, nullable: true }
        rateCents:
          type: integer
          format: int64
          nullable: true
          description: Null while the price is the week's and has not been read yet.
        amountCents:
          type: integer
          format: int64
          nullable: true
          description: round(quantity × rateCents). Null for the same reason.
        note: { type: string, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        plotIds:
          type: array
          items: { type: string, format: uuid }
        plotCropIds:
          type: array
          items: { type: string, format: uuid }
        settled:
          type: boolean
          description: A live settlement has claimed it. It cannot be edited or removed.
        estimatedAmountCents:
          type: integer
          format: int64
          description: |
            What the record is worth, always a number. `amountCents` above is
            the row's own truth and is null for anything priced by the week,
            because that price is not chosen until the week is settled — which
            left every harvest record in the console reading as $0, settled ones
            included. This is the settled amount when there is one, and
            otherwise the quantity at the price in force for its week: the
            number a settlement would post today.
        amountIsEstimate:
          type: boolean
          description: |
            False once the amount is frozen by a settlement, true while it is
            still derived from the week's price and could move if that price
            changes. What we owe and what we paid must never look alike.

    WorkRecordInput:
      type: object
      required: [activityId, workerId, quantity, dateFrom]
      properties:
        id: { type: string, format: uuid }
        activityId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        quantity: { type: number, description: "Positive, at most three decimal places; a fourth is a 400. Ignored and set to 1 for a contract." }
        rateCents:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: |
            Freezes the price here and makes a date range legal. A weigher may
            not send one.
        dateFrom: { type: string, format: date }
        dateTo:
          type: string
          format: date
          description: |
            Defaults to `dateFrom`. A record with a date-derived price must be
            a single day.
        plotIds:
          type: array
          items: { type: string, format: uuid }
        plotCropIds:
          type: array
          items: { type: string, format: uuid }
        note: { type: string, nullable: true }
        deviceId: { type: string, nullable: true }

    WorkRecordPatch:
      type: object
      description: |
        The rejected fields are listed so the refusal has a sentence in it
        rather than a bare "malformed body": they are deliberate, not typos.
      properties:
        quantity: { type: number, description: "Positive, at most three decimal places; a fourth is a 400. The amount is recomputed." }
        note: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
        rateCents: { type: integer, format: int64, description: Rejected. }
        workerId: { type: string, format: uuid, description: Rejected. }
        activityId: { type: string, format: uuid, description: Rejected. }
        dateFrom: { type: string, format: date, description: Rejected. }
        dateTo: { type: string, format: date, description: Rejected. }

    PickupInput:
      type: object
      description: DEPRECATED. The phone's vocabulary, translated onto a work record.
      required: [date]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        employeeId: { type: string, format: uuid, description: Synonym for `workerId`. }
        weight: { type: number, description: Kilos. Synonym for `quantity`. }
        quantity: { type: number }
        date: { type: string, format: date }
        activityId:
          type: string
          format: uuid
          description: Defaults to the farm's activity priced by the week.
        plotId: { type: string, format: uuid }
        cropId: { type: string, format: uuid, description: A plot_crop id. }
        note: { type: string, nullable: true }
        deviceId: { type: string, nullable: true }

    # -- money ---------------------------------------------------------------

    Balance:
      type: object
      description: |
        Derived from the ledger, never stored: a stored total is a total that
        one day lies. Positive means the farm owes them.

        A worker who has been taken off the payroll and is still owed money
        STAYS on `GET /v1/balances`, with `active: false`. Dropping them would
        make the debt vanish from the only screen anybody looks at while the
        money sat untouched in the ledger. The only row that leaves the list is
        somebody deactivated who never moved a peso.
      required: [workerId, earnedCents, paidCents, deductedCents, balanceCents, active]
      properties:
        workerId: { type: string, format: uuid }
        earnedCents: { type: integer, format: int64 }
        paidCents: { type: integer, format: int64 }
        deductedCents: { type: integer, format: int64 }
        balanceCents: { type: integer, format: int64 }
        lastMovementOn: { type: string, format: date-time, nullable: true }
        active:
          type: boolean
          description: |
            False for somebody no longer on the payroll. They are listed all
            the same while they have movements; the caller renders the
            difference rather than guessing at an absence.

    LedgerEntry:
      type: object
      description: |
        One movement. Append-only: nothing here is ever edited or deleted, and
        the database has triggers that forbid both. Signs are part of the
        contract — `pago`, `anticipo` and `deduccion` are negative, `devengo`
        is positive, and a `reverso` carries the exact opposite of what it
        cancels.
      required: [id, workerId, kind, amountCents, date, createdAt]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/LedgerKind" }
        amountCents: { type: integer, format: int64 }
        date: { type: string, format: date-time }
        settlementId: { type: string, format: uuid, nullable: true }
        method:
          allOf: [{ $ref: "#/components/schemas/PayMethod" }]
          nullable: true
        note: { type: string, nullable: true }
        reversesId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    PaymentInput:
      type: object
      required: [workerId, amountCents]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        amountCents:
          type: integer
          format: int64
          description: Positive. The sign is applied by the server.
        method:
          allOf: [{ $ref: "#/components/schemas/PayMethod" }]
          nullable: true
        note: { type: string, nullable: true }
        date: { type: string, format: date, description: Defaults to today in the farm's zone. }
        allowOverpayment:
          type: boolean
          default: false
          description: |
            Pay more than the balance on purpose; the excess behaves as an
            advance. Ignored by /v1/advances, which never checks.

    DeductionInput:
      type: object
      required: [workerId, amountCents]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        amountCents: { type: integer, format: int64, description: Positive. }
        note: { type: string, nullable: true }
        date: { type: string, format: date }

    AdjustmentInput:
      type: object
      required: [workerId, amountCents]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        amountCents:
          type: integer
          format: int64
          description: Signed. Positive credits the worker, negative charges them.
        note: { type: string, nullable: true }
        date: { type: string, format: date }

    Payable:
      type: object
      description: One unsettled work record, priced.
      required: [payableId, activityId, activity, payScheme, rateSource, quantity, rateCents, amountCents]
      properties:
        payableId: { type: string, format: uuid, description: The work record's id. }
        activityId: { type: string, format: uuid }
        activity: { type: string }
        payScheme: { $ref: "#/components/schemas/PayScheme" }
        rateSource: { $ref: "#/components/schemas/RateSource" }
        quantity: { type: string }
        unitId: { type: string, format: uuid, nullable: true }
        date: { type: string, format: date-time }
        weekStart: { type: string, format: date-time }
        rateCents: { type: integer, format: int64 }
        amountCents: { type: integer, format: int64 }
        voided: { type: boolean, description: Only meaningful inside a settlement. }

    PendingResult:
      type: object
      required: [workerId, from, to, items, totalCents]
      properties:
        workerId: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/Payable" }
        totalCents: { type: integer, format: int64 }

    SettlementInput:
      type: object
      required: [workerId, from, to]
      properties:
        id: { type: string, format: uuid }
        expectedGrossCents:
          type: integer
          format: int64
          description: |
            What the caller was shown by POST /v1/settlements/preview.

            REQUIRED on POST /v1/settlements, ignored by the preview itself.
            If the settlement would not add up to this, the server writes
            nothing and answers 409 GROSS_CHANGED with the new figure and what
            moved it. Between reading the screen and pressing the button the
            owner can reprice the week from the web and a late weighing can
            arrive; a settlement that comes out to a different number than the
            one the person read is a number they are about to count out in
            cash.

            It is required and not optional on purpose, and the reasoning is in
            the doc comment on handleCreateSettlement: a money guard a client
            may omit is a guard that is off in exactly the moment it matters.
            The one call that does not consult it is a retry — an `id` that
            already names a settlement answers 200 with that settlement without
            looking at this field, because by then the cash has been counted.
        workerId: { type: string, format: uuid }
        from: { type: string, format: date }
        to: { type: string, format: date }
        payableIds:
          type: array
          description: Omit to settle everything pending in the range.
          items: { type: string, format: uuid }
        note: { type: string, nullable: true }

    SettlementPreview:
      type: object
      required: [workerId, from, to, items, grossCents, balance]
      properties:
        workerId: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/Payable" }
        grossCents: { type: integer, format: int64 }
        balance: { $ref: "#/components/schemas/Balance" }

    Settlement:
      type: object
      required: [id, workerId, periodStart, periodEnd, grossCents, status, items]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        periodStart:
          type: string
          format: date-time
          description: |
            The period actually covered — the Monday of the earliest payable
            taken in — not the window the caller asked over.
        periodEnd: { type: string, format: date-time }
        grossCents: { type: integer, format: int64 }
        status: { type: string, enum: [open, void] }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: "#/components/schemas/Payable" }

    SettlementSummary:
      type: object
      description: |
        One row of GET /v1/settlements: a settlement without its lines. `items`
        is always an empty array — fetch /v1/settlements/{id} for the lines —
        and the worker's name is joined in so a list of thirty does not become
        thirty more requests.
      required: [id, workerId, workerName, periodStart, periodEnd, grossCents, status, itemCount, items]
      properties:
        id: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        workerName: { type: string }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        grossCents: { type: integer, format: int64 }
        status: { type: string, enum: [open, void] }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
        itemCount:
          type: integer
          description: |
            LIVE lines. A voided settlement keeps its line rows, and counting
            those would say a cancelled document still claims twelve weighings.
        items:
          type: array
          description: Always empty here. The lines are on the detail route.
          items: { $ref: "#/components/schemas/Payable" }

    WeekPrice:
      type: object
      required: [weekStart, priceCents]
      properties:
        weekStart: { type: string, format: date, description: An ISO Monday. }
        priceCents: { type: integer, format: int64 }

    StockReason:
      type: string
      description: |
        What a movement is FOR, and the sign that follows from it. An enum and
        not a catalogue because the server branches on it: `stock_sign` in the
        database reads it, the sales module writes `venta` and nothing else,
        and a farm inventing one would be a value no code knows what to do
        with.

        `cosecha` and `compra` come in. `venta`, `consumo` and `merma` go out.
        `traslado` and `ajuste` may go either way — `ajuste` is what a reversal
        carries, which is why its sign is free.
      enum: [cosecha, compra, venta, consumo, merma, traslado, ajuste]

    Product:
      type: object
      required: [id, name, storageUnitId, storageUnit, stock]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        categoryId: { type: string, format: uuid, nullable: true }
        category: { type: string, nullable: true }
        storageUnitId: { type: string, format: uuid }
        storageUnit: { type: string }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }
        stock:
          type: number
          format: double
          description: |
            Units on hand across every warehouse. A SUM over stock_moves
            computed for this response — there is no such column.

    ProductInput:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        categoryId: { type: string, format: uuid, nullable: true }
        category:
          type: string
          description: A name instead of an id; created if the catalogue has not got it.
        storageUnitId: { type: string, format: uuid, nullable: true }
        storageUnit:
          type: string
          description: |
            A name instead of an id. One of storageUnitId or storageUnit is
            required: a product with no unit is a quantity nobody can read.
        note: { type: string, nullable: true }

    ProductPatch:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          properties:
            status: { type: string, enum: [active, inactive] }

    StockLevel:
      type: object
      description: One derived line of the existencias screen.
      required: [productId, product, storageUnit, warehouseId, warehouse, qty]
      properties:
        productId: { type: string, format: uuid }
        product: { type: string }
        storageUnit: { type: string }
        warehouseId: { type: string, format: uuid }
        warehouse: { type: string }
        qty: { type: number, format: double }

    StockMove:
      type: object
      description: |
        One fact about the warehouse. Append-only: the database has a trigger
        and a REVOKE that forbid editing and deleting one, exactly as it does
        for the ledger.
      required: [id, productId, product, warehouseId, warehouse, qty, reason, localDay]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        product: { type: string }
        warehouseId: { type: string, format: uuid }
        warehouse: { type: string }
        plotId: { type: string, format: uuid, nullable: true }
        plot: { type: string, nullable: true }
        plotCropId: { type: string, format: uuid, nullable: true }
        qty:
          type: number
          format: double
          description: Signed. Positive comes in, negative goes out.
        reason: { $ref: "#/components/schemas/StockReason" }
        note: { type: string, nullable: true }
        workRecordId: { type: string, format: uuid, nullable: true }
        saleId:
          type: string
          format: uuid
          nullable: true
          description: Set on every `venta` movement, and on no other kind.
        reversesId:
          type: string
          format: uuid
          nullable: true
          description: The movement this one cancels, when it is a correction.
        reversedById:
          type: string
          format: uuid
          nullable: true
          description: The movement that cancelled this one, if any. Once, at most.
        localDay: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        labelBatchId: { type: string, format: uuid, nullable: true }

    StockMoveInput:
      type: object
      required: [productId, warehouseId, qty, reason]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        plotId: { type: string, format: uuid, nullable: true }
        plotCropId:
          type: string
          format: uuid
          nullable: true
          description: |
            Needs the plotId it is planted in, and the database checks that it
            really is planted there. Without that, a movement could say "lote
            3, café del lote 7" and every per-plot report would be quietly
            wrong.
        qty:
          type: number
          format: double
          description: |
            May be sent unsigned; the server applies the sign the reason
            implies, and the database refuses the pair if they disagree.
        reason: { $ref: "#/components/schemas/StockReason" }
        note: { type: string, nullable: true }
        workRecordId: { type: string, format: uuid, nullable: true }
        localDay:
          type: string
          format: date
          description: Defaults to today in the farm's timezone, computed by the database.
        labels:
          type: integer
          minimum: 0
          maximum: 500
          description: How many identification stickers to generate. The server does not print.
        allowNegative:
          type: boolean
          default: false
          description: |
            Record an outgoing movement that takes the level below zero. Same
            escape hatch `allowOverpayment` gives a payment: the guard exists
            because a keyboard makes typos, the override because a warehouse
            whose opening balance was never entered is ordinary.

    LabelBatch:
      type: object
      description: |
        The stickers for one movement. `labels` are derived from the movement
        each time they are read rather than frozen into rows: a sticker is a
        rendering of a fact, not a fact of its own.
      required: [id, stockMoveId, count, labels]
      properties:
        id: { type: string, format: uuid }
        stockMoveId: { type: string, format: uuid }
        count: { type: integer }
        printedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        labels:
          type: array
          items:
            type: object
            required: [code, product, storageUnit, qty, warehouse, localDay]
            properties:
              code: { type: string }
              product: { type: string }
              storageUnit: { type: string }
              qty: { type: number, format: double }
              warehouse: { type: string }
              plot: { type: string, nullable: true }
              localDay: { type: string, format: date }

    Customer:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        documentType: { type: string, nullable: true }
        docId: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }

    CustomerInput:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        documentType: { type: string, nullable: true }
        docId: { type: string, nullable: true }
        phone: { type: string, nullable: true }

    Sale:
      type: object
      required: [id, productId, product, warehouseId, qty, amountCents, localDay]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        product: { type: string }
        storageUnit: { type: string }
        customerId: { type: string, format: uuid, nullable: true }
        customer: { type: string, nullable: true }
        warehouseId: { type: string, format: uuid }
        warehouse: { type: string }
        qty: { type: number, format: double }
        amountCents:
          type: integer
          format: int64
          description: The value, in the currency's minor unit. Never a float.
        receiptId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
        localDay: { type: string, format: date-time }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        voidedAt: { type: string, format: date-time, nullable: true }
        stockMoveId:
          type: string
          format: uuid
          nullable: true
          description: The outgoing movement written with this sale, in the same transaction.
        reversalMoveId:
          type: string
          format: uuid
          nullable: true
          description: The movement that put the stock back when the sale was voided.

    SaleInput:
      type: object
      required: [productId, warehouseId, qty, amountCents]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        warehouseId:
          type: string
          format: uuid
          description: A sale takes the product out of somewhere, and the movement needs it.
        customerId: { type: string, format: uuid, nullable: true }
        customer:
          type: string
          description: A name instead of an id; created if it is not there yet.
        qty: { type: number, format: double, minimum: 0, exclusiveMinimum: true }
        amountCents: { type: integer, format: int64, minimum: 1 }
        receiptId:
          type: string
          format: uuid
          nullable: true
          description: |
            An attachment from /v1/uploads whose bytes have arrived. A pending
            one is refused: a sale pointing at a photo that never uploaded
            renders as a broken image with no way to tell which it was.
        note: { type: string, nullable: true }
        localDay: { type: string, format: date }
        allowNegativeStock: { type: boolean, default: false }

    SalePatch:
      type: object
      description: |
        Everything RSP-028 can change. `qty` and `status` are accepted only to
        be refused with an explanation — see the operation description.
      properties:
        customerId: { type: string, format: uuid, nullable: true }
        customer: { type: string }
        amountCents: { type: integer, format: int64, minimum: 1 }
        receiptId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
        localDay: { type: string, format: date }
        qty:
          type: number
          format: double
          description: Always 400. The quantity is fixed by the stock movement.
        status:
          type: string
          description: Always 400. Use DELETE to void; a voided sale is not restored.

    Expense:
      type: object
      description: |
        The farm's own accounting. It has no worker and it never touches
        anybody's ledger — see the note on the /v1/expenses section.
      required: [id, concept, amountCents, localDay, target]
      properties:
        id: { type: string, format: uuid }
        concept: { type: string }
        amountCents: { type: integer, format: int64 }
        localDay: { type: string, format: date-time }
        target:
          type: string
          enum: [activity, plot]
          description: |
            RSP-031's "tipo de gasto", derived from which column is set, so a
            form can round-trip the select without working it out.
        activityId: { type: string, format: uuid, nullable: true }
        activity: { type: string, nullable: true }
        plotId: { type: string, format: uuid, nullable: true }
        plot: { type: string, nullable: true }
        plotCropId: { type: string, format: uuid, nullable: true }
        crop: { type: string, nullable: true }
        receiptId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        deletedAt: { type: string, format: date-time, nullable: true }

    ExpenseInput:
      type: object
      required: [concept, amountCents]
      properties:
        id: { type: string, format: uuid }
        concept: { type: string, minLength: 1 }
        amountCents: { type: integer, format: int64, minimum: 1 }
        localDay: { type: string, format: date }
        activityId:
          type: string
          format: uuid
          nullable: true
          description: Exactly one of activityId or plotId. Both, or neither, is EXPENSE_TARGET_INVALID.
        plotId: { type: string, format: uuid, nullable: true }
        plotCropId:
          type: string
          format: uuid
          nullable: true
          description: Needs its plotId, and must really be planted in it.
        receiptId: { type: string, format: uuid, nullable: true }
        note: { type: string, nullable: true }

    ExpensePatch:
      allOf:
        - $ref: "#/components/schemas/ExpenseInput"
        - type: object
          properties:
            status: { type: string, enum: [active, inactive] }

    Attachment:
      type: object
      description: |
        A pointer into storage — never bytes in Postgres. Two states, and the
        second is reached by the server counting, not by the client claiming.
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, ready]
          description: |
            `pending` — the row exists, the bytes have not arrived, and nothing
            may point at it. `ready` — the bytes are stored and were measured.
        purpose: { type: string, nullable: true }
        originalName: { type: string, nullable: true }
        contentType:
          type: string
          nullable: true
          description: Sniffed from the bytes. Not what the upload declared.
        bytes:
          type: integer
          format: int64
          nullable: true
          description: What the server counted. Null while pending.
        sha256: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }

    UploadRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        purpose:
          type: string
          description: |
            A label for an operator ("worker-photo", "sale-receipt"). It
            constrains nothing: what an attachment may be hung on is decided by
            the foreign keys, not by a string.
        filename: { type: string }
        contentType:
          type: string
          description: Advisory. The server sniffs the real one from the bytes.
        bytes:
          type: integer
          format: int64
          description: |
            Advisory, and not stored. Over 5 MB it saves the client an upload
            it was about to be refused; it is not the check.

    UploadTicket:
      type: object
      required: [attachment, uploadUrl, uploadMethod, maxBytes]
      properties:
        attachment: { $ref: "#/components/schemas/Attachment" }
        uploadUrl:
          type: string
          description: |
            Where to PUT the bytes. Relative: the client already knows the host
            it is talking to, and a server guessing its own public URL guesses
            wrong behind the first proxy it meets. It points back at this
            service today and at a bucket the day there is one.
        uploadMethod: { type: string, example: PUT }
        maxBytes: { type: integer, format: int64, example: 5242880 }
        acceptedTypes:
          type: array
          items: { type: string }

    # -------------------------------------------------------------------------
    # Reports
    #
    # Read ReportTotals first: it is the shape every figure in this section
    # takes, and it is where the "no zero ever means I do not know" rule is
    # actually enforced.
    # -------------------------------------------------------------------------

    ReportTotals:
      type: object
      description: |
        What a report row adds up to, plus the two admissions it is not allowed
        to leave out. `kg` and `valueCents` are NULLABLE and a null is "this
        could not be established", which is a different fact from 0. The counts
        beside them say how much of the figure is missing, so a partial sum can
        never be read as a whole one.
      required:
        [records, kg, recordsNotInKg, valueCents, recordsWithoutValue, valueIsEstimate]
      properties:
        records:
          type: integer
          description: Weighings behind this row. A real count; zero means zero.
        kg:
          type: number
          nullable: true
          description: |
            Kilos, summed over the weighings that could be expressed in kilos,
            and null when not one of them could. A quantity is stored in a work
            unit, and a farm may invent one — "canasta" — with no `kgFactor`.
            Multiplying by a factor that is not there is how a report invents
            harvest, so those weighings are left out and counted below.
        recordsNotInKg:
          type: integer
          description: Weighings left out of `kg` because their unit does not convert.
        valueCents:
          type: integer
          format: int64
          nullable: true
          description: |
            What those weighings are worth: the settled amount where a
            settlement paid one, otherwise the record's frozen amount,
            otherwise the quantity at the price in force for its week — the
            number a settlement would post today. Null when not one of them
            could be priced.
        recordsWithoutValue:
          type: integer
          description: Weighings left out of `valueCents`.
        valueIsEstimate:
          type: boolean
          description: |
            True when any weighing in this row is priced by its week rather
            than by a settlement or a frozen amount: what the farm OWES rather
            than what it has paid. The two must never look alike.

    ReportWeek:
      allOf:
        - $ref: "#/components/schemas/ReportTotals"
        - type: object
          required: [weekStart, pickers, days, priceCents, finished]
          properties:
            weekStart: { type: string, format: date }
            pickers: { type: integer, description: Distinct people who worked that week. }
            days: { type: integer, description: Distinct calendar days worked. }
            priceCents:
              type: integer
              format: int64
              nullable: true
              description: |
                What a unit was worth that week: the owner's override if there
                is one, otherwise the farm's standing price. Null only if the
                farm has no standing price at all, which the schema forbids —
                so a null here is a broken farm saying so, not a free week.
            finished:
              type: boolean
              description: |
                The week is over. A running week's total is not comparable with
                a finished one; a list that did not mark it would invite the
                comparison by eye.

    ReportWeeksResult:
      type: object
      required: [scope, items]
      properties:
        scope: { $ref: "#/components/schemas/ReportScope" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReportWeek" }

    ReportScope:
      type: string
      enum: [harvest]
      description: |
        What these figures cover: work paid by the unit of work — the same
        filter /v1/pickups applies. A day's wage has no kilos and is not
        counted, so a week's `valueCents` is what the PICKING was worth and
        never the week's whole payroll.

    ReportGridCell:
      allOf:
        - $ref: "#/components/schemas/ReportTotals"
        - type: object
          required: [column]
          properties:
            column:
              type: string
              nullable: true
              description: |
                The day (`YYYY-MM-DD`) in the day grid, or the plot crop id in
                the crop grid. Null in the crop grid is the unattributed
                column — see `unattributed` on the grid.

    ReportGridRow:
      type: object
      required: [workerId, name, cells, total]
      properties:
        workerId: { type: string, format: uuid }
        name: { type: string }
        cells:
          type: array
          items: { $ref: "#/components/schemas/ReportGridCell" }
        total: { $ref: "#/components/schemas/ReportTotals" }

    ReportGridColumn:
      type: object
      required: [key, label, total]
      properties:
        key:
          type: string
          nullable: true
          description: The day or the plot crop id. Null is the unattributed column.
        label: { type: string }
        total: { $ref: "#/components/schemas/ReportTotals" }

    ReportUnattributed:
      type: object
      description: |
        Present only when the crop grid has a null column, and the only way to
        tell its two causes apart. Without it that column would be a silent
        bucket.
      required: [noCropLink, sharedAcrossCrops]
      properties:
        noCropLink:
          type: integer
          description: Weighings that name no crop at all.
        sharedAcrossCrops:
          type: integer
          description: |
            Weighings that name more than one, so attributing them to either
            would double-count the grid or halve somebody's work on a guess.

    ReportGrid:
      type: object
      description: |
        A whole table. The row totals, the column totals and `total` are folded
        from the same cells, so they agree — and the suite asserts the
        agreement in both directions anyway, because deriving them together is
        a promise and not a proof.
      required: [columns, rows, total]
      properties:
        columns:
          type: array
          items: { $ref: "#/components/schemas/ReportGridColumn" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ReportGridRow" }
        total: { $ref: "#/components/schemas/ReportTotals" }
        unattributed: { $ref: "#/components/schemas/ReportUnattributed" }

    ReportWeekDetail:
      type: object
      required: [scope, weekStart, finished, byDay, byCrop, total]
      properties:
        scope: { $ref: "#/components/schemas/ReportScope" }
        weekStart: { type: string, format: date }
        finished: { type: boolean }
        byDay: { $ref: "#/components/schemas/ReportGrid" }
        byCrop: { $ref: "#/components/schemas/ReportGrid" }
        total: { $ref: "#/components/schemas/ReportTotals" }

    ReportCropWeek:
      allOf:
        - $ref: "#/components/schemas/ReportTotals"
        - type: object
          required: [weekStart, pickers, days, finished]
          properties:
            weekStart: { type: string, format: date }
            pickers: { type: integer }
            days: { type: integer }
            finished: { type: boolean }

    ReportCrop:
      allOf:
        - $ref: "#/components/schemas/ReportTotals"
        - type: object
          required:
            [scope, plotCropId, label, pickers, days, firstOn, lastOn, areaHa,
             kgPerHa, sharedRecords, byWeek]
          properties:
            scope: { $ref: "#/components/schemas/ReportScope" }
            plotCropId: { type: string, format: uuid }
            label: { type: string, description: "Crop, variety and plot, as a person would say it." }
            pickers: { type: integer }
            days: { type: integer }
            firstOn: { type: string, format: date, nullable: true }
            lastOn: { type: string, format: date, nullable: true }
            areaHa:
              type: number
              nullable: true
              description: |
                The crop's OWN declared hectares. Deliberately not the plot's
                as a fallback: a plot with two crops would hand the whole area
                to each, and half of a real number is worse than a null.
            kgPerHa:
              type: number
              nullable: true
              description: Null when the area was never declared or the kilos are not known.
            sharedRecords:
              type: integer
              description: |
                Weighings on this crop that also name another one. Counted here
                in full, so the same kilos may appear again under the other
                crop — which is why the count is sent rather than a silent split.
            byWeek:
              type: array
              description: The evolution, newest first.
              items: { $ref: "#/components/schemas/ReportCropWeek" }

    WorkerPerformance:
      allOf:
        - $ref: "#/components/schemas/ReportTotals"
        - type: object
          required: [workerId, name, days, kgPerDay, index, comparableDays, trend]
          properties:
            workerId: { type: string, format: uuid }
            name: { type: string }
            days: { type: integer }
            kgPerDay:
              type: number
              nullable: true
              description: |
                Effective output — not per weighing, which only says how big a
                sack somebody carries, and not total kilos, which rewards
                attendance. Null when the kilos are not known.
            index:
              type: number
              nullable: true
              description: |
                This picker against the mates who worked the same crop the same
                day, with this picker taken out of the benchmark, averaged over
                daily ratios. 1.0 is "exactly what the people beside them did".

                NULL, never a low number, for anybody with fewer than
                `minComparableDays` days of comparison. `reason` says which.
            comparableDays:
              type: integer
              description: Days on which at least three people worked the same crop.
            reason:
              type: string
              enum: [not_enough_comparable_days, no_records_in_kilos]
              description: Why there is no index. Absent when there is one.
            trend:
              type: number
              nullable: true
              description: |
                The same index over the recent half of the window divided by
                the earlier half: above 1 improving, below 1 slipping. Null
                unless both halves carry at least four days, or the arrow would
                be decided against a single outlying day.

    ReportPerformanceResult:
      type: object
      required: [scope, days, since, minComparableDays, items]
      properties:
        scope: { $ref: "#/components/schemas/ReportScope" }
        days: { type: integer }
        since:
          type: string
          format: date
          description: |
            The first day of the window, in the FARM's calendar. The phone says
            `date('now','localtime')`, which on a server is UTC — an
            unconverted port shifts the window by up to a day at each end and
            silently changes who is inside a comparison.
        minComparableDays: { type: integer }
        items:
          type: array
          description: Best index first, everybody without one after them — never interleaved.
          items: { $ref: "#/components/schemas/WorkerPerformance" }

    Anomaly:
      type: object
      required: [recordId, workerId, worker, crop, quantity, kg, date, rule, reference]
      properties:
        recordId: { type: string, format: uuid }
        workerId: { type: string, format: uuid }
        worker: { type: string }
        crop: { type: string, nullable: true }
        quantity: { type: number }
        kg: { type: number, nullable: true }
        date: { type: string, format: date }
        rule:
          type: string
          enum: [impossible, duplicate, digit, outlier, future]
        reference:
          type: number
          nullable: true
          description: |
            What the quantity was judged against: the ceiling for `impossible`,
            the twin's own weight for `duplicate`, this person's other loads for
            `digit`, the mates' average for `outlier`. NULL for `future`, where
            there is nothing to compare against — the phone put a 0 there, and a
            0 in this field reads as "compared against nothing".

    ReportAnomaliesResult:
      type: object
      required: [scope, days, maxKg, limit, since, items]
      properties:
        scope: { $ref: "#/components/schemas/ReportScope" }
        days: { type: integer }
        maxKg: { type: number }
        limit: { type: integer }
        since: { type: string, format: date }
        items:
          type: array
          items: { $ref: "#/components/schemas/Anomaly" }

    HarvestWeekTotal:
      type: object
      required: [weekStart, kg]
      properties:
        weekStart: { type: string, format: date }
        kg:
          type: number
          nullable: true
          description: Null is a week whose kilos could not be established, never a week of nothing.

    HarvestShape:
      type: object
      required: [peak, fallingWeeks, windingDown]
      properties:
        peak:
          allOf: [{ $ref: "#/components/schemas/HarvestWeekTotal" }]
          nullable: true
          description: |
            The finished week with the highest yield so far, or null when there
            is not one finished week to look at. Never a zero-valued week: "no
            peak yet" and "a peak of nothing" are different answers.
        fallingWeeks:
          type: integer
          description: Consecutive finished weeks that fell by more than 25%.
        windingDown:
          type: boolean
          description: |
            Two falling weeks AND the peak already behind us. Two alone could
            be rain; both together is the season ending, which is when moving
            people to another plot pays off.
        reason:
          type: string
          enum: [no_finished_weeks]
          description: |
            Why there is no reading. Absent when there is one. Without it a
            season that has barely started is indistinguishable from a healthy
            one with no decline in it.

    HarvestCurve:
      type: object
      required: [scope, plotCropId, currentWeek, weeks, shape, weeksWithoutKilos]
      properties:
        scope: { $ref: "#/components/schemas/ReportScope" }
        plotCropId: { type: string, format: uuid, nullable: true }
        currentWeek: { type: string, format: date }
        weeks:
          type: array
          description: Newest first, as the query returns them.
          items: { $ref: "#/components/schemas/HarvestWeekTotal" }
        shape: { $ref: "#/components/schemas/HarvestShape" }
        weeksWithoutKilos:
          type: integer
          description: |
            Weeks in the series left out of the reading because their kilos
            could not be established. A reading taken over a series with holes
            in it is not the same reading, and this is the only way to know.

    # -------------------------------------------------------------------------
    # Sync
    # -------------------------------------------------------------------------

    SyncEntity:
      type: string
      description: |
        The wire name of a table, which is the handset's name and not the
        server's: the handset knows `worker`, `crop` and `workRecord`.

        Direction is per entity and is not symmetric (§2 of
        docs/sincronizacion.md). `worker`, `workRecord` and `ledgerEntry` travel
        both ways. `farmConfig`, `plot`, `crop`, `weekPrice` and `settlement`
        only come down; pushing one is refused with its reason.
      enum: [farmConfig, worker, plot, crop, weekPrice, workRecord, settlement, ledgerEntry]

    SyncHandshakeInput:
      type: object
      required: [deviceId, schemaVersion]
      properties:
        deviceId:
          type: string
          format: uuid
          description: Stable, generated once on the handset.
        appVersion: { type: string }
        schemaVersion:
          type: integer
          description: |
            The handset's local `user_version`. Below 6 the answer is 409
            SCHEMA_TOO_OLD and nothing else happens.
        cursor:
          type: integer
          format: int64
          description: Where the handset is. 0 the first time.

    SyncHandshake:
      type: object
      required: [farmId, timezone, currency, minorUnit, serverTime, cursor, behind, role, capabilities]
      properties:
        farmId: { type: string, format: uuid }
        timezone:
          type: string
          description: |
            The farm's IANA zone. With it the handset computes the same
            `localDay` and `weekStart` the server's trigger computes — which is
            what makes a Sunday-evening weighing land in the same week on both
            sides.
        currency: { type: string }
        minorUnit: { type: integer }
        serverTime: { type: string, format: date-time }
        cursor:
          type: integer
          format: int64
          description: Where the server is now.
        behind:
          type: integer
          format: int64
          description: |
            How many changes the handset has still to receive. It is what turns
            the status chip from a spinner into a number a person can act on
            before they leave the lot.
        role: { $ref: "#/components/schemas/Role" }
        capabilities:
          type: object
          required: [settleOffline, writePlots, writeWeekPrices]
          properties:
            settleOffline: { type: boolean }
            writePlots: { type: boolean }
            writeWeekPrices: { type: boolean }

    SyncPushOp:
      type: object
      required: [opId, entity, op, payload]
      properties:
        opId:
          type: string
          format: uuid
          description: |
            The idempotency key of the ENVELOPE. Recorded with its result, so a
            resend returns the same answer rather than performing the act a
            second time.
        entity: { $ref: "#/components/schemas/SyncEntity" }
        op:
          type: string
          enum: [upsert, append]
          description: |
            `append` for the ledger, `upsert` for everything else. There is no
            `delete`: a deletion is an upsert carrying `deletedAt`.
        payload:
          type: object
          additionalProperties: true
          description: |
            The row, in the handset's vocabulary. Unknown fields are a 400 for
            that envelope on purpose — a field silently dropped shows up as a
            missing note three weeks later.

            `worker`: id, name, lastName, documentType, docId, tag, createdAt,
            deletedAt.

            `workRecord`: id, workerId, cropId, quantity, occurredAt, note,
            deviceId, deletedAt. `occurredAt` is an RFC3339 INSTANT WITH ITS
            OFFSET, never a bare day: the farm's calendar day is written by the
            server's trigger from the farm's own timezone, and Go never
            computes it.

            `ledgerEntry`: id, workerId, kind, amountCents, date, method, note.
            `kind` is pago, anticipo, deduccion or ajuste — a `devengo` is
            written by POST /v1/settlements and only travels down.

    SyncPushInput:
      type: object
      required: [deviceId, ops]
      properties:
        deviceId: { type: string, format: uuid }
        ops:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/SyncPushOp" }

    SyncOpResult:
      type: object
      required: [opId, status]
      properties:
        opId: { type: string, format: uuid }
        status:
          type: string
          enum: [applied, duplicate, rejected]
          description: |
            `applied` — written. `duplicate` — it was already here, which after
            a lost response is the normal case and is a success. `rejected` —
            it will not be written, and `error.code` says whether the handset
            should retry, treat it as done, or put it in front of a person.
        id:
          type: string
          format: uuid
          description: The row this envelope names, on applied and duplicate.
        error: { $ref: "#/components/schemas/SyncOpError" }

    SyncOpError:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string }
        details:
          type: object
          additionalProperties: true

    SyncPushResult:
      type: object
      required: [cursor, results]
      properties:
        cursor:
          type: integer
          format: int64
          description: Where the feed is after the batch; the handset may pull from here.
        results:
          type: array
          items: { $ref: "#/components/schemas/SyncOpResult" }

    SyncChange:
      type: object
      required: [seq, entity, op, row]
      properties:
        seq: { type: integer, format: int64 }
        entity: { $ref: "#/components/schemas/SyncEntity" }
        op: { type: string, enum: [upsert, append] }
        row:
          type: object
          additionalProperties: true
          description: |
            The row as it stands now, composed from the real table at pull time.

            `settlement` carries its `items` — always, never a header alone.
            `workRecord` carries only work paid by the unit of work; a day's
            wage on a screen that only knows how to show kilos is worse than
            nothing, which is what GET /v1/pickups/{id} already decided.

    SyncPull:
      type: object
      required: [changes, cursor, more]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/SyncChange" }
        cursor:
          type: integer
          format: int64
          description: |
            The last `seq` consumed — which is not always the last `seq`
            RETURNED, because a change whose body this caller may not see is
            skipped while its seq is still consumed. The handset applies the
            batch in seq order in one transaction and only then advances to
            here; a cut halfway leaves the cursor where it was and the batch
            repeats, and applying an upsert by uuid twice is a no-op.
        more: { type: boolean }
        balances:
          type: array
          description: |
            Present ONLY in the last batch, and only for owner and admin. A
            checksum: the handset recomputes and compares, and a difference is
            a worker to flag, never a number to copy.
          items:
            type: object
            required: [workerId, balanceCents]
            properties:
              workerId: { type: string, format: uuid }
              balanceCents: { type: integer, format: int64 }

    # -------------------------------------------------------------------------
    # Season import
    # -------------------------------------------------------------------------

    SeasonImportInput:
      type: object
      required: [deviceId, balances]
      description: |
        The handset's whole season, in dependency order. The order of the fields
        is the order they are written, and it is the same receiving order the
        feed uses: references first — people, lots, crops, prices — and only
        then work and money.
      properties:
        deviceId:
          type: string
          format: uuid
          description: An import is a named handset's season, not an anonymous file.
        workers:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
                format: uuid
                description: The handset's own uuid. It becomes the employee's id.
              name: { type: string }
              lastName: { type: string, nullable: true }
              documentType: { type: string, nullable: true }
              docId: { type: string, nullable: true }
              tag: { type: string, nullable: true }
              createdAt: { type: string, format: date-time, nullable: true }
              deletedAt: { type: string, format: date-time, nullable: true }
        plots:
          type: array
          description: |
            One entry per crop on the handset. The `plot_crop` is written with
            `cropId` as its id — it inherits the handset's uuid, because that is
            what the weighings point at — and a plot is created around it with
            an id of its own.
          items:
            type: object
            required: [cropId, name]
            properties:
              cropId: { type: string, format: uuid }
              name: { type: string }
              cropType: { type: string }
              variety: { type: string, nullable: true }
              areaHa: { type: number, nullable: true }
              deletedAt: { type: string, format: date-time, nullable: true }
        weekPrices:
          type: array
          items: { $ref: "#/components/schemas/WeekPrice" }
        workRecords:
          type: array
          description: |
            The weighings. Each becomes a work record of the seeded harvest
            activity, `rateSource: weekly_price`, with the activity's unit and
            `quantity` = the weight. `localDay` is never sent: the trigger
            computes it from the farm's timezone.
          items:
            type: object
            required: [id, workerId, quantity, occurredAt]
            properties:
              id: { type: string, format: uuid }
              workerId: { type: string, format: uuid }
              cropId: { type: string, format: uuid, nullable: true }
              quantity: { type: number }
              occurredAt: { type: string, format: date-time }
              note: { type: string, nullable: true }
              deviceId: { type: string, format: uuid, nullable: true }
              deletedAt: { type: string, format: date-time, nullable: true }
        settlements:
          type: array
          items:
            type: object
            required: [id, workerId, periodStart, periodEnd, grossCents, items]
            properties:
              id: { type: string, format: uuid }
              workerId: { type: string, format: uuid }
              periodStart: { type: string, format: date }
              periodEnd: { type: string, format: date }
              grossCents: { type: integer, format: int64 }
              status: { type: string, enum: [open, void] }
              note: { type: string, nullable: true }
              createdAt: { type: string, format: date-time, nullable: true }
              voidedAt: { type: string, format: date-time, nullable: true }
              items:
                type: array
                items:
                  type: object
                  required: [payableId, weekStart, quantity, priceCents, amountCents]
                  properties:
                    id: { type: string, format: uuid }
                    payableId:
                      type: string
                      format: uuid
                      description: |
                        The weighing's own uuid, unchanged. This is the column
                        the anti double-pay index lives on, and it is why the
                        money survives the move without being remapped.
                    weekStart: { type: string, format: date }
                    quantity: { type: number }
                    priceCents: { type: integer, format: int64 }
                    amountCents:
                      type: integer
                      format: int64
                      description: |
                        Must equal round(quantity × priceCents). The database
                        checks it; a line that does not add up refuses the whole
                        import.
                    voidedAt: { type: string, format: date-time, nullable: true }
        ledger:
          type: array
          description: |
            Every movement, with `settlementId` and `reversesId` resolved by
            uuid. Reversals are written last, because the trigger that checks a
            reversal reads the row it cancels.
          items:
            type: object
            required: [id, workerId, kind, amountCents, date]
            properties:
              id: { type: string, format: uuid }
              workerId: { type: string, format: uuid }
              kind: { $ref: "#/components/schemas/LedgerKind" }
              amountCents:
                type: integer
                format: int64
                description: |
                  With the ledger's own sign, not a friendly positive: a `pago`
                  is negative and the database refuses a positive one outright.
              date: { type: string, format: date }
              method: { type: string, nullable: true }
              note: { type: string, nullable: true }
              settlementId: { type: string, format: uuid, nullable: true }
              reversesId: { type: string, format: uuid, nullable: true }
              createdAt: { type: string, format: date-time, nullable: true }
        balances:
          type: array
          description: |
            REQUIRED, and it is the reason this endpoint can be trusted. What
            the handset's own BALANCE_SQL says each worker's position is. It is
            not imported — nothing derived is ever stored — it is what the
            server checks its own derivation against, to the cent, before the
            transaction commits.
          items:
            type: object
            required: [workerId, balanceCents]
            properties:
              workerId: { type: string, format: uuid }
              balanceCents: { type: integer, format: int64 }

    ImportCounts:
      type: object
      required: [written, skipped]
      properties:
        written: { type: integer }
        skipped:
          type: integer
          description: Already here. On a re-run this is the whole file.

    SeasonImportReport:
      type: object
      required: [workers, plots, crops, weekPrices, workRecords, settlements, settlementItems, ledger, balancesChecked, liveItems]
      properties:
        workers: { $ref: "#/components/schemas/ImportCounts" }
        plots: { $ref: "#/components/schemas/ImportCounts" }
        crops: { $ref: "#/components/schemas/ImportCounts" }
        weekPrices: { $ref: "#/components/schemas/ImportCounts" }
        workRecords: { $ref: "#/components/schemas/ImportCounts" }
        settlements: { $ref: "#/components/schemas/ImportCounts" }
        settlementItems: { $ref: "#/components/schemas/ImportCounts" }
        ledger: { $ref: "#/components/schemas/ImportCounts" }
        balancesChecked:
          type: integer
          description: |
            How many workers' balances were compared and agreed. Reported even
            when it passes: a number only printed when it is wrong is a number
            nobody ever sees be right.
        liveItems:
          type: integer
          description: Live settlement lines on the farm after the import.
