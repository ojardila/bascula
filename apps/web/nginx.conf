# Serving the built SPA. Routing to /v1 and /health is the HTTPRoute's job,
# not this file's — nothing here proxies anything.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Vite fingerprints everything under /assets, so those filenames change
    # whenever their contents do and can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        # The landing videos' caption tracks: not in every nginx mime.types.
        location ~* \.vtt$ {
            default_type text/vtt;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
    }

    # index.html must NOT be cached: it is the file that names the current
    # asset hashes, so a stale copy points the browser at bundles that the
    # last deploy deleted, and the app comes up blank.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The service worker and what it reads to decide whether there is a new
    # version. Cached, a deploy would never reach an installed phone.
    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # BrowserRouter means /settlements/42 is a client-side route with no file
    # behind it. Without this fallback a refresh on any page but "/" is a 404.
    # `/` is served as a directory index, not via the = /index.html location
    # above, so it needs its own no-cache or Cloudflare stores it for an hour
    # (max-age=3600) and a deploy is invisible until that expires.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Distinguishes "the container is up" from "the API answered", which the
    # app's own /health check cannot do — that one is proxied to the API.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app is same-origin with its API and loads nothing from anywhere else.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
