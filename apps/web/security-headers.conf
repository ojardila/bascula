# Included in EVERY location of nginx.conf. nginx only inherits add_header
# from the server block into locations that set no add_header of their own,
# and every location there sets Cache-Control, so headers declared once at
# server level were sent on no response at all.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;
# Enforced: the parts that cannot break a page. No framing (clickjacking), no
# plugins, no <base> hijack, forms post only here.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
# Reported only, until the browser console shows it breaks nothing: the full
# policy the app should live under. MUI/emotion injects <style> elements, so
# style-src needs 'unsafe-inline'; the landing's contact form posts to
# formsubmit.co; fonts come from Google.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://formsubmit.co; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
