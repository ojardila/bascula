# Included in EVERY location of nginx.conf. nginx only inherits add_header
# from the server block into locations that set no add_header of their own,
# and every location there sets Cache-Control, so headers declared once at
# server level were sent on no response at all.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;
# The app loads nothing it does not ship except Google Fonts, and posts the
# landing's contact form to formsubmit.co. MUI/emotion injects <style>
# elements, so style-src needs 'unsafe-inline'; scripts do not. Printing uses
# an iframe srcdoc (inherits this policy; inline <style> and data: images
# only) and downloads use blob: links, which CSP does not govern. Checked on
# bascula.engp.io v0.2.49 with the same policy in Report-Only: no inline
# scripts, no inline handlers, no other origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://formsubmit.co; worker-src 'self'; manifest-src 'self'; frame-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
